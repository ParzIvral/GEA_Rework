 guides.76.b:0 "查看新编布布指南"
 guides.77.t:0 "布尔什维克指南"
 guides.77.d:0 "问：季诺维也夫？\n答：提高季诺维也夫派的影响力，任命克列斯廷斯基为书记，完成国策“净化革命”。\n\n问：莫洛托夫？\n答：提高莫洛托夫派的影响力，任命丘茨卡耶夫为书记。内战后“全俄第六届苏维埃司法工作者代表大会”选一或二项，“契卡的未来”选第二项，在内战结束后解散劳动国防委员会，让加里宁或弗拉基米尔斯基执掌中央执行委员会，让季诺维也夫下台。“季诺维也夫的反应”选“接受提议”。\n\n问：卡冈诺维奇？\n答：让莫洛托夫上台，选与卡冈诺维奇相左的选项，不要点国策“钢铁政委”，等待一段时间卡冈诺维奇就会政变上台。之后，“契卡/政治保卫局的阴谋”事件选第一个。\n\n问：亚戈达/叶若夫？\n答：让莫洛托夫上台，再让卡冈诺维奇上台，“契卡/政治保卫局的阴谋”事件选第二个，亚戈达就会推翻卡冈诺维奇。之后，在“权力问题”事件中让马林科夫领导政府，就能留住亚戈达。\n要让叶若夫上台的话，需在“阿格拉诺夫反苏阴谋”事件中选择“叶若夫同志将成为新任内务部首脑”。\n\n问：拉狄克/皮亚特尼茨基国际派？\n答：让亚戈达上台，在“苏维埃国家的文化现代化”事件中选择“有人又得叽叽喳喳，扣修正主义帽子了，算了吧”。在“权力问题”事件中选择“应当提请中央全会作出决议”。\n\n问：马雅可夫斯基？\n答：让莫洛托夫上台，完成国策“意识形态警惕性”，在“苏维埃国家的文化现代化”事件中选择“做吧！我们需要强力的国家内务委员会！”。而后进入卡冈诺维奇线，再让亚戈达发动政变。最后在“权力问题”事件中选择“应当提请中央全会作出决议”。\n\n问：加斯捷夫？\n答：请参见人民社会党的工人反对派。"
