 guides.6.d:0 "想让谁来避免二次内战呢？"
 guides.6.a:0 "加纳"
 guides.6.b:0 "诺里斯"
 guides.6.c:0 "兰登/柯蒂斯"
 guides.7.t:0 "美利坚合众国指南"
 guides.7.d:0 "加纳避免内战：\n\n优先完成财政紧缩国策，触发财政紧缩提案事件链。在“财政紧缩法案”事件中选择求助休伊·朗或建制联盟，之后事件中选择说服其他党派来通过法案。\n\n最快速度点完“无极端分子容身之地”国策，然后完成下面一系列的国策。“埃德加·胡佛的提案”事件中支持胡佛的提议，然后在决议中开始调查。对于美利坚至上党和旧民主党依靠调查能彻底压制。在调查海伍德后调查白劳德，然后会出现刺杀社会党高层事件，选择批准胡佛的计划。\n\n最后配合加纳的独特决议和其他压制激进党派影响的决议把三个激进党派的政治力量压低到15%来根除影响力。"
 guides.7.a:0 "哇哦"
 guides.7.b:0 "返回"
 guides.8.t:0 "美利坚合众国指南"
 guides.8.d:0 "诺里斯避免内战：\n\n优先完成国策“国家的干预之手”。当跳出“诺里斯主张经济干预”事件时，选择“承诺将欺诈者们绳之以法”选项，解锁后续的谈判事件链。\n\n在后续的谈判中对朗和海伍德妥协，同时优先完成国策树中间的一系列国策来压制旧民主党。在事件“处理旧民主党”中听从麦克阿瑟的建议。\n\n一切都听从麦克阿瑟的建议，同时不要逮捕南卡罗来纳的布莱斯。然后事件中增加麦克阿瑟的预算。但同时要确保军方影响力不要大于70%\n\n最后配合诺里斯的独特决议和其他压制激进党派影响的决议把三个激进党派的政治力量压低到15%来根除影响力。（若要彻底移除“无形帝国”减益，需要先完成“对3k党的最终之战”，再执行三次“调集人手打击3k党”决议，并等待后续事件链结束。）"
 guides.8.a:0 "哇哦"
 guides.8.b:0 "返回"
 guides.9.t:0 "美利坚合众国指南"
 guides.9.d:0 "柯蒂斯/兰登\n\n-等待一月中旬的就职典礼，并且完成国策“中道为胜”触发谈判事件。\n\n在谈判中如果选择优先跟社会党谈判,在决议中推荐优先聚焦旧民主党。在后续“海伍德要求工人自治”事件中选择同意海伍德的提议。之后同意海伍德的资助要求。后续事件选择跟社会党走到底，之后达成妥协能遏制住社会党政治力量增长。之后完成“终结反政府组织”开始通过决议调查来处理至上党和旧民主党。兰登的打击旧民主党的决议需要完成“肢解种族隔离”国策，柯蒂斯则完成“终结反政府组织”即可。\n\n如果选择跟所有激进党派谈判（更加快速的避免内战），在谈判开始时选择第二个选项，之后允许威廉·H·默里和朗参加谈判，同意关于自治的要求。之后同意资助并同意默里的妥协方案。触发事件“激进派极度不满！”时依旧同意，之后要求激进党派削弱民兵。再同意麦克阿瑟的后续要求。剩下的就靠决议来降低激进党派的政治力量即可。"
