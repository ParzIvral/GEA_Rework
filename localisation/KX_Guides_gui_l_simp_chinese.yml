 guides.123.t:0 "德属东亚指南"
 guides.123.d:0 "问：巴林死后如何选出各种德属东亚领导人？\n\n答：在“柏林当局任命新政府”事件中直接选阿尔伯特·哈尔（社保）、瓦尔德克和皮尔蒙特的约西亚斯亲王（威民）、威廉·海耶（家独）、蒂洛·弗赖赫尔·冯·维尔莫夫斯基男爵（威民）、弗里茨·特尔·梅尔（家独）。\n\n选择海耶并打输印度支那大起义，将可以选择费利克斯·冯·卢克纳尔伯爵或费迪南德舍尔纳接管殖民地。如果选择海耶打赢印度支那战争，有机会选择威廉·海耶的儿子赫尔穆特·海耶或费利克斯·冯·卢克纳尔伯爵上台。\n\n选择哈尔，避免印度支那叛乱并完成最后一个政治国策且战胜日本或和日本无条件和平后，在“呼吁开放选举”事件中选择“为了维持稳定，我们应该允许温和人士参加地方选举”，之后将触发选举事件，选举出从社保到社民的政党。\n\n舍尔纳在完成最后一个国策后将获得整个东亚的宣称，并解锁整合远东核心的决议。在德属东亚或德属东亚的傀儡控制全部宣称地块后通过决议可以拿到所有远东核心。\n\n问：如何放出越南？\n\n答：选阿尔伯特·哈尔，完成国策“重返越南宫廷”将开启与保大合作的事件链，同意他的全部要求会触发一个事件来切换为越南。（扮演越南能看到越南路线指南的详细信息）\n\n问：游玩卢克纳尔伯爵的海盗决议暴露了怎么办？\n\n答：当第二次暴露，柏林派遣调查组时，将会触发一系列事件链。\n如果选择从海盗查起，选择选项“地方线人的报告足以说明他们确实存在”“让我们去拜访福尔默少校”“先核实扣押的船只、赃物与嫌疑人”就能掩盖海盗行动的真相。\n如果选择从日本人查起，选择选项“这些商行的账目得仔细检查”“弄清楚中村究竟在替谁办事”“顺着日本人的海上劫案档案追查下去”就能掩盖海盗行动的真相。"
