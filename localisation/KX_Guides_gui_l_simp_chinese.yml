 guides.118.t:0 "比利时指南"
 guides.118.d:0 "问：莱昂·德格雷勒线？\n\n答：瓦隆的游戏规则里设定“君权人民阵线政权”、“君权人民阵线政变”，或者于事件“寻求支持对抗佛兰德”中选择“君权党‘搞定’了代表团”。\n事件“1936年2月17日骚动”，不要派遣军队。\n事件“独立运动支持率增长”，选择“我们现在不能浪费手中的任何资源”。\n事件“五一劳动节”，实行宵禁。\n事件“佛莱芒抵抗运动现状”，选择“撤回佛莱芒-布拉班特”。\n事件“瓦隆人听说了佛莱芒人的胜利”，选择“我们将接近佛莱芒的同胞，努力重建比利时”。\n事件“佛兰德收到来自瓦隆的提议”，选择“不，佛兰德选择独立！”\n佛兰德-瓦隆分裂，切到瓦隆。\n\n走阿达尔贝特君主制路线，宪政、专制皆可。\n一路点国策到收复佛兰德。\n在事件中游说德国支持，因为游戏规则设置或开头所说的事件选择，游说必定失败，政府陷入不稳。\n君权人民阵线成立后，若选择逮捕德格雷勒，其就会发动政变，这是进线最快的方法；若不逮捕，其就会参加选举，让君权人民阵线赢得选举。\n点完德格雷勒的国策后，可以选择安心于比利时、统一比荷卢或建立洛塔林吉亚、勃艮第，获得新核心。\n德格雷勒的所有路线都可以傀儡刚果，其名称会随本国名称变化。若在先前的事件中与超资本主义者结盟，桑吉耶的矿业联盟就可以统治市自的刚果；若在先前的事件中选择保留国王，可以让国王统治刚果。其余的人选还有若泽·斯特雷尔、维克托·马蒂斯、乔治·普罗斯珀·勒米、埃米尔·让森斯和德格雷勒。\n\n点完国策后，德格雷勒会遭刺杀。若其身亡，社民的费尔南·德乌斯、市自的奥古斯特·比塞雷、民粹的乔治·普罗斯珀·勒米、维克托·马蒂斯，以及若泽·斯特雷尔都可以继任，每人都拥有几个专属国策，以及专属的刚果领导人选。"
