 guides.75.t:0 "新英格兰指南"
 guides.75.d:0 "问：洛夫克拉夫特的新英格兰？\n\n答：先游玩加拿大，然后占领新英格兰之后触发事件，选择“设立总督”的选项，然后市民会起义进攻政府，在进攻事件中让市民胜利，然后洛夫克拉夫特会在几天后上台。\n\n问：君主制新英格兰？\n\n答：和洛夫克拉夫特一样，但让市民进攻政府的企图失败。\n\n问：华盛顿派和精英掌权？\n\n答：走君主制路线，然后选择不安抚本地精英，然后完成“赶跑红衫军”国策，这样就会触发关于美利坚君主制主义者的事件，不要选“我有个问题”这个选项。起义之后一个月，就会触发关于君主制主义者企图夺权的事件，给他们权力。再等一段时间，就会有事件问你选择谁来加冕。如果你想选华盛顿派，那就选择他们。如果你想选肯尼迪或者阿斯特，那就选他们吧。\n\n问：新英格兰救国军政府？\n\n答：与上一条路线的玩法相同，但不要让君主制主义者掌权。\n\n问：除贵格会外的左翼新英格兰（亲工团/莱蒙德）？\n\n答：跟着上面的指南让新英格兰独立，在选举民主党派后的事件“大罢工！”中选择“这算不上什么严重威胁！”之后若选择强硬派，则会被美团吞并，选其他的则是莱蒙德的贝拉米自然乌托邦社会主义线。\n\n问：莱蒙德继承者？\n\n答：走莱蒙德路线，完成国策树。一百天后，将触发三K党刺杀他的事件。让他们成功。（或者你也可以一直等到1944年他OTL的死期！）然后你就可以解锁继承者国策树了。\n\n问：洛夫克拉夫特的继承者？\n\n答：玩新英格兰，完成疯狂国度国策，一百天后爱手艺将会死去，解锁继承者国策树\n\n问：左翼洛夫克拉夫特？\n\n答：先按照上文走继承者国策树，不要废除种族法，继续完成种族法问题国策，对于目击洛夫克拉夫特的事件持续选择调查，直到他最终归来。（废除种族法或者不调查他可以让你继续完成继任者路线）\n\n问：詹姆斯·迈克尔·柯利的反洛夫克拉夫特政变？\n\n答：先正常走洛夫克拉夫特线，在点粉碎爱尔兰共和军的国策前先点出“吸纳信众”，之后柯利就会发动政变。这条线使用常规的社保线国策树，不过之后也可以正常举行选举，或操纵选举结果，建立新爱尔兰。"
 guides.75.a:0 "哇哦"
 guides.75.b:0 "看看别的路线指南"
 guides.76.t:0 "红俄指南"
 guides.76.d:0 "问：如何玩到红俄？（提示：你必须在通过宪法后的苏维埃紧急委员会上选择一个政党，委员会才会闭幕）\n答：有两种方法。\n一、不举行提前选举，让科尔尼洛夫发动政变，然后在接下来的事件中选择“权力归于人民”，此一方法会引爆内战。\n二、选人民社会党、孟什维克或社会革命党上台，三者的初始国策树结束时都可以选择转红俄。（注意：人民社会党上台需要你在社会主义者暴乱事件中选择驱散人群）\n\n问：布尔什维克/安人？\n答：让科尔尼洛夫发动政变，然后在接下来的事件中选择“权力归于人民”，别跟萨文科夫结盟（译注：原文如此，但实际上，与萨文科夫结盟并不影响走线），赢得内战，“二城一党”事件把人民社会党逐出人民阵线，“共党骚动”事件选第二个，不要关停革命委员会，这样布尔什维克就会发动政变，必须在内战期间完成以上操作。\n\n要走安人路线的话，需在布布上台后的“反布尔什维克抗议”事件中选择“无政府渣滓闭嘴，立刻镇压农民叛乱！”。并在“占领彼得格勒港口”事件中选择猛攻港口。\n\n问：我怎样才能解锁布哈林继承人的国策树？\n答：变身红俄，走布哈林路线，维持新经济政策，重建苏联，然后等布哈林去世（大约在重建苏联后的一年到一年半）。苏维埃大会将在一段时间内成为领导人，在一些事件（间隔颇长）之后，你将能够在国家工团主义的库兹涅佐夫、布哈林主义的柯西金或列宁主义的柳廷之间进行选择，解锁他们各自的国策树。\n\n问：我如何游玩菲什曼的契卡派政变或法制派反政变？\n答：变身俄罗斯社会主义共和国，选择左翼社革的领导人，点击“废除契卡”的国策，等到菲什曼和契卡政变的事件时，选择让他们获胜，契卡国策树就会解锁。请注意，菲什曼并不是马上就能成为领导人，他是在完成“重启征兵”的国策后才成为领导人。或在政变事件的后续中，选择让法制派获胜，就可以解锁法制派。\n\n问：我怎样才能游玩极权主义者萨文科夫？\n答：引发内战，让左翼社会革命党领导革命，当萨文科夫提出帮助时，选择接受。赢得内战，继续左翼社革路线，发动契卡政变（菲什曼），完成“对抗暴君的战争”的国策。只有在萨文科夫在内战期间加入你的两到三年后，当你用菲什曼完成国策时，才会出现一个让萨文科夫成为领导人的事件，所以你应该在事件被触发前完成左翼社会革命党契卡派路线，否则就玩不了。（没有新国策树）\n\n问：朱可夫/图哈切夫斯基/伏龙芝？\n答：内战期间接受图哈切夫斯基和伏龙芝。走布哈林线完成国策“新型政党”或者走左翼社革线完成国策“革命先锋”，不要理会赤色热月。若叶戈罗夫政变，那么在“与军队对峙”事件中选择“理应立即逮捕图哈切夫斯基！”。若华西列夫斯基政变，则在上述事件中选择“叶戈罗夫是我们的天然盟友”。"
