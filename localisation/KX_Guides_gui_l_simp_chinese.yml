 guides.73.t:0 "联盟国指南"
 guides.73.d:0 "整合主义美国（天主教美国）？\n作为联盟国，同意天主教志愿军，计划反天主教法案。在反天主教法案中，选择召开紧急会议。在下一个选举事件中，你就可以选择神圣美利坚联盟。然后你就可以创建超级巨大无敌神圣米国了。\n\n问：斯图亚特王室在火药阴谋中于联盟国掌权？\n答：如往常一样触发火药阴谋/整合主义路线，等待关于加冕美利坚君主的事件，选择支持斯图亚特而不是基督为王，然后王国路线会解锁。只有斯图亚特王朝能征服英格兰并变身不列颠尼亚帝国。\n\n问：斯图亚特王朝继承者？\n答：征服不列颠，过一段时间后一个访问伦敦的事件会触发。选择不听卡罗尔的，然后国王会死，你可以选择继承人。\n\n问：卡罗尔继承者？\n答：在选王事件中选择基督为王，完成国策树，选择美洲女皇外交线。征服并吞并墨西哥和加拿大。等一段时间，你会触发卡罗尔之死的事件。戴和史密斯——在国会事件链中选择改革派选项。费尼和卡莫迪——选择强硬派选项。富尔顿·申和库格林——温和派选项。肯尼迪或永恒摄政或让美国完蛋——依次支持每个派系从而不让任何派系获得优势。\n\n问：马林的市场自由主义路线？\n答：等待内战事件或完美民主开启选举，选他\n\n问：彭德格斯特/杜鲁门？\n答：玩朗的联盟国，等待一个彭德格斯特提出结盟的事件，拒绝他的交易，在之后的事件里不要调查他，他会政变。杜鲁门路线，在彭德格斯特上台后完成“彭德格斯特的参议员”这个国策。"
 guides.73.a:0 "哇哦"
 guides.73.b:0 "看看别的路线指南"

 guides.74.t:0 "新英格兰指南"
 guides.74.d:0 "问：新英格兰的贵格会/禁酒党？\n答：将新英格兰作为加拿大政府管辖下的临时政府释放，等待触发选举大会。在“宪法-政府制度”事件中，选择同意平等代表权，然后在接下来的事件中都选择支持激进社会主义/社会民主主义的选项，或者在其他方面支持左派。（同理，如果你想选其他党派则全选对应他们的。）然后你选择临时政府领导人的时候，克拉伦斯·皮克特上则是贵格会，大卫·利·科尔文上是禁酒党。选举结束后不久，将触发“大罢工”事件，选择拒绝加拿大援助。（其他民主党派同理）\n\n问：新英格兰的激进派（哨兵/残余）或联邦党人？\n答：先和贵格会路线一样，大罢工时寻求加拿大帮助。几天后触发事件告知你加拿大任命联邦党来控制局势，你可以决定允许他们掌权或者寻求激进派帮助（允许掌权则联邦党人上台，后者则会让激进派上台），激进派上台后你可以手动决定是哨兵还是残余派。（但是你的政治面版还不会改变，直到事件链结束）\n\n问：洛夫罗普·斯托达德的路线？\n答：让激进派掌控新英格兰，当激进派分裂时，选斯托达德。你可以与宪政国结盟（作为傀儡或者被吞并，需要宪政国赢得内战），如果宪政国失败，斯托达德可以与加拿大结盟。你也可以操他们全部然后尝试统一美国。\n\n问：真左人莱蒙德路线或者被联合工团和平吞并路线\n答：在“大罢工”事件中选择第三个选项"
 guides.74.a:0 "哇哦"
