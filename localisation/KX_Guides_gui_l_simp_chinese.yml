 guides.4.t:0 "美利坚合众国指南"
 guides.4.d:0 "问：如何让德克萨斯独立？\n\n答：若朗当选总统，不要让至上党控制德州，否决詹姆斯·奥尔雷德的辞职，放任德克萨斯的独立公投。\n若加纳当选总统，持续打击朗派，在“处理德克萨斯”事件中选择任其自生自灭，最后留任奥尔雷德。\n若胡佛当选总统，放任德克萨斯的地方自治计划，镇压德克萨斯的独立运动，派遣军队，不要让军队离开，再派遣国民警卫队。僵局状态的麦克阿瑟路线同上，但必须要快，联盟国爆出来就晚了。\n若海伍德或诺里斯当选总统，对德克萨斯经济采取强硬措施，不去管德士古，德克萨斯地方自治计划事件链的做法同胡佛。\n若默里当选总统，了结旧账，镇压三K党，逮捕奥尔雷德。\n注意，全程不要切换国家！"
 guides.4.a:0 "哇哦"
 guides.4.b:0 "返回"
 guides.5.t:0 "美利坚合众国指南"
 guides.5.d:0 "问：怎么让阿拉斯加独立？\n\n答：随便选个总统上台（实际上似乎需要选择朗或海伍德或默里），然后等待格鲁宁事件链的触发，选择“美国为我们做过什么”\n\n问：怎么让纽约独立？\n\n答：美国内战爆发之后，切换至美利坚联合工团，不久后会出现一个名为“纽约之战”的事件。选择战斗陷入僵局，在之后的“离去”事件中选择相信同志。这样纽约就会宣布独立。"
