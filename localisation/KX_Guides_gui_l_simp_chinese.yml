 guides.44.t:0 "外阿穆尔指南"
 guides.44.d:0 "高尔察克：\n一、若在完成最终国策“组建新一届最高统治者委员会”前，权力天平偏向任一方达到50%，高尔察克将死亡。\n二、人民革命军的抵抗度不能高于20%。\n三、社会保守主义的支持率不能高于34%。\n\n人民革命军的社会主义外阿穆尔：\n一、人民革命军的抵抗度高于20%。\n\n日属外阿穆尔：\n一、社会保守主义的支持率高于34%。\n\n君主主义外阿穆尔：\n一、使权力天平达到50%。在“无主政府”事件中选择“维稳方才是政府的头等要事”。\n二、在“阿塔曼行动”事件中选择“善意放行”。\n\n谢苗诺夫阿塔曼：\n一、使权力天平达到50%。在“无主政府”事件中选择“代表大会必须承担起国家的责任”。\n二、在“阿塔曼行动”事件中选择“善意放行”。\n\n“西伯利亚的苏沃洛夫”佩佩利亚耶夫：\n一、使权力天平达到50%。在“无主政府”事件中选择“维稳方才是政府的头等要事”。\n二、在“阿塔曼行动”事件中选择“在布拉戈维申斯克阻挡阿塔曼的部众”。\n\n民主外阿穆尔（社自、市自、社保）：\n一、使权力天平达到50%。在“无主政府”事件中选择“代表大会必须承担起国家的责任”。\n二、在“阿塔曼行动”事件中选择“尝试与谢苗诺夫进行谈判，拖延其推进”。\n三、在“与阿塔曼谈判”事件中选择“大会支持新的国家形势”。\n四、选举时可任意选择胜选政党。"
 guides.44.a:0 "哇哦"
 guides.45.t:0 "苏格兰指南"
 guides.45.d:0 "苏格兰走哪条路线同战争时向谁寻求帮助有关。战后完成国策“自由喀里多尼亚”后就可以解锁完整的政治国策树。\n\n詹姆斯派国王：向德国寻求帮助，他们会无条件同意一切，然后鲁普雷希特就可以当国王了。\n\n温莎国王：选择向“我们的旧主人”，即加拿大寻求帮助，他们会无条件同意一切，然后温莎王朝就可以上台了。\n\n麦克莱恩的遗产（红线）：不要接受任何帮助（巩固国内联盟），加强与民主派和誓约派的联系，小赤佬就会政变，让政府崩溃或让它失败或寻求法国帮助，最后清洗一波民主派。\n\n民主线：不要接受任何帮助（巩固国内联盟），加强与民主派联系。小赤佬政变之后让国土守望者就会介入，再让国土守望者下台或者接受法国帮助并不清洗民主派。最后民主派就会政变。\n\n“国家之父”路线：不要接受任何帮助（巩固国内联盟），加强与民主派的联系。小赤佬政变后国土守望者介入，让国土守望者政变掉临时政府。\n\n誓约派：不要接受任何帮助（巩固国内联盟），清洗干净民主派，支持誓约派，不要清洗誓约派，让誓约派政变上台。\n\n权力下放路线：在第一次不列颠联盟大选中就选举格莱斯，解散不列颠联盟。路线和原版KR一样。\n\n注意：在选定路线之前打赢战争就无法让临时政府掌权，这意味着您只能走民主线/国土守望者线/红线。"
 guides.45.a:0 "哇哦"
 guides.46.t:0 "威尔士指南"
 guides.46.d:0 "想玩威尔士至少得等到战争结束，现有的路线：\n\n-左翼威尔士：让谈判失败（过于偏袒某一方），让托马斯·埃文·尼古拉斯取缔刘易斯，接下来在修宪时选择你想让左翼的哪一个分支上台（激社/极权/工团）或者让谈判成功（如果你哪一方也不偏袒成功概率更高）或者让尼古拉斯在1936年工会大会选举上来解散不列颠联盟。\n\n-根除叛徒：让谈判失败，让刘易斯击败尼古拉斯，在“我们的恩人”事件中选择“威尔士将与我们的凯尔特兄弟同盟”（改变你的对外政策）。接下来刘易斯就会政变摄政委员会，建立临时政府。或者，选择德国，然后不让奥斯卡过来当皇帝。接着摧毁民族主义恐怖分子，接受以德国为主的对外政策。\n\n-真正的共和国：让谈判失败，让刘易斯击败尼古拉斯，在“我们的恩人”事件中选择德国作为最亲近的盟友。当德国要求让奥斯卡登基以平息骚乱时，你选择国内局势已经得到控制。几天后，民族主义者将试图发动政变——选择让他们罢免刘易斯，并在H·R·琼斯的领导下建立一个共和国，并举行选举。\n\n-迫使忠诚：让谈判失败，让刘易斯击败尼古拉斯，在“我们的恩人”事件中选择德国作为最亲近的盟友。德国会要求奥斯卡登基，选择你想要的方向（绝对君主制或普鲁士宪政）。不让奥斯卡登上王位将变成刘易斯领导下的与德国结盟的共和国。\n\n-你知道的魔鬼：让谈判失败，让刘易斯击败尼古拉斯，在“我们的恩人”事件中选择加拿大和国王。然后完成“你知道的魔鬼”这一国策，你可以选择成为加拿大的傀儡，或者成为刘易斯统治下的半独立共和国。"
 guides.46.a:0 "哇哦"
 guides.47.t:0 "巴纳特指南"
 guides.47.d:0 "怎么爆出巴纳特：\n匈牙利开局，等罗马尼亚的喀尔巴阡演习，选开火。之后若罗马尼亚选择开战的话（概率极低，建议预设路线），就可以爆出巴纳特。\n\n怎么走巴纳特王国路线：\n（首先，确保你设置了游戏规则，让巴纳特爆出和罗马尼亚驱逐卡罗尔）阿夫兰·伊布罗安从袭击中幸存，然后他会演讲，选项随便选，然后不要给他配武装卫士，指责伊布罗安代表的保王党造成动乱，不和民兵合作。\n\n怎么走铁卫团巴纳特：\n阿夫兰·伊布罗安从袭击中幸存，然后他会演讲，选项随便选，然后不要给他配武装卫士，谴责铁卫团，让罗马尼亚刺杀罗特·奥托，等鲍尔陶上台后继续罗斯的政策。\n\n工团/极权巴纳特：\n先走铁卫团路线，然后在“罗特纪念游行”、“四广场抗议”、“军队失去控制”三个事件中分别选择：逮捕肇事者，随他们去吧（最后会消停的），秘密鼓励军队。触发“红色，更红色的巴纳特”事件后，你就可以选择你想走的路线了。（要是上面三个事件你只选对了俩，最终也能进线）\n\n鲍尔陶的巴纳特：\n阿夫兰·伊布罗安从袭击中幸存，然后他会演讲，选项随便选，然后不要给他配武装卫士，谴责铁卫团，让罗马尼亚刺杀罗特·奥托，鲍尔陶取得政权后扩大民兵组织。\n\n怎么让罗特·奥托团长活下来：\n罗马尼亚刺杀失败或者伊布罗安在袭击中死亡（1%的概率罗马尼亚会宣你）。"
 guides.47.a:0 "哇哦"
 guides.48.t:0 "朝鲜指南"
 guides.48.d:0 "问：如何得到独立的朝鲜？\n\n答：三种方式来获得独立朝鲜：\n一是在游戏规则中设定朝鲜起义，选择其他tag，等朝鲜起义后tag KOR。\n二是选择日本/JAP，选择所有镇压朝鲜的事件，等待朝鲜起义在36-39年间爆发。\n三是～控制台调出朝鲜。\n扮演朝鲜时，要在100-200天间占领所有朝鲜半岛地区，太难了可以用控制台。\n\n问：如何扮演 主 体 朝 鲜？\n\n答：先把朝鲜放出来（上面不都写着怎么放出来嘛，简而言之，等到釜山谈判的事件后选拒绝谈判，之后的事件往屑了选），然后是君主制的问题，让保皇派进议会，之后选择“外面有什么声音……”选项，保皇派政变事件中选择“最高战争委员会逮捕保皇派并阻止政变阴谋！”选项，军事反政变事件中选择“金九失败了。我们哪儿也不去。”选项，然后让无政府主义者政变成功。在安人政变后，在红色朝鲜事件中选择“无政府主义者是软骨头。我们需要更强有力的手段……”选项。最后，走完最初的社会主义树后，就能走金太阳的主体树辣！"
 guides.48.a:0 "哇哦"
 guides.49.t:0 "尼加拉瓜指南"
 guides.49.d:0 "问：如何让美国人占领尼加拉瓜\n\n答：1.扮演尼加拉瓜，在第二次美国内战期间会跳事件，选择让美国入侵，过几天尼加拉瓜就会政变并解锁新的国策树。\n\n2.扮演美国，等待第二次美国内战爆发，扮演联邦政府，等待联盟国想要联系尼加拉瓜秘密政变，选择是，并等待政变爆发，tag到NIC。"
 guides.49.a:0 "哇哦"
 guides.50.t:0 "巴拉圭指南"
 guides.50.d:0 "问：怎样才可以玩到休伊·朗的巴拉圭呢？\n\n答：选择巴拉圭，保持威民（不要削减预算哦），等待休伊·朗也就是美利坚联盟国在第二次美国内战中输掉（内战可以不必等到打完，但联盟国必须已投降），然后巴拉圭就会有一个事件提示，可以让休伊·朗像一个一般通过公民一样活着，或者，也可以让休伊·朗当总统。"
 guides.50.a:0 "哇哦"
 guides.51.t:0 "阿尔巴尼亚指南"
 guides.51.d:0 "问：如何推索古上台？\n答：第一次选举选社保，完成政治线国策“抵制土地改革”，但不要点国策“武装宪兵”，一段时间后总统将被刺杀，你将触发事件，选择索古带领社保派反政变，之后你将得到选择是否加冕索古的事件。\n\n问：维德国王？\n答：第一次选举选社民，完成经济线国策“土地再分配”，但不要点国策“武装宪兵”。一段时间后总统会遇刺，你就可以选社保政变或者通向维德的奥地利干涉。（走完这条线后，会给予额外的战争借口，并获得与索古国王相同的宣称）\n\n问：恩维尔·霍查（红线）？\n答：- 让索古掌权（方法见上）。\n- 点索古线国策“阿尔巴尼亚王国基本法”，等几天会出社会主义者计划政变的事件，不要去调查他们，一周后就会政变，进入红线。（左边的国策是工团线，右边是极权线）\n- 如果走工团线（左侧），霍查最终会被工人大会票选下台，之后能解锁拉扎尔·丰多、塞伊弗拉·马利绍瓦、科奇·佐泽三条后续。（每条后续都有各自的外交方向，佐泽是组建南斯拉夫的极权线，丰多是从保加利亚或塞尔维亚手里解放阿尔巴尼亚的激社线，马利绍瓦是解放意大利-阿尔巴尼亚人和希腊-阿尔巴尼亚人的工团线）\n\n问：涅奇米叶·霍查（超霍查主义）？\n答：- 走霍查右线（极权线，第一个国策是“唯有吾之愿景”）。\n- 完成国策“一切为了人民，一切依靠人民”，在事件中干掉佐泽，让穆罕默德·谢胡当安全部长。\n- 完成国策“思想文化革命”，在事件中让涅奇米叶成为政府首脑。\n- 完成国策“您心之所向，我等剑之所指”，等一周，霍查会中枪身亡，她的妻子就能上位。"
 guides.51.a:0 "哇哦"
 guides.52.t:0 "塞尔维亚指南"
 guides.52.d:0 "问：让你看看什么叫做塞尔维亚黑手！\n\n答：在37年二月的国策中选择保留摄政或建立共和国。然后一个关于黑手的事件会触发，可以选择屈服或击败黑手，若屈服那么黑手就会自己任命国王。然后让他们任命，然后他们的专属国策树就会开启。"
 guides.52.a:0 "哇哦"
 guides.53.t:0 "新英格兰指南"
 guides.53.d:0 "想玩哪条路线？"
 guides.53.a:0 "洛夫克拉夫特、莱蒙德、军政府以及保皇派"
 guides.54.t:0 "墨西哥指南"
 guides.54.d:0 "萨帕塔线：开局让萨帕塔活下来，完成其国策树后会举行选举（可以需要等待一段时间，实在不行就存档读档）。如果萨帕塔死了，其弟弟欧费米奥会在1937年大选之前临时担任领导人（这段时间可以先点点军事国策树）。\n\n革命民主线：让萨帕塔死，建立民主联盟，维持住联盟（或者干脆就让萨帕塔活下来并完成其国策树）。\n\n卡列斯线：让萨帕塔死，同卡列斯合作，让其政变成功。\n\n托莱达诺线：让萨帕塔死，建立民主联盟，维持住联盟，在选举里选托莱达诺。在之后的一系列事件里，如果全部选择偏威权的选项，将进入极权线，否则进入工团线。\n\n加尔萨线：让萨帕塔死，建立民主联盟，让联盟破裂，选择让加尔萨独行，并躲过刺杀。\n\n非加尔萨军政府/绝对君主线：让萨帕塔死，建立民主联盟，让联盟破裂，选择让加尔萨独行，再让其遇刺，触发继任者事件。在之后的国策树里可以选择恢复君主制或维持军政府。\n\n非革命民主线：让萨帕塔死，建立民主联盟，让联盟破裂，让加尔萨与民主联盟合作。在之后的国策树里可以选择恢复君主制或维持共和国。\n\n金衫军线：让萨帕塔死，建立民主联盟，让联盟破裂，让加尔萨与反社联盟合作，让金衫军政变成功。之后可以选择提高保守派或新金衫军的影响力，保守派是“法西斯”线，新金衫军是阿兹特克线。\n\n共治整合线：让萨帕塔死，建立民主联盟，让联盟破裂，让加尔萨与反社联盟合作，让金衫军政变失败。在之后的国策树里可以选择恢复君主制或维持共和国，并选择相应的领导人。\n\n注：上述内容只是进线的部分方法，墨西哥的内容相互穿插，在游玩时也可能找到其他的进线方法。"
 guides.54.a:0 "哇哦"
 guides.55.t:0 "使馆城市指南"
 guides.55.d:0 "问：三合会？\n\n答：一直选择减少货币储备的选项，让使馆城市破产，之后让三合会上台。完成国策“猴头之夜”，在青帮聚义事件中选择团结江青。三合会线共有四位可选领导人。\n\n问：大明顺天国？\n\n答：三合会掌权后不要团结江青，让革命军夺权。"
 guides.55.a:0 "哇哦"
 guides.56.t:0 "波兰指南"
 guides.56.d:0 "问：如何获得波兰复兴联盟以及之后的分支路线呢？\n\n答：在游戏规则设置中的加料路线选项中启用“波兰王国”。然后游玩波兰，在“遭遇经济危机！”事件中选择“强迫摄政会议做出决定！”，在“摄政会议又一次分心”事件中选择“没希望了”，在“摄政府和议会危如累卵”事件中选择“政府垮台了”，最后在“乡村的混乱”事件中选择复兴联盟夺权。\n\n问：如何获得安人波兰？\n\n答：走莱希亚线。点完“集会遗俗”国策后，在弹出的事件里选第一个选项，也就是让不神圣安人上台。\n\n问：贝克的波立联邦？\n\n答：选明道加斯，点国策“波兰为主体”，期间贝克会发出警告。点国策“集中力量”，触发贝克成立准军事部队的事件，选“令人担忧”，之后贝克会政变，你可以让他成功也可以让他失败。"
 guides.56.a:0 "哇哦"
 guides.57.t:0 "格鲁吉亚指南"
 guides.57.d:0 "问：朱加什维利/朱格利独裁线？\n答：1.在事件“重新审视波季条约”中，选择“我们离不开德国人，帮他们一把”。\n2.在事件“食品价格飙升”中选择“市场规律不能横加干涉”。之后选择不进口食物，就会触发布尔什维克夺权的事件。\n朱格利线的话先走完上面的步骤，完成斯大林的人民卫队的国策，输掉事件中的战争（选择高级军官不建议的选项）。\n事件“整合人民卫队”选择不整合。\n事件“强化政治体制”选择“格鲁吉亚不再寄希望于民主！”。\n\n问：蓝角、爱国者美学联盟？\n答：1.在事件“重新审视波季条约”中，选择“我们离不开德国人，帮他们一把”。\n2.让社保派赢，但在公投时保留共和。\n3.一段时间后会触发蓝角激社化的事件，在推翻政府的事件中就可以选择他们上台。\n\n问：独立的阿布哈兹？\n答：在少数族裔相关的事件中，全部选择强硬的选项，不要让南奥塞梯自治。"
 guides.57.a:0 "哇哦"
 guides.59.t:0 "利比里亚指南"
 guides.59.d:0 "问：如何走利比里亚的各种路线\n\n答：游玩利比里亚，等待金的丑闻爆发（1936年11月触发），然后：\n\n -利比里亚天命运动（极权）/人民党（激社）：让金总统拒绝立刻下台。在下一个事件里，让凡士通政变。并在再下一个事件里让极权派或激社人政变。\n -凡士通（威民或家独）：让金总统拒绝立刻下台。在下一个事件里，让凡士通政变。凡士通可以让利比里亚变为安资世界并在死后让儿子接任，抑或者也可以让克里斯蒂接管并将利比里亚转变为美国的飞地（这也是胡佛或共济会路线的前置）\n -胡佛：让凡士通上台，完成“深化承诺”和“大迁徙”国策，等待胡佛的到来（需要内战，大约140天后）并让他成为总统。胡佛可以发起一场重返美国的圣战，也可以接受现实就此定居在利比里亚。（市自胡佛——在事件里都选择进步选项，社保胡佛——选择进步选项但是实行种族隔离，威民胡佛——坚持利比里亚宪法或驱逐议会，胡佛王朝——都选择温和选项，民粹胡佛——所有选项都偏袒流亡者）\n -共济会（民粹）：选胡佛并留在利比里亚，在胡佛国策树触发的事件有关进步，温和与保守的选项里雨露皆占，让事情陷入僵局，共济会会政变。/让金立刻下台，在下一个事件里让共济会政变。\n -各民主党派（社民到社保）：让金立刻下台，并选择对应的政党。社民派需要你先选社自，然后再选择威尔逊\n -德属/君主制利比里亚（威民，社保，激社）：选择德国做紧急财政援助的求助对象，在马萨科伊的回归的事件里。拒绝马萨科伊的请求（普鲁士君主制）/接受马萨科伊的请求（君主立宪制）。然后在十一月的丑闻事件中选择战斗，然后选择马萨科伊。（记住，先让凡士通政变）"
 guides.59.a:0 "哇哦"
 guides.60.t:0 "智利指南"
 guides.60.d:0 "问：埃雷拉将军政变？\n\n答：完成第三次主席选举国策后的政变事件里让其成功。"
 guides.60.a:0 "哇哦"
 guides.61.t:0 "德国指南"
 guides.61.d:0 "问：作为德国，如何让各个政党/宰相上台？\n\n答：在黑色星期一后，直接在“1936年帝国议会选举”事件中选择中意政党即可。要让施莱谢尔上台，需要选择任一政党，并在后续选择特定帝国宰相的事件中，由皇帝直接任命施莱谢尔。\n\n要让默勒·范登布鲁克上台，需先任命施莱谢尔，然后走施莱谢尔国策树，在触发的事件偏向德意志阵营，最终德意志阵营将接管政权。\n\n各类“继任”宰相沿用前任的国策树，上台方式不一。例如，只需至少选举过一次保罗·冯·莱托-福尔贝克（因后者不再寻求连任），便可在此后的议会选举事件中任命曼弗雷德·冯·里希特霍芬。依照同样的逻辑，路德维希·卡斯同样会让位于康拉德·阿登纳；马克斯·韦伯则会让位于玛丽安妮·韦伯或卡尔·施米特。社民党的奥托·韦尔斯与中央党的马蒂亚斯·埃茨贝格尔在游戏过程中会逝世，其二人的宰相/候选人资格分别会被汉斯·福格尔和海因里希·布吕宁所接替。\n\n问：如何解锁战后外交政策国策树？  \n\n答：你需在第二次世界大战中取得胜利，判定条件为：法兰西公社不存在；不列颠联盟要么不存在，要么已签署第二次光荣和平；俄罗斯要么不存在，要么被他国傀儡化，或已签署《维尔纽斯协定》。\n\n对于法国和英国的傀儡政权：若选择不分裂它们而是完整释放，将获得独特的合作政府与国策；否则将获得通用变体。俄罗斯始终拥有独特的合作政府。\n\n此后，你将根据当前帝国宰相人选、是否已建立英法傀儡政权、奥地利现状，以及中央非洲和德属东亚是否存在，解锁三种不同的可成立国家形态。"
 guides.61.a:0 "哇哦"
 guides.62.t:0 "中央非洲指南"
 guides.62.d:0 "中央非洲指南：\n\n左右翼改革集团：让戈林叫停腐败调查，将其召回柏林，选改革派总督上台，改换国策树后的选举中可以选择左翼改革派或右翼改革派。右翼是莱托-福尔贝克和特奥多尔·冯·哈塞尔，左翼是阿尔贝特·冯·戈林、亚历山大·杜阿拉·曼加·贝尔和乔莫·肯雅塔。（要选杜阿拉和肯雅塔，必须选择既批准非洲宪法又允许选举民选总督的选项，这将导致中央非洲全面改革，否则只能选阿尔贝特）\n\n国家民粹的主权派：让戈林叫停腐败调查，将其留在中央非洲。注意时刻关注稳定度，防止崩溃。\n\n殖民协会：开局掌权，施内退休后新殖民集团上位。让戈林叫停腐败调查，将其召回柏林，选殖民协会总督上台。\n\n新殖民集团：施内退休后新殖民集团就会上位，之后通过一系列的决议来维持中央非洲的稳定，防止政权崩溃或更迭。腐败调查事件中可以选择静悄悄换掉戈林、留下戈林，或海德里希掌权。选择换掉戈林的话，弗朗茨·冯·埃普，弗里茨·蒂森或恩斯特·云格尔可以接掌总督职位。选择戈林无视调查的话，之后可以继续选择新殖民集团。\n\n中央非洲崩溃：在所有事件和决议中选择能最大限度降低稳定度的选项。中央非洲崩溃后，可以选择切换到爆出来的各个国家——求速度的话，可以直接用控制台输入effect MAF_collapse。此外，也可以在戈林的主权派路线中拒绝下台，任凭土著反抗，或者英国人起义来达成崩溃。\n\n问：如何在德国胜利/失败的情况下获得各种中央非洲/坦桑尼亚戈林相关选项？（中央非洲/戈林尼亚内容）\n\n答：若成功以戈林身份稳定中央非洲并帮助德国赢得战争，第二次世界大战结束后会触发事件，允许以戈林为帝国宰相强行组建帝国联邦。你将继续游玩中央非洲，吞并并获得德国核心。\n\n若德国战败，且你未成为/拒绝成为流亡德国政府（最稳定的方法是在收到德国请求时宣布独立），则作为中央非洲或戈林尼亚会触发“陨落帝国之命运”事件。完成后可释放由艾特尔·腓特烈领导的傀儡专制德国或由奥古斯特·威廉领导的傀儡国家民粹主义德国。若你为国家民粹主义的中央非洲，可在奥古斯特·威廉领导下释放该傀儡政权，并由汉斯·弗兰克取代戈林担任帝国宰相。若你是戈林尼亚，则可组建以赫尔曼一世皇帝为领袖的大德意志-阿非利加帝国。"
 guides.62.a:0 "哇哦"
 guides.64.t:0 "北罗得西亚指南"
 guides.64.d:0 "问：北罗得西亚的各种路线？\n答：最初，统治北罗得西亚的是许蒂希。完成初始的最后一个国策“新首长”后，许蒂希将要求中央非洲延长其任期。如果想让他们同意的话，就选择贿赂，这样许蒂希就能留任。如果希望他们拒绝的话，就选期待他们的支持，这样权力斗争就会爆发。在几个事件之后，你就可以选择下一届政府的领导人：许蒂希、更温和的恩斯特·云格尔或者英国人巴林及其统一帝国联盟。\n\n问：巴林的非洲联邦？\n答：扮演北罗得西亚，让巴林上台（等待中央非洲崩溃，或者按照上面提到的方式，在许蒂希被迫下台时选择巴林，如果德国同意的话）。完成他的初始国策树，在最后决战中击败中央非洲。如果比利时加入了协约国，它会把刚果还给他们，把旧非洲领土还给法兰西民族国。\n\n关于巴林路线的一点建议：击败中央非洲后的事件需要几天才能触发，所以不要急于点取任何吞并决议，这样的话事件可能会无法触发。"
 guides.64.a:0 "哇哦"
 guides.65.t:0 "马达加斯加指南"
 guides.65.d:0 "如何游玩德属马达加斯加的几条路线？\n马达加斯加开始的时候由莱因哈德·海德里希统治。想要玩其他的路线（马拉加什、温和法兰西、火十字会法国民族主义者、莫里斯与德国人、阿龙和犹太人），就要让海德里希在中央非洲崩溃之时run出去，或者指望中央非洲选举海德里希来取代戈林。然后权力斗争的时候用国策选出你希望上台的人就可以。莫里斯最初会掌权，他搞砸后其他路线就会开启。"
 guides.65.a:0 "哇哦"
 guides.66.t:0 "西非指南"
 guides.66.d:0 "德属西非：\n政治相关的事件在黑色星期一之后才会发生。黑色星期一爆发后你可以通过经济计划提高不同政党的影响力。你可以选择法裔、英裔、凡士通或者让德裔继续统治。修复完经济后政治国策树就会被解锁。你还可以在中央非洲崩溃后把殖民地卖给奥林匹奥家族和当地人，就可以建立一个独立西非国家。\n\n问：那“德国的罗得西亚”西非呢？\n答：如果利比里亚通过国策树索要西非领土，或是利比里亚走了君主制路线向中央非洲索要西非领土。你就可以从殖民地中脱身。你可以选择支持亲法/亲英/亲德/独立自主，具体走哪条路线取决于脱身之前谁掌权。你可以tag利比里亚来完成这一点。\n\n问：怎么把多哥放出来玩？\n答：中央非洲崩溃后，西非也会一并崩溃，就会有多哥。法国打进西非，如果西非走的亲法国线，或者事件链中选了相关选项，就会有多哥。如果中央非洲崩溃，但威民路线的公爵依然掌权，也会有多哥。奥林匹奥从德国人手中买下西非，也会有多哥。\n多哥的各路线：\n民主：开始选举，选举奥林匹奥或民主联盟。\n土著士兵政变：推迟选举。\n德国行政当局：点第一个国策，坚持德国统治，不要让奥林匹奥当临时总统。"
 guides.66.a:0 "哇哦"
 guides.67.t:0 "尼日利亚指南"
 guides.67.d:0 "如何游玩尼日利亚：\n点“第三届尼日利亚议会大选”国策，然后想让谁上台就可以让谁上台了。尼日利亚有三条路线，分别是齐克（即阿齐克韦）的土著线，特温宁的盎撒线，布迪龙的德国人线。"
 guides.67.a:0 "哇哦"
 guides.68.t:0 "南罗得西亚指南"
 guides.68.d:0 "南罗得西亚：联合联邦党开局就陷入了危机。在国策里选择想走的路线，完成“四月的一天”国策后开启选举。罗得西亚阵线上台可以通过第二次选举上台，也可以在1937年末的事件中选择绞死议员，让其政变。\n\n问：激社的津巴布韦-罗得西亚？\n\n答：选举选工党，完成中间国策树的右线，然后等上一个月触发事件。\n\n问：民粹线？\n\n答：选举选联合联邦党，完成中间国策树的右线，然后等上一个月触发事件。伊恩·史密斯可以在1945年上台。\n\n问：“轰炸机”哈里斯？\n\n答：南非陷入内战且中央非洲崩溃的话会触发哈里斯政变的事件。"
 guides.68.a:0 "哇哦"
 guides.69.t:0 "海地指南"
 guides.69.d:0 "海地指南：\n\n民主制/选举社会主义者：点左侧的起始国策树，尽可能限制宪兵队影响力，等待1937年2月拉塞尔离职后选择弗兰克·拉沃，在宪兵队政变前完成左线国策树。然后就可以选举了，你可以选择从工团佬到威民分子的各种人上台。（没有单独的威权民主主义国策树，激社只出现在第二次选举中。海地的选举每五年进行一次）\n\n社会主义革命（鲁曼/于迪古）：点右侧的起始国策树，会有一连串事件，你需要选择三个增加社会主义影响力的选项，然后鲁曼和工团人就会政变。你也可以选择两个增加社会主义影响力和一个增加国家民粹主义影响力的选项，点完国策树后于迪古和激社人就会政变。\n\n黑人至上主义者政变（布鲁瓦尔民粹线或杜瓦利埃）：点右侧的起始国策树，在事件链中选择三个增加国家民粹主义的选项，布鲁瓦尔就会发动苦迭打上台。如果选择两个国家民粹主义，和一个社会主义，就是“医生爸爸”杜瓦利埃上台。\n\n卡利斯特反政变（社民）：在民主制度复兴之后可以当选，或者走右翼路线，在最初的事件中选择三个民粹选项，以触发他们的早期政变，然后当布鲁瓦尔下台时别让他走，卡利斯特很快就会政变。\n\n福斯坦政变：起始国策树点左线，完成管束宪兵队国策，拉塞尔逃回美国后选择托马斯继任。最后福斯坦会试图政变。"
 guides.69.a:0 "哇哦"
 guides.70.t:0 "加料路线指南（非该国家专属）"
 guides.70.d:0 "加料路线指南：\n\n如果你想游玩任何加料模式内容或国家，你便需要启用相应的游戏规则。此路线指南仅供参考，适用于没有自己指南的国家，并不代表该特定国家有加料路线内容。\n\n如果你想了解如何游玩其中一些内容，以下是需要扮演特定国家/做出特定选择的部分：\n\n沃尔顿档案及其他恐怖系列：在游戏规则“餐厅事件”中选择“暗流涌动”，以美国开局并触发内战，切换到联合工团，在事件“密歇根日益锈蚀”中选择蓝色选项。\n\n拜登宇宙与爱尔兰拜登：在游戏规则“拜登宇宙”中选择“来自未来的侵略者”，然后根据你想玩的国家国策树选择以美国或爱尔兰开局。\n\n辐射OWB联动：在游戏规则“辐 射”中启用“严重失败！”，并以美国/俄罗斯/德国/墨西哥/波兰/蒙古/利比里亚开局，因为这些国家及其分裂出的国家拥有独特的国策树。"
 guides.70.a:0 "坐等好戏上场"
 guides.71.t:0 "洪都拉斯指南"
 guides.71.d:0 "问：香蕉共和国？\n\n答：美国内战爆发后的紧急选举中选埃雷拉，让极权派上台。等待门罗主义终结，塞缪尔·泽穆赖会流亡洪都拉斯。让他留下并在之后的事件让当地警察逮捕他，他会推翻政府（大概要到1937年后半年）。"
