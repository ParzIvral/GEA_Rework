 guides.2.t:0 "美利坚合众国指南"
 guides.2.d:0 "游玩合众国，让加纳-瓦格纳法案通过（现在kx确保任何一个激进的选择都可以使法案通过，但是要是不和激进党派合作那法案就必定不通过），总统选举前，提名柯蒂斯做政党候选人。然后提出对柯蒂斯健康问题的质疑，然后如果问题确实很大，那么就可以让胡佛替代柯蒂斯参选。\n\n胡佛的避免第二次内战的路线：\n\n胡佛当选后，优先完成专属国策树的最右侧两个国策，包括“胡佛突袭”。之后决议里就会出现一系列调查激进党派领导者的决议。社会党调查完选择决议联系卡彭，之后刺杀海伍德。美利坚至上党和旧民主党在调查完且完成国策“必要的越界授权”后可以选择决议刺杀。在三个领导人都死完后三个激进党派的政治力量每月增长就会变成负数，再配上别的效果就能将政治力量压到15%以下。政治力量全部到15%以下后选择决议“根除影响”，在根除党派全部完成后触发事件避免内战。"
 guides.2.a:0 "哇哦"
 guides.2.b:0 "返回"
 guides.3.t:0 "美利坚合众国指南"
 guides.3.d:0 "问：内战后麦克阿瑟的各条路线？（其他路线只需在避免内战或麦克阿瑟未政变的情况下正常选举即可）\n\n答：消灭除西部军以外的分离势力，之后会触发事件链。\n\n-辛辛纳图斯恢复民主：在演讲事件选择支持民主。\n\n-军政府/三巨头：同西部军谈判。\n\n-暴君伏诛：在选择与西部军谈判后，通过预设美国路线“麦克阿瑟放弃权力”来让西部军选择“向社会公布麦克阿瑟的野心”（当然你也可以tag过去选）。然后在事件“独立于危崖之上”中退缩。此外另一种方法:拒绝海军的要求，然后选择求助国会会导致金被抓但放过莱希。在之后西部军区谴责华盛顿时选择宣布他们为国贼。之后tag过去选择联络华盛顿的所有反麦克阿瑟势力。然后莱希会政变麦克阿瑟，变成恢复民主。\n\n-美利坚的恺撒：同西部军谈判破裂，开战。\n\n另：若在内战中投降进度达到80%，可以让麦克阿瑟逃去西部军，解锁西部军民粹线。\n\n问：海军线？\n\n答：麦克阿瑟政变大概十天后触发“海军要求”事件，拒绝之。之后金会要求掌控海军：若选择支持金，则其会推翻麦克阿瑟，建立海军之国；若选择求助于国会，则无事发生；若选择无动于衷，则莱希会发动政变，重建美利坚民主。\n\n问：威洛比和洛克威尔？\n\n答：同上，让莱希上台。在完成“世纪大审判”国策后的“履行正义？”事件中，选判麦克阿瑟死刑，再在“亡羊补牢？”事件中选审判叛徒。"
