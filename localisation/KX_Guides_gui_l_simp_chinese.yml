 guides.37.t:0 "宪政国指南"
 guides.37.d:0 "福特派：\n内战中，等待全国民主白人联盟军官晋升事件，拒绝晋升，并同意福特的所有要求，林德伯格就会掌权。之后可以将全部权力交给亨利·福特，解锁其国策树；不同继承人还会改变部分国策内容。\n\n西蒙斯／三K党／阿姆斯特朗：\n内战中同意全国民主白人联盟的军官晋升，在“白人联盟扩张”事件中选择无能为力。西蒙斯会召开特别大会并当选，解锁其国策树。沿国策树推进，他最终会死亡，并开启其他三K党领袖的继任事件链。注意：若未在1942年8月前完成最后一个国策，西蒙斯也会死亡，但巴顿将接管政府。\n\n旧三K党：\n西蒙斯死后，允许埃芬格与黑色军团合作，他们就会发动政变。若想让埃芬格领导旧三K党，完成“黑夜之怖”国策，再在清洗事件中拒绝给予黑色军团自由行动权。\n\n新三K党：\n西蒙斯死后，不让埃芬格与黑色军团合作。在巴顿是否逮捕斯蒂芬森的事件中选择逮捕，再在下一事件中杀死其同伙，新三K党就会政变。\n\n阿姆斯特朗：\n西蒙斯死后，不让埃芬格与黑色军团合作，不逮捕斯蒂芬森，随后揭露阴谋，再让军队宣誓效忠。\n\n以上是最直接的上台方式，此外还有其他途径：\n\n新三K党推翻林德伯格：\n拒绝白人联盟的晋升要求，同意福特的所有要求，让林德伯格掌权。等待七十六骑士团招募人员遇害的事件，选择逮捕白人联盟领袖，之后三K党会发动政变。\n\n推翻阿姆斯特朗，选择J·B·斯托纳的新三K党或哥伦比亚党：\n先让阿姆斯特朗上台，在天花暴发事件中选择依靠信仰渡过难关。之后若想走新三K党路线，选择利用新三K党残余势力消灭他们；若想走哥伦比亚党路线，选择第三项，表示没有多余资源。相应派系很快就会发动政变。\n\n乔治·W·克里斯蒂安斯：\n按上述方法走到阿姆斯特朗被推翻前的选择事件，但改选结束骚乱、不再容忍煽动者。随后克里斯蒂安斯会请求会面，同意会面，他就会取代阿姆斯特朗。"
