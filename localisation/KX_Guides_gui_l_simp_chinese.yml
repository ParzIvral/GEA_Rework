 guides.78.t:0 "云南指南"
 guides.78.d:0 "问：唐继尧如何复辟大唐？\n\n答：先正常玩云南，别让唐继尧下台（走左边的国策树，先准备对湖南发动战争，但别真得开战，之后贿赂军队，然后和将军们在事件链中达成妥协或者不清洗他们）。然后就走孤立线，完成云南王国策，等到跳事件出来就好了。他可以统一中国，在三个美女里选一个做老婆，痛饮鸦片，然后嗝屁，让自己的老婆，遗子或者表亲上台。"
 guides.78.a:0 "哇哦"
 guides.79.t:0 "哥斯达黎加指南"
 guides.79.d:0 "问：哥斯达黎加的中美洲咖啡公司路线？\n\n答：走社民线，在决议的机制里提升中美洲咖啡公司影响力（在意识形态饼图中，中美洲咖啡公司是威民）。影响力超40%后，便可解锁中美洲咖啡公司的第一个国策。完成该国策中美洲咖啡公司就会发动政变。最后哥斯达黎加可以由奥古斯特·威廉（中美洲德意志帝国）/理事会（企业国家）统治。"
 guides.79.a:0 "哇哦"
 guides.80.t:0 "澳大拉西亚指南"
 guides.80.d:0 "问：工党/兰工党？\n答：选举前的一系列事件中按照提示信息选择有利于工党的选项，保证工党的势力不低于其他政党，让其赢得选举。若在选举前工党完成了统一，则可以在正统工党和兰工党之间进行选择。\n\n问：国民党/乡村党？\n答：如果在选举前的一系列事件中选择莱瑟姆或者布鲁斯为国民党的领导人，那么联盟便会以国民党为主导进行改革；若选择休斯或者孟席斯，那么联盟会破裂，之后可以选择卡梅伦或者佩奇来领导乡村党。你可以手动选择是以国民党还是乡村党来进行联盟的改革，正式选举前也可以选择是以国民党还是乡村党为先。\n\n问：社会主义工党/世界产联/工会理事会/澳共/至上运动/并一运动?\n答：选举前的一系列事件中按照提示信息选择有利于社会主义工党的选项，保证社会主义工党的势力不低于其他政党，让其赢得选举。完成第一段国策树，让白军政变失败。完成革命相关决议，与新西兰的战争结果无关紧要。之后召开产业大会，选择中意的政党就可以了。\n\n问：皆澳盟/新旧卫队/布莱梅军政府？\n答：拆散国民党和乡村党的联盟，选举选皆澳盟。完成第一段国策树，镇压社会主义叛乱，之后便可以让白军中的一个派系上台。\n\n问：新西兰？\n答：如果想走除军团外的新西兰民主线、交好澳大利亚的话，就通过权力平衡的决议释放新西兰，否则就走社会主义工党线，让白军政变失败，就能换到新西兰，坚持125天白和。此外，如果走白军线或者无法快速结束白军内战的话，输掉权力平衡也会出现新西兰。\n\n问：“澳大拉西亚帝国”？\n答：非共和国体制且加拿大的投降倾向高于百分之九十，可以通过玩家专属选项建立澳大拉西亚帝国或改制共和国。"
 guides.80.a:0 "哇哦"
 guides.81.t:0 "奉天指南"
 guides.81.d:0 "问：如何成为拿破仑张作霖？\n答：通过武力统一中国，在完成国策“总统问题”时，让张作霖继续掌权并幸存下来，然后在完成国策“最后通牒”前先完成国策“人民的慈父”。\n\n问：各种乱七八糟的王朝在奉天如蜗牛般归来？\n答：通过武力统一中国，完成国策“总统问题”后，让张作霖身死再让杨宇霆夺权，一个多月后会触发关于君主制支持者的事件，支持他们，等待之后选择各个王朝（目前只有和人皇帝有国策后续，但是别担心，其他皇帝最终会有自己的后续）。"
 guides.81.a:0 "哇哦"
 guides.82.t:0 "阿拉什指南"
 guides.82.d:0 "一、阿拉什党：阿拉什党初选选社自的杜拉特吾勒或市自的叶尔梅科夫，在接下来一系列的选举事件和决议中增加其支持率。\n\n二、青年国民党：在一系列的选举事件中增加其支持率，不要点增加阿拉什党支持率的决议。\n\n三、三玉兹党：在一系列的选举事件中增加其支持率，不要点增加阿拉什党支持率的决议。\n\n四、布尔什维克：游戏规则设置俄国革命，别支援科尔尼洛夫，“搜寻红色商队”事件不要去找江格尔丁。\n\n五、军政府一：同布尔什维克，只是最后不要切换至布尔什维克，在事件中推迟选举。\n军政府二：阿拉什党的土改相关事件中服从俄罗斯的要求。"
 guides.82.a:0 "哇哦"
 guides.83.t:0 "布哈拉指南"
 guides.83.d:0 "一、酋长国：不要选增加青年布哈拉党影响力的事件选项。若未能阻止革命，就在“革命党占领新布哈拉！”事件中逃到帕米尔，并在“赤党拿下卡尔希”事件中进行反攻。\n\n二：共和国：增加青年布哈拉党的影响力，“革命党占领新布哈拉！”事件选择守住卡尔希。\n\n三：红线：最简单的方法是在革命前点出国策“镇压异己”，其他还可以在共和国线选社民政党，拒绝激进社会主义者重组政府的要求。§R绝对绝对不要接受英国的军事代表团！§!\n\n四、易卜拉欣贝伊的民粹线：在革命前点出国策“镇压异己”，或者让内阁会议中易卜拉欣贝伊的影响力为“微不足道”。随后，按照埃米尔线的方法处理完革命党后不要恢复君主制。\n\n五、英国军事代表团线：游戏规则设置阿富汗自治领，英阿战争结束后接受英国的军事代表团，随后照着红线走。"
 guides.83.a:0 "哇哦"
 guides.84.t:0 "突厥斯坦指南"
 guides.84.d:0 "一、扎吉德线：不要在铁路工厂罢工中协助俄国驻军，内战期间抓住机会进攻费尔干纳。\n\n二、格底目线：扎吉德线的选举选格底目派。\n\n三、红线：不要在铁路工厂罢工中协助俄国驻军，内战期间防守纳曼甘、联合圣战军、进攻塔什干。\n\n四、马达明贝伊线：在铁路工厂罢工中协助俄国驻军，内战期间防守纳曼甘、联合圣战军、放弃进攻。\n\n五、突厥斯坦的萨文科夫线：先走马达明贝伊线，在“打压突厥斯坦军事组织”国策前点出“打压激进圣战军”，然后再点“实施戒严”。\n\n六、突厥斯坦军事组织线：走扎吉德线，增加突厥斯坦军事组织的影响力，一直不要去处理它。\n\n七、奥西波夫线：走突厥斯坦军事组织线，点出国策“重建俄式体系”，不要管兵变，最后点国策“奥西波夫的纲领”。\n\n八、米尔沙布线：扎吉德线或马达明贝伊线点出军事线的国策“质问米尔沙布的角色”，相关事件选第一个，不要管米尔沙布的叛乱。\n\n九、科什尔马特线：不要在铁路工厂罢工中协助俄国驻军，内战期间防守纳曼甘、快速出击。"
 guides.84.a:0 "哇哦"
 guides.85.t:0 "希瓦指南"
 guides.85.d:0 "一、青年希瓦党革命：“希瓦政变”事件后让朱奈德汗战败。\n格底目线，“博博洪希望同维齐尔谈判”事件不让霍贾耶夫退让，“希瓦的武装冲突”事件选增兵。\n扎吉德线，“博博洪希望同维齐尔谈判”事件让霍贾耶夫退让。\n共产线，扎吉德线推翻君主制，选举选共党。\n\n二、朱奈德汗及其继任者：“希瓦政变”事件后让朱奈德汗胜利。朱奈德汗去世后，影响力最高的继任者上台。"
 guides.85.a:0 "哇哦"
 guides.86.t:0 "顿河指南"
 guides.86.d:0 "问：如何走顿河共和国的各种路线？\n答：\n-亲德的顿河共和国，在“罢工席卷顿巴斯！”事件中选择“不惜一切代价平息劳工骚乱！”，继续支持彼得·克拉斯诺夫。\n-博加耶夫斯基线，在“罢工席卷顿巴斯！”事件中选择“让我们证明自己不是工人阶级的敌人”，克拉斯诺夫随后会遇刺，而后选择让博加耶夫斯基继续掌权的选项。\n-社会主义顿河共和国，先按上述方式使博加耶夫斯基上台，在其接管后的权力斗争事件中选择让社会主义者获胜。\n\n问：德属顿河库班？\n答：先按上述方式使博加耶夫斯基上台，在其接管后的权力斗争事件中选择让德国人获胜。\n\n问：弗拉索夫？\n答：先按上述方式使博加耶夫斯基上台，在其接管后的权力斗争事件中选择让弗拉索夫获胜。\n\n问：俄罗斯真理兄弟会？\n答：先按上述方式使博加耶夫斯基上台，在其接管后的权力斗争事件中选择让俄罗斯真理兄弟会获胜。"
 guides.86.a:0 "哇哦"
 guides.86.b:0 "送我去卡尔梅克"
 guides.87.t:0 "卡尔梅克指南"
 guides.87.d:0 "问：卡尔梅克的各条路线？\n\n答：开局选顿河共和国。克拉斯诺夫死后等事件选择卡尔梅克，完成“埃利斯塔对峙”国策，在事件中进行路线选择。\n选择“通杜托夫推翻了奥奇罗夫政府”，进入阿斯特拉罕哥萨克军团/丹赞汗线。\n选择“通杜托夫撤走了哥萨克”，进入民主选举路线，可以选激社、社民、社自、威民、民粹。\n\n问：黑喇嘛？\n\n答：设置蒙古走极权路线。选卡尔梅克并走民粹路线。等待黑喇嘛逃来卡尔梅克的事件，选择让其上台，可以获得蒙古和中亚的战争目标。"
 guides.87.a:0 "哇哦"
 guides.87.b:0 "回到顿河共和国"
 guides.88.t:0 "库班指南"
 guides.88.d:0 "问：库班人民共和国的各条路线？\n\n答：民主线（高加索军团、黑海军团），不要点加速库班崩溃的决议（它们都有“这个可不兴点”的提示）。之后就是选举了，支持率最高的党派会上台（具体情况可以在库班拉达的决议栏中看到）。\n\n布尔什维克线，让库班崩溃（把上一条所说的决议全点了），在事件“新罗西斯克之战”中选择求助高加索军团。\n\n家独库班起义军线，步骤与布尔什维克相同，只是最后不要找高加索军团帮忙。"
 guides.88.a:0 "哇哦"
 guides.89.t:0 "山地共和国指南"
 guides.89.d:0 "问：山地共和国的各条线路？\n\n答：威民、社自。1937年3月的大选直接选。\n\n激社。大选选威民，完成国策“打击社会主义思想”，“社会主义分子叛乱”、“捷列克堡的冲突”事件都选第二个。\n\n酋长国、伊玛目国。大选选社自，完成国策“与社会主义者合作”，“军队动乱”、“塔尔科夫斯基的最后通牒”事件都选第二个。"
 guides.89.a:0 "哇哦"
 guides.90.t:0 "蒙古指南"
 guides.90.d:0 "问：如何走蒙古各种路线？\n\n答：现在恩琴开局是个“正常人”，在开局不久后将触发恩琴和嘎达梅林狭路相逢的决战事件，你会得到三个选项。\n\n-让恩琴胜利，将使得恩琴继续保持理智，并带领蒙古收复俄罗斯，重建沙皇俄国。\n-让恩琴被射中但逃离成功，会让恩琴发高烧昏迷不醒，当他醒来之时，可汗将会重临。\n-让恩琴被杀，蒙古将陷入一片混乱，你将能选择让黑喇嘛、嘎达梅林、贵族、佛教徒、安福俱乐部、俄罗斯复国社等势力统治蒙古，其中安福俱乐部可以重建中华民国或中华帝国，复国社能成立黄俄罗斯，黑喇嘛也有独有建立国家。\n-KR的傀儡蒙古路线仍然存在，被傀儡后解锁。\n\n问：现在怎么走社会主义蒙古？\n\n答：游玩蒙古，开局事件里让恩琴被杀，走蒙古民主路线，选举让蒙人党胜利，等待之后的事件，邀请激进派流亡者回来，不限制他们的权力，让他们发动政变以获得道尔扎布·鲁布桑沙拉布统治的极权蒙古。若要走乌兰夫路线，完成向巨人鞠躬国策后，在权力斗争选择让他胜利。若要走工团路线，请在前面的权力斗争中选择陷入僵局，并在下一个工团主义政变事件中选择工团主义者。工团主义者上台后可以选择他们的领导人。若要走嘎达梅林或阿南德·阿玛尔路线，可以在工团主义政变事件中选择他们。嘎达梅林上台后可以选择极权或激社。选择激社会解锁他本身在民主国策树末尾的迷你国策部分。（乌兰夫、鲁布桑沙拉布、激社嘎达梅林、社民或激社蒙人党都有可能通过不同的事件选择新领导人，但不影响游戏本身内容）。"
 guides.90.a:0 "哇哦"
 guides.91.t:0 "通用东亚公司指南"
 guides.91.d:0 "问：如何走各种路线\n\n答：黑色星期一后会触发一系列事件。救济公司则法肯豪森能留任。不救济公司克虏伯会政变。"
 guides.91.a:0 "哇哦"
 guides.36.b:0 "福特、三K党、阿姆斯特朗等路线"
 guides.92.t:0 "乌克兰指南（1/2)"
 guides.92.d:0 "一、斯科罗帕茨基盖特曼线？\n答：德国驻军撤离时，选择盖特曼线，赢得权力平衡，不要输给督政府（国王线同理，也不能输给督政府）。\n\n问：如何复辟俄罗斯帝国？\n答：走斯科罗帕茨基的亲俄线，如果俄国转红、社民、民粹或是拒绝同你合作，那么就能解锁进攻俄国的决议。\n\n问：如何让米赫诺夫斯基做斯科罗帕茨基的政府首脑？\n答：进入盖特曼线，邀请米赫诺夫斯基（要让米赫诺夫斯基上台的话就不要解散工贸金农联盟，走亲俄线，等待米赫诺夫斯基的政变），若想进入其他盖特曼线，则需要解散议会。\n\n问：如何让波尔塔韦茨-奥斯特里亚尼齐亚做斯科罗帕茨基的政府首脑？\n答：进入专制盖特曼线，以正面结果结束基辅审判（所有人都无罪），家独支持率大于40%，完成国策“$UKR_Restore_Vilne_Kozatstvo$”，波尔塔韦茨-奥斯特里亚尼齐亚的影响力至少为4，然后完成国策“$UKR_Retain_Absolutism$”。注意，在国策“扩招联盟成员”中不要鼓励也不要贿赂农国盟，国策“资助自由哥萨克”也需要完成。\n\n二、瓦西里国王和农国盟？\n答：德国驻军撤离时，选择国王线，联盟君主派，不要接受社会独立党的最终通牒。\n\n三、如何进入社会独立党各个路线？\n答：德国驻军撤离时，选择国王线，联盟君主派，接受社会独立党的最终通牒。\n博尔博昌线，不要废除君主制，保证博尔博昌权威最高；\n格列基夫线，废除君主制，保证格列基夫权威最高；\n君社乌克兰线，不要废除君主制，保证社会主义权威最高，还要确保格列基夫的影响力不够推翻博尔博昌。\n\n四、乌克兰军事组织科诺瓦列茨线？\n答：选择国王线，然后选择依靠军事组织（这是最简单的方式，但并非唯一途径），等待军事组织政变。\n\n五、乌克兰军事组织梅利尼克线和东佐夫线？\n答：这两者只能在科诺瓦列茨死亡的前提下上台。国王结盟君主派或者盖特曼解散议会，等待科诺瓦列茨遇刺事件，不管督政府让其顺利上台。\n督政府政变后到大会召开所有的事件选择增强梅利尼克权威的选项，军事组织将会有政变的事件。（从这里进入民族主义路线大线）\n东佐夫线，在民族主义路线的民族主义大会期间，“东佐夫的‘积极’民族主义”、“讨论战略战术”和“民众支持与社会主义运动”这些事件都选择第二个选项。\n不按上述做，则进入梅利尼克线。"
 guides.92.a:0 "哇哦"
 guides.93.t:0 "白鲁塞尼亚指南"
 guides.93.d:0 "问：社保的基督教民主党线/威民的无党派联盟线？\n\n答：完成“呼吁新选举”的国策后直接选即可。\n\n问：社民党线/激社的农工联盟线？\n\n答：完成“农工联盟问题”国策，解禁社会主义者，这样的话完成“呼吁新选举”国策后就可以选他们了。要走激社线的话就得废除君主制，否则就会触发政变。\n\n问：各式红线/社自的社会联邦党线？\n\n答：按照上述攻略走社民线，废除君主制，几天后会触发路线选择事件，可以选极权、工团、激社和社自。如果你不想德国介入的话，可以在游戏规则里进行设置。\n\n问：西吉斯蒙德线？\n\n答：完成国策“西吉斯蒙德的立场”，同西吉斯蒙德谈判，让他退位。\n\n问：新民粹线/克里维亚线？\n\n答：要走新民粹线的话，就不能把王位留给西吉斯蒙德。走社民线，完成国策“农工联盟代表大会”，选择不补偿地主，阿斯特罗夫斯基就会政变。如果想留住阿斯特罗夫斯基的话，就在接下来的事件中选择巩固住地位（如果没有在决议中的时间耗尽之前拿下所有地区，德国人就会发动政变），选择其他选项会导致克里维亚政变。\n\n问：亲俄线/安那其线？\n\n答：不要把王位留给西吉斯蒙德，走农工联盟线，不废除君主制，选激进派。西吉斯蒙德政变后什么都不要做，等着德国人再搞一次政变，然后再推翻德国人。也可以按照上面阿斯特罗夫斯基的方法走，反正最后有德国的政变和反政变就行。"
 guides.93.a:0 "哇哦"
 guides.94.t:0 "巴拿马指南"
 guides.94.d:0 "问：美国驻军巴拿马毒品国？\n\n答：扮演巴拿马，夺取运河（一个决议，由运河危机国策解锁），然后仔细看事件链提示，选让美国人夺权的（在占领运河区几天后触发）。"
 guides.94.a:0 "哇哦"
 guides.95.t:0 "清政府指南"
 guides.95.d:0 "问：如何变为一贯道大清？\n\n答：走维新路线，和张天然合作，不要建立紧急政府，从一贯道得到的支持要大于30%，触发有关一贯道阴谋的事件后选择调查他们。"
 guides.95.a:0 "哇哦"
 guides.96.t:0 "山东指南"
 guides.96.d:0 "问：如何变为一贯道大清？\n\n答：以国家领袖为张天然的山东夺取北京。"
 guides.96.a:0 "哇哦"
 guides.97.t:0 "刚果指南"
 guides.97.d:0 "（为了完整的刚果体验，请在游戏规则中设置中央非洲必然崩溃）\n\n自由邦的各个总督：\n\n刚果开局总督里克曼斯会渐渐搞砸各种事情，一串事件后，他将遭到不信任投票，新的总督将被选举出来，候选人包括里克曼斯、佩蒂永、德科斯泰和埃普。\n\n埃普将致力于创造一个日耳曼化的刚果，在中央非洲崩溃后可以收复它，或是建立神圣阿非利加帝国。\n\n另外两个候选人，如果成功度过刚果危机（由中央非洲崩溃触发），将维持现状，让刚果成为真正的利奥波德式自由邦，或邀请流亡比利时国王阿尔伯特登基。（佛兰德-瓦隆必须存在且没有邀请国王登基）\n\n埃普路线备注：直接选择他做总督，设置中央非洲崩溃，并打赢刚果危机，或者以中央非洲开局，让他成为中央非洲总督，在中央非洲崩溃后让他逃去刚果。（注：要保证埃普在刚果危机结束后不被推翻，请在中央非洲崩溃前完成国策“德意志-中非的建立”）\n\n另外的比属刚果路线都能在征服中央非洲旧地后建立比属中央非洲，这只会改变国名和旗帜，不会有新事件或国策。"
 guides.97.a:0 "哇哦"
 guides.98.t:0 "利奥波德维尔/基班古指南"
 guides.98.d:0 "利奥波德维尔：\n\n（打刚果内战）开始时利奥波德维尔由于热统治，打赢刚果内战之后，还有两条路线可以选择。一条是选举坎扎并走自由化道路，另一条是选举让森斯搞殖民主义。\n\n基班古：\n\n先知西蒙·基班古圣父，你需要在事件链中选对。在“训练‘事故’”以及后续事件中，对让森斯的行为睁一只眼闭一只眼，最后基班古就会政变。"
 guides.98.a:0 "哇哦"
 guides.99.t:0 "矿业联盟/姆瓦米联盟指南"
 guides.99.d:0 "矿业联盟/姆瓦米：\n\n刚果内战开始后，选择桑吉耶的上加丹加矿业联盟开始游玩。但注意，如果你在事件链中，选择放任姆瓦米势力增长，并镇压罢工，就会导致姆瓦米上台，复辟叶克王国。当然，你也可以在独立的加丹加中选择让这些人政变冲伯总统。（加丹加请参考加丹加指南）"
 guides.99.a:0 "哇哦"
 guides.100.t:0 "佣兵团指南"
 guides.100.d:0 "刚果佣兵团：\n\n打赢刚果内战，雇佣兵就开始自相残杀了，马絮是骑士团路线，罗森是cosplay罗马佣兵路线，哈尔斯特伦是“世外天堂”路线。只需要点国策就可以了。"
 guides.100.a:0 "哇哦"
 guides.101.t:0 "基伍军阀/辛巴起义/加丹加"
 guides.101.d:0 "基伍军阀：\n\n以贡扎格军政府开始，打赢刚果内战后，可以选择让贡扎格掌权（事件可以选择两条路线，阿斯卡里国家或者恩泽雷民族主义者）或是建立共和国选举从社会民主主义到社会保守主义的各个党派，事件链选对就好。\n\n辛巴叛乱：\n\n扮演基伍打赢战争，有两种途径可以爆出辛巴叛乱：第一种是建立共和国，禁止刚果民族运动参加大选，刚果民族运动就会反抗（此处需要处理一个特殊机制决议，六个月之内你必须要处理完辛巴问题，否则六个月之后贡扎格就会发动政变。而且，不要选博利康戈，那条线辛巴不会叛乱。）。第二种是让贡扎格建立阿斯卡里国家，就会爆发辛巴叛乱。扮演辛巴叛乱并赢得内战，然后就能开始辛巴的选举。\n\n独立的加丹加：\n\n扮演基伍，打赢战争，恢复共和国。选举出卡萨-武布或选举卡隆吉。冲伯就会跑路加丹加发动叛乱。或是在辛巴叛乱后几个星期，冲伯也会跑路加丹加发动叛乱。以加丹加打赢战争后，你可以选择把刚果巴尔干化（碎掉），或者巴尔干化并且傀儡所有分出来的国家，或者单纯搞点加独。冲伯掌权后，有可能飞机失事，还有可能被暗杀，他死之后“疯迈克”霍尔可能会带领雇佣军政变，或者是德弗鲁瓦·穆农戈可能会继任（穆农戈继任后国策树不会变），或者姆瓦米或者矿业公司也可以上台，一切取决于你的选择。"
 guides.101.a:0 "哇哦"
 guides.102.t:0 "加蓬指南"
 guides.102.d:0 "加蓬：\n\n打赢开始的那场战争，然后点姆巴的国策树，最后会有一场政变。如果让姆巴在政变里活下来，他就会继续掌权并解锁第二条国策树。如果姆巴没能活下来，就可以玩有选举的各个派别了。（共和/左人）"
 guides.102.a:0 "哇哦"
 guides.103.t:0 "革命德国指南"
 guides.103.d:0 "问：我如何得到保罗·连施/皮克/台尔曼等红色政党\n答：打赢内战，等待召开大会，完成第一个国策，选举上台\n\n问：巨型企业路线\n答：大会选择社会民主党获胜，完成政党国策路线，一百天后总统将退休，完成民主承诺国策，选择自由党上台，最后一个政党国策事件解锁"
 guides.103.a:0 "哇哦"
 guides.104.t:0 "波希米亚指南"
 guides.104.d:0 "问：波希米亚/捷克斯洛伐克的各种路线？\n\n答：独立——第一个政治国策树最下方，选择温塞斯拉斯广场宣言，并完成最后的国策波希米亚革命。内战要么占领维也纳，要么就僵持数个月。\n\n君主制——在独立路线中选择“解放黄金之城”的国策，在革命前或革命中出现的波希米亚王国的命运事件中选择国王，赢得波希米亚革命。\n\n胡斯派——要求是社保，走君主制路线，同意巴托斯或普罗赫兹卡牧首的要求，赢得波希米亚革命。\n\n旗帜党——要求是社民或社自，不要取缔防卫组织，也不要监禁罗兹塞瓦奇。\n\n工团/共产——以任意路线实现独立，然后在社会主义者叛乱事件中选择向人群开火，杀童凶手过后扎波托茨基就会政变。\n\n温和进步党——第一次选举不要选社民，1942年选举可选。\n\n商人党——第一次选举不要选威民，1942年选举可选。\n\n民族统一党——第一次选举不要选威民，1942年选举可选。\n\n米兰·霍贾——走捷克斯洛伐克重生路线，1942年选举可选。\n\n第二次选举的其他政党——1942年随便选。"
 guides.104.a:0 "哇哦"
 guides.105.t:0 "克里米亚指南"
 guides.105.d:0 "问：如何走克里米亚的各种路线？\n\n答：\n德国驻军：处理鞑靼人起义。\n\n其他路线：选择鞑靼人，处理德国人动乱。\n\n克里米亚汗国：要求奥斯曼支持，接受复辟要求或者完成汗国复辟国策。\n\n可萨汗国：完成独立线的左线国策树（注意，左线只能是赛达梅特上台），“克里米亚的唯一官方语言”国策后将触发事件“卡拉伊姆人骚乱”，选择“我们语言相近，他们很快就能学会克里米亚鞑靼语了！”后不久，他们将叛乱。\n\n德米特里·乌里扬诺夫（列宁的弟弟）：完成独立线的左线国策，“对鞑靼工人的优惠待遇”国策之后将触发事件“斯拉夫工人罢工”，不管他们。一段时间后乌里扬诺夫将起义。如果你用乌里扬诺夫统一俄国，你将能转变为俄社，并使用他们的国策树（不包括政治线）。"
 guides.105.a:0 "哇哦"
 guides.106.t:0 "危地马拉指南"
 guides.106.d:0 "问：我该怎么让乌维科登基？\n答：同意民主选举，让乌维科发动政变，攻击社民支持者而非工团主义者，包围叛军，占领伯利兹，牺牲首都，然后统一中美洲，在统一事件中选择登基，解锁新国策树。\n如果你选择“留存中美洲特色”国策，你将能够开展一场美洲大战役，但不能征服西班牙和法国，重建一个新的法兰西帝国。\n\n问：如果走国法流亡者路线？\n答：让乌维科当皇帝，完成“欢迎来自真法国的难民”国策（需要国法先被干掉），等一个月，流亡者将发动政变，让他们赢。"
 guides.106.a:0 "哇哦"
 guides.107.t:0 "锡金指南"
 guides.107.d:0 "问：锡金的各种线路？\n\n答：杰曼·雷布查线。塔希改革时让其屈服于贵族，杰曼就会政变。洛里奇出现后，可以选择维持当前意识形态，也可以追随洛里奇，一转极权（红色神权或君社）。婆罗多公社被灭后，会触发印度流亡者进入锡金的事件，接着他们可以在之后的事件中推翻杰曼，解锁工团线。\n\n卡齐反政变。让杰曼上台，完成国策“扫除贵族害人虫”，杀掉塔希，卡齐有所动作后把部队派往乡村，杰曼就会被推翻（要阻止政变的话，就要把部队派往首都）。之后，可以让贵族守旧派掌权（家独，有两位可以加冕的国王，也可以不要国王），也可以让民主改革派上台。\n\n民主改革派上台会举行大选，可以选民粹、社保、市自、社自、社民，如果在之后选择守旧派，那么就能选威民、家独，并相应地解锁市自、社保国策树。塔希线也可以举行大选，有威民、社保、市自、社自、社民，用的是民主国策树。如果塔希线选了社民，那么民粹派和卡齐会发动政变。卡齐守旧派路线中，民粹派也会发动政变。\n\n锡金在征服印度或中国后可以改国名，蒙古的疯男爵可以让塔希担任傀儡中国的皇帝。"
 guides.107.a:0 "哇哦"
 guides.108.t:0 "圣诞节MEME指南"
 guides.108.d:0 "问：怎么玩圣诞内容？\n\n答：进入游戏前，在“1935的圣诞节”游戏规则中选择“圣诞老人的消失”。\n\n问：那每个线该怎么进？\n\n答：点完初始国策树后会有搜寻圣诞老人事件，然后你可以选择热力小鬼，冰雪小鬼，锡兵圣诞老人，共产主义的路线。如果选择自行搜寻，会有格林奇的事件，如果你相信他，他就会政变了你。如果你不相信他，你就能找到圣诞老人。      "
 guides.108.a:0 "哇哦"
 guides.109.t:0 "纽约市指南"
 guides.109.d:0 "问：拉瓜迪亚、威尔斯、斯坦贝克、特朗普？\n\n答：提前召开大选，选择你喜欢的那位上台即可。（选举每四年一次）\n\n问：坦慕尼协会、黑帮、警察？\n\n答：随便选举一位市长上台，然后你会在决议界面看到有关每个势力的倒计时。让对应势力的倒计时失败会触发他们政变的事件（黑帮和警察共享一个倒计时，你需要在政变事件中决定谁会上台）。坦慕尼协会上台后可以选择保守派的奥瓦尼或者自由派的沃克作为领导人，黑手党可以投票让“福星”卢西亚诺、迈耶·兰斯基或者“癫虫”西格尔做老大，警察路线里面瓦伦丁局长退休以后会换成瓦兰德，如果你选择在警察内部搞腐败他会更早退休（不要点反对坦慕尼和黑帮的国策，也不要让倒计时失败）。如果想玩极权主义的卢西亚诺隐藏线，就让卡彭在联合工团掌权，选卢西亚诺上台后会触发相应的事件。\n\n问：荷尔斯泰因、圣克莱尔？\n\n答：让黑帮上台，完成“我们的犯罪集团”国策后会有事件，选择与他们结盟，在随后的事件链里面允许他们一直进行颠覆活动，随后就会爆发政变，再选择一个人当领袖即可。\n\n问：哈里森、克罗斯韦斯？\n\n答：先选一条市长路线玩，弹出哈林种族骚乱事件后把警察撤出哈林区，放任情况恶化，很快就会触发政变的事件，这时候再二选一即可（克罗斯韦斯是德莱昂主义，哈里森是乔治主义）。这两个人都有自己的特殊阵营而且可以拉不同的成员，也都可以征服加勒比地区并（或）与黑带和平统一。\n\n问：基督教阵线？\n\n答：让坦慕尼协会上台，等一段时间会有一个关于基督教阵线的事件，选择将他们整合进政权。之后会触发阵线实力壮大的事件，不要阻止他们，随后阵线就会发动政变。然后你就能在三人当中选一个当领袖（波普是军团主义，莫洛伊是毕奥神父思想，麦克威廉斯是宗教原教旨主义，他们三个也是纽约唯一的亲奥地利派系）。如果联盟国和纽约笑到最后，麦克威廉斯可以让联盟国加入帝约；波普可以与意大利民族主义协会结盟或者对统一后的意社宣战。\n\n问：小罗斯福？\n\n答：选斯坦贝克作为市长，之后在小罗斯福的事件中让他做大做强。和平移交权力，斯坦贝克会变成部长；拒绝让出权力，极权派会发动政变夺权，但这样斯坦贝克不会成为部长。如果极权派加入第三国际，还可以在美团赢得内战并送出要求之后和平统一（取决于美团怎么做，拒绝的话美团会宣你，坚守一年之后可以跟美团白和）。\n\n所有路线都可以统一美国或者只拿新英格兰/宾夕法尼亚/新泽西，民主派可以与部分内战势力/协约/帝约/国际结盟（看你实际选择的路线），或者也可以保持中立（波普线可以加意大利黑手党阵营）。在你统一美国以后不会解锁新的国策，但是会有事件允许你收复美国的宣称领土。如果你成功活到内战结束，可以在新英格兰寄了以后白和，如果宾夕法尼亚和新泽西也在你的手上，他们在白和之后会跟新英格兰一起成为你国家的一部分。\n\n问：坎普、哈米德、劳森？\n\n答：在哈林区骚乱事件中选择派出国民警卫队并不要将其撤出，之后就可以选择领导人了。民粹的哈米德和家独的劳森可以转威民、社保，并让小亚当·克莱顿·鲍威尔和哈兰·杰克当部长。极权的坎普则可以转工团、激社。如果不转意识形态的话，三人都可以让桑·拉上台，劳森还可以换成加维，并且在接纳了基班古教会后可以把子意识形态转为基班古教，哈米德则可以转伊斯兰原教旨主义。三人都可以同黑带或宪政国一起和平瓜分美国。"
 guides.109.a:0 "哇哦"
 guides.110.t:0 "缅甸指南"
 guides.110.d:0 "问：缅甸的各路线？\n\n答：学生抗议事件，突突突是君主线，站在抗议者一边是工团线。"
 guides.110.a:0 "哇哦"
 guides.111.t:0 "冰岛指南"
 guides.111.d:0 "问：冰岛民粹（维京）路线？\n\n答：先让冰岛独立，然后让不列颠联盟赢得鳕鱼战争，走社会主义线（完成贸易线最后一个国策，再完成扩大渔区国策，点选新出现的决议后，可以通过玩家专属事件跳过鳕鱼战争事件链直接选择结果）完成组建新内阁和忠于不列颠两个国策，等待触发民族主义政变事件，使其成功即可。三条维京路线都有很多仗可打，左线能放出丹麦法区南英格兰特色傀儡并切换为新封建主义或无政府资本主义意识形态，中线能吞并挪威并更换特殊国名，右线能吞并加拿大并更换国名。完成每条线给予的战争目标后，可以再获得宣称维京人土地的战争目标。"
 guides.111.a:0 "哇哦"
 guides.112.t:0 "加拿大指南"
 guides.112.d:0 "问：自由党、保守党、平民合作联盟？\n\n答：选举按照个人喜好来就行，然后通过C-7法案。如果社民派在第一次选举中与自由党结盟，那么就能在第二次选举中选他们。民主线社信党也是第二次选举的可选项。自由党的意识形态可以是市自，也可以是社自，这取决于你在事件中的选择以及是否与平民合作联盟/工党结盟。\n\n问：社会信用党、君主专制、帝国统一党？\n\n答：选举随便来，别让C-7法案通过。行使王室特权，然后选你想要的人，每个人都有专属路线。\n\n问：光复后的加拿大路线？\n\n答：爱老八是唯一一位民粹派的国王。如果想让其他的国王上台，例如他的兄弟，就让爱老八在专制路线中被枪杀，或在其他路线中退位。如果想看爱老八发癫搞亚瑟王，就让他中枪沉睡不醒，然后过一个一半成功率的检定（可以在规则设置中设定必然成功）。\n\n要让爱老八退位，先行使王室特权，再耸一下举行选举。如此便会触发一事件，大意是由于失败的倒行逆施，人们很是不满，议会便提议爱老八退位。\n\n要让伊丽莎白公主上台，先让阿尔伯特继位，然后不让他接受肺癌治疗，等他死。\n\n除了专制路线和帝国统一党的路线外，所有路线最后都能点“加拿大世纪”。\n\n要统一加拿大和英国，只能走专制路线或民族主义路线，然后解散加拿大王国（哈格雷夫的社信党可以通过事件达成）。\n\n每个党派都能进行光复后的三条协约国路线，但前提是流亡者的权力平衡不能太过。如果光复之前，国王施行了专制统治并许诺恢复民主，那光复后加拿大会退出协约国。\n\n各个政党在输掉一次选举后会获得新的领导人，你可以通过决议召开提前选举来手动加速这一过程。\n\n问：哈格雷夫和强者之证？\n\n答：C-7法案失败失败后行使王家特权，选社信党，完成同英国社信党合作的国策，把强者之证提为官方的环保组织，千万不要让哈格雷夫出任英国流亡首相（如果道格拉斯和庞德没能成为首相的话就可以选哈格雷夫，但这样的话他就会成为你放出来的英国的领导人），在“换换风景”事件中让其成为加拿大总理，之后正常走帝国联邦线就可以建立内奥克斯瑙旺版本的帝国联邦。\n\n问：新安茹帝国？\n\n答：确保加英统一，阿尔康为首相，选各种亲法选项，让爱德华迎娶伊莎贝尔，法国是法兰西行动线，然后等待事件。"
 guides.112.a:0 "哇哦"
 guides.113.t:0 "法兰西民族国指南"
 guides.113.d:0 "您是想看光复前指南还是光复后指南？请注意：光复前的选择往往会影响光复后你可以选择的路线。如果你想选择光复后的一条特殊路线，别忘记看看光复前指南的前置"
 guides.113.a:0 "光复前指南"
 guides.113.b:0 "光复后指南"
 guides.114.t:0 "法兰西民族国指南"
 guides.114.d:0 "光复前\n（译者注：法兰西行动和波中委路线的拿六会有一些独特的外交国策内容）\n贝当掌权：在莫里斯·雅南辞职后，选择军事戒严。\n\n民主归来：莫里斯·雅南辞职后，会见马兰，接受其条件。\n\n德拉罗克与火十字团：莫里斯·雅南辞职后，会见德拉罗克，接受其条件。\n\n法兰西行动与君主制复辟：莫里斯·雅南辞职后，会见马兰或德拉罗克，拒绝其条件，之后接触极右翼联盟，同意莫拉斯的要求废除流亡法，但忽略拿破仑的要求。\n\n拿破仑六世：莫里斯·雅南辞职后，会见马兰或德拉罗克，拒绝其条件，之后接触极右翼联盟，同意莫拉斯的要求废除流亡法，同意拿破仑的要求并予以全力支持。\n\n达尔南与军团：在莫尔达克被杀事件中，选择调查阿拉伯人，在莫里斯·雅南辞职后，和马兰或德拉罗克会面，但是不接受他们的条件，后接触极右翼联盟，不同意废除流亡法，与达尔南会面。"
 guides.114.a:0 "哇哦"
 guides.115.t:0 "法兰西民族国指南"
 guides.115.d:0 "光复后\n（解锁战争之路前先要完成重建国策树里的重振军事威望）\n贝当光复后路线\n戴高乐：选择戴高乐军事计划，在“政府中的军官”事件中选择第一个选项，让他当总理，在各种选择里增加他的影响力，不要许诺恢复宪法，当光复后贝当被要求退休时，同意。\n达尔朗：选择达尔朗军事计划，在“政府中的军官”事件中选择第一个选项，让他当总理，在各种选择里增加他的影响力，不要许诺恢复宪法，当光复后贝当被要求退休时，同意。\n重建宪政：光复前选择马兰做合作者，承诺恢复宪法，光复后兑现承诺。\n民族革命：光复前选择马兰或德拉罗克做合作者，拒绝二者的要求，光复后维持贝当权力不对总理让步。\n注意：贝当会在1951年去世，不过，你也可以在完成他的国策树三周后触发的事件中让他提前去世，其继承人有三个：魏刚、伊索尔尼和拉巴泰特。伊索尔尼要走威民线，拉巴泰特要走家独线，魏刚两个都行。\n\n民主光复后路线\n你只需要一路点国策树并在选举里选择你想要的路线，政府每四年一次选举，总统每7年一次，意味着你能用不同总统搭配不同的政府。\n\n火十字团光复后路线\n一路点国策树，德拉罗克将逐渐病重并最终去世，然后你可以在接下来的国策里选择他的接班人（其中有密特朗）。\n\n君主制光复后路线\n法兰西行动：解放前不要与兜帽团或戴高乐合作，莫拉斯自然会获得权力。若已经合作了的话，就不要增加其影响力，想办法将之逮捕或杀死。正常情况下，莫拉斯会在1952年11月去世，不过，在完成其国策树后的事件中也可以让他提前去世，好解锁继承人的内容。\n戴高乐：选择戴高乐军事计划，光复前接受其帮助，光复后莫拉斯的地方主义政策会造成不稳定，让戴高乐权力增长，不要阻止他，让他政变，然后再让他赢得选举。\n茹弗内尔：选择戴高乐军事计划，光复前接受其帮助，在各种事件里选择对民主派友好，光复后莫拉斯的地方主义政策会造成不稳定，让戴高乐权力增长，不要阻止他，让他政变，然后选择让茹弗内尔赢得选举。\n兜帽团：亨利·莫尔达克遇刺事件里调查土著，然后要么支持戴高乐军事计划，但不接受他的帮助，要么支持达尔朗军事计划。光复后莫拉斯的地方主义政策会造成不稳定，让兜帽团权力增长，不要阻止它，让它政变。\n\n拿破仑光复后路线\n爱国青年团：光复前国策选择“踽踽独行”，光复后不要让拿破仑六世政变。光复前选择“恳求法兰西行动”等国策的话则是与对应势力合作，也可进入该路线。\n帝国社民党：光复前完成国策“组建广泛政府”，光复后让拿破仑六世政变，在选举中选择社民党。\n波拿巴派中央委员会：光复前完成国策“组建广泛政府”，光复后让拿破仑六世政变，在选举中选择波拿巴派中央委员会。\n\n达尔南光复后路线\n只要一路点国策，最后就可以在马塞尔·勒菲弗（庇护十二世）和达尔南之间做选择，达尔南可以继续担任大团长，或加冕为皇帝。\n注：达尔南傀儡整个意大利后可以安插庇护十二世上位为真正的教宗，而庇护十二世则可以核心意大利。\n\n教宗庇护十二世路线\n光复后加冕教宗为法国君主，然后打下意大利。一旦意大利被征服，你将收到庇护十二世成为教宗的事件，这条线就会解锁。"
