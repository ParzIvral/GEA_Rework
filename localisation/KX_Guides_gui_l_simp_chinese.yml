 guides.10.t:0 "美利坚合众国指南"
 guides.10.d:0 "问：怎么查看“不合的众国”的废案？\n\n回：游玩合众国，完成麦克阿瑟的“美利坚的恺撒”路线。然后在事件触发时杀死麦克阿瑟。（这条路线只有国家，没国策树，如果不想等事件触发，可以直接控制台输入“event ustates.998”触发刺杀事件）"
 guides.10.a:0 "哇哦"
 guides.10.b:0 "返回"
 guides.133.t:0 "美利坚合众国指南"
 guides.133.d:0 "问：国家人民党/平民党？\n\n答：大选选陷入僵局，用加纳避免内战就能在40年选举中选平民党（进步派、社会主义派），用诺里斯避免内战能在40年选国家人民党（民族派）。在平民党/国家人民党的独特事件链开始后要全选增加胜选概率的事件和决议，当胜选概率达到60%及以上（广受支持或胜券在握）后在大选中就可以让平民党/国家人民党获胜。\n\n问：怎么让我想玩的路线获胜？\n\n答：对于平民党的朗派和里德派，以及所有国家人民党派系都只需要在演讲人选中选择自己派系的人演讲。对于平民党的妥协派则要让平民党的政策分布为3：3，之后会提名一位新的妥协人选作为平民党的总统提名。\n\n问：和平建立白劳德的联合工团/布拉德利政变？\n\n答：进入平民党路线，提名里德或者白劳德作为总统。\n具体方法：\n在演讲人选中都选择社会党派系选择的人演讲。\n\n40年大选走平民党国策树，要触发政变则需要优先完成社会党派专属国策树；在事件“华尔街的命运”中选择拆除华尔街，“最高法院的变动”中选择“……以及正确的裁决”，“选举人团制度的命运”中彻底废除选举人团制度。\n\n在不完成国策“为平民而生之军”的前提下完成上述所有步骤后就会触发政变，可以选布拉德利政变（威民，解锁三巨头国策树）、白劳德极权派政变（可以变身联合工团）。\n\n问：国家人民党和平建立宪政国/霍尔德里奇的社民军政府？\n\n答：完成“终结无政府主义威胁”国策后触发里德被刺杀事件。之后霍尔德里奇会发动政变。霍尔德里奇的军政府属于社民，政府是进步派，有原住民做副总统。霍尔德里奇政变几天后巴顿会反政变，成功即可变身宪政国，再过几天就可以在巴顿、默里、拉塞尔、克伦普路线之间进行选择了。"
 guides.133.a:0 "哇哦"
 guides.133.b:0 "返回"
 guides.11.t:0 "保加利亚指南"
 guides.11.d:0 "问：保加尔主义路线：？\n\n答：完成国策“保加利亚化”后，将触发关于鞑靼移民的事件，后续还会出现是否给予资助的选项。在事件“鞑靼人的提议”中选择“或许可以给予一些资助”。之后会触发领导人支持率下降的事件，最终在“代理领袖”事件触发后完成“比例代表制”或“重铸民族自豪”国策（需确保当前政府为威民/市自/社自/社民政体），即可由保加尔主义者接管政权。\n\n问：环节集团民粹/极权路线？\n\n答：打输巴尔干战争，然后选择割让领土而不是继续打下去；或者打赢战争之后等到1939年下旬斐迪南被刺杀，然后在事件选项里选择环节集团。而要玩极权环节集团，你得保留格奥尔基耶夫（而不是让鲁科夫取而代之），然后完成“整合忠诚极权派”国策，最后在事件里选择极权化环节集团（没有新国策，但是有新国名和国旗）。\n\n鲁科夫上台一个月之后可以重新安插傀儡君主基里尔一世（鲍里斯的兄弟）（解锁保加利亚第三帝国路线）。又或者最终被伊万·多切夫领导的军团推翻。（如果你维持共和长达一年半之后）"
 guides.11.a:0 "哇哦"
 guides.12.t:0 "奥斯曼指南"
 guides.12.d:0 "问：德属奥斯曼？\n\n答：沙漠战争开打后接受德国援助，十天后再次接受德国援助，两周后将军队交给德国控制，最后再等上个二十天即可。\n德属奥斯曼的全部线路都可以在完成所有国策后收复巴尔干的失地，中线的奥本海姆有泛伊斯兰的宣称，右线的莱斯有泛阿拉伯的战争目标。\n\n问：国家民粹主义/极权主义的骨干运动？\n\n答：首先需要让凯末尔遇刺。\n可以在“最高安全局的处境”事件中选择现代化，来让凯末尔遇刺。\n或者选择全部清洗，然后在“阴谋对抗大维齐尔”事件中选择静观其变来让凯末尔遇刺。\n在凯末尔遇刺后的一系列事件中，让费夫齐帕夏夺权。\n完成费夫齐国策树，结束紧急状态。\n完成新国策树中的“集中国家权力”和“整合骨干运动”。\n完成最后的国策后，可以选择是保留苏丹，还是废黜苏丹、转为民粹或极权。\n\n问：社保伊斯兰线/家独绝对君主制线/哈里发线？\n\n答：凯末尔教育改革失败。\n凯末尔要求解散议会时，让苏丹炒掉凯末尔。\n召开提前大选。\n选自由协约党。\n让保守派代表的支持率低于零，苏丹就会出手干预，萨巴哈丁亲王下台，沙基卜·阿尔斯兰成为大维齐尔，穆罕默德联盟党掌权，转入社保线。\n正常走国策树，“旧哈里发”点完五十天后，军中的凯末尔主义者会政变。\n要走家独绝对君主制线的话，就让苏丹挫败政变，解锁右边的国策树分支。\n要走社保伊斯兰线的话，就让苏丹承认实行温和的伊斯兰宪法，解锁左边的国策树分支。\n点完中间共通分支的最后一个国策“泛伊斯兰帝国”后可以成立奥斯曼哈里发国，并获得穆斯林世界的核心。（两天后可以通过事件选择新的国名：奥斯曼哈里发国、最高朴特哈里发国或哈里发国）"
 guides.12.a:0 "哇哦"
 guides.14.t:0 "国民党左派指南"
 guides.14.d: "问：汪精卫？\n答：完成第一次归正大会的国策后解锁汪宋权力平衡。完成第三次归正大会的国策前，保证权力平衡偏向汪精卫的程度大于激进度。汪精卫赢得权力平衡后，一共有三条统一后的子路线。\n“授权总统秘党”默认解锁。\n极权主义支持度高于25%，解锁“走向激进改组”。\n社会民主主义支持度高于25%，解锁“承诺临时宪法”。\n\n问：宋庆龄罢免汪精卫？\n答：完成第一次归正大会的国策后，解锁汪宋权力平衡，站在宋庆龄一边。完成第三次归正大会的国策前，保证权力平衡偏向宋庆龄的程度大于激进度。宋庆龄赢得权力平衡后，一共有四条子路线。\n“红色拿破仑”默认解锁。\n社会自由主义支持度高于25%，解锁“先总理遗教”。\n工团主义支持度高于25%，且中工盟的领导派系是世界社，解锁“大同之梦”。\n工团主义支持度高于25%，且中工盟的领导派系是工团党正统派，解锁“农工联盟”。\n\n问：胡宗南二次国民革命？\n答：完成第一次归正大会的国策后，解锁汪宋权力平衡。完成第三次归正大会的国策前，保证激进度大于权力平衡偏向任何一方的程度。在国民党内战中，让胡宗南的“复兴社阴谋”实力高于其他三方。胡宗南有两条子路线。\n“红色委员长”默认解锁。\n极权主义支持度高于35%，解锁“民族复兴”。\n\n问：陈公博反政变？\n答：同胡宗南线。在国民党内战中，让陈公博的北京政府实力高于其他三方。赢得内战后，陈公博有两条子路线。\n“主席遗志”默认解锁。\n极权主义支持度高于40%，解锁“革命世界观”。\n\n问：工团和邓演达？\n答：走宋庆龄线，完成国策“$CHI_convene_the_peoples_congress$”，事件“人民代表大会”选择“让空想家浪费时间去吧”，事件“镇压及其后果”选择“邓演达错了”，之后邓演达就会政变，可以让他或者工团党上台。\n\n问：蒋介石和戴笠？\n答：走胡宗南线，完成国策“$CHI_proclaim_permanent_purge$”。事件“爆炸撼动首都”和“中特局遭到指控”都选第二个。戴笠上台后，点完初始国策树，蒋介石事件链中全选利于蒋介石的选项，其就会成功政变。如果想继续戴笠线的话，就都选择利于戴笠的选项就行了。"
