 guides.13.t:0 "两广指南"
 guides.13.d: "问：国民党左派？\n\n答：陆荣廷死后，在李宗仁入侵事件中选择出兵迎战。\n在梧州沦陷事件中选择守住侧翼。\n在陈铭枢的决定事件中选择开始行动。这样可以避免内战。\n在国民党领导人会面事件中选择陈铭枢。\n\n问：联省派？\n\n答：在李宗仁入侵事件中选择保卫梧州。\n在焦头烂额事件中随意选择。选择撤退将使广东控制梧州。\n在陈铭枢的决定事件中选择李宗仁不过是一个骗子强盗。\n在粤桂战争中站在陈炯明一边。\n\n问：商团？\n\n答：在李宗仁入侵事件中选择出兵迎战。\n在梧州沦陷事件中选择增援马济。\n在南宁战役事件中随意选择。选择求援将使广东控制桂林。\n在守灵事件中选择随从被枪杀。\n在陈炯明遇刺事件中选择陈廉伯，然后在粤桂战争中站在他一边，随后赢得内战即可。\n\n问：新桂系？\n\n答：同国民党左派路线，但在国民党领导人会面事件中选择李宗仁。\n\n问：旧桂系？\n\n答：同商团路线，但在守灵事件中选择袭击者被杀，然后在内战中站在广西一边并取胜即可。"
 guides.13.a:0 "哇哦"
 guides.130.t:0 "马耳他指南"
 guides.130.d:0 "问：马耳他的各条线路？\n\n答：先完成新马耳他之子的初始国策。\n\n民主 - 初始国策点完后选择举行选举。民主线分为社保的保卢·博法的温和工党、社自的玛贝尔·斯特里克兰和市自的杰拉尔德·斯特里克兰的立宪党、社保的恩里科·米齐和民粹的乔治·博尔格·奥利维耶的国民党。立宪党是让英国人统治马耳他；国民党亲北意，北意没了还可以亲德，并且还可以换掉民主政体，让议会领袖或马耳他主教莫鲁斯·卡鲁阿纳上台；温和工党亲协约国，可以以教宗的名义收复意大利或统一地中海岛屿。\n\n红线 - 初始国策点完后选择骑士团，让叛乱成功，或走正常的民主线，选举选激进工党。红线分为激社的多姆·明科夫的激进工党和极权的卡尔梅洛·博尔格·皮萨尼的未来极权派。要走极权线，在事件中选他们就行。两条线均可以加第三国际、拿下意大利或泛/亲阿拉伯。意社挂掉后，极权线可以让流亡的墨索里尼当国家元首或政府首脑。激社线加入第三国际后可以转工团。\n\n骑士团 - 初始国策点完后选择骑士团，镇压叛乱，或走正常的民主线，选举选国民党的骑士团派。家独线可以通过事件请回德国人，让维夏德·冯·阿尔文斯莱本或奥斯卡·霍亨索伦皇子（前提是奥斯卡没被其他国家抢走）做领导人，也可以骑士团一条道走到底，搞十字军，收复耶路撒冷后可以为自己和十字军国家选领导人，如果不搞十字军的话可以一转威民。"
 guides.130.a:0 "哇哦"
 guides.131.t:0 "克里特指南"
 guides.131.d:0 "问：德国线？\n\n答：完成国策“麻烦接踵而至”后触发事件“重建”，选择“我们要不惜一切代价守住克里特岛！”。如果在之前的事件“找寻米勒”中找到了米勒，那他就可以担任德国线的领导人，否则就是从奥斯特坎普、安德烈、科赫中三选一，而选科赫的话，空降猎兵就会发动政变，领导人是海德里希或施图登特。\n\n问：非德国线？\n\n答：事件“重建”中选择“德国对克里特岛的统治注定要失败，快润吧！”。然后在事件“克里特的命运”中可以选择自由民主制、亲希腊的摄政或协约国间谍政变。选摄政而希腊又非君主制的话，你就可以建立独立的君主国或加冕流亡的希腊国王。\n\n问：土耳其维拉耶线？\n\n答：事件“重建”中选择“我们一无所有，卖了这该死的岛……”。事件“克里特岛问题”中选择“把克里特岛让给奥斯曼人”，土耳其同意后就可以建立穆斯塔法·埃尔图鲁尔帕夏的傀儡国。"
 guides.131.a:0 "哇哦"
 guides.116.b:0 "爱尔兰共和军路线"
 guides.132.t:0 "爱尔兰指南"
 guides.132.d:0 "问：爱尔兰共和军军政府/政变/领导人？\n\n答：1936年的复活节起义纪念两周后会有一事件“奋战不息者”，选择“也许我们能从和平之中得到些什么，安排与这个‘军议会’会面”，之后批准协议，政府就会变成柯林斯领导的共和军政府，国家名称也会相应地发生变化。选举选德·瓦莱拉/社保的共和党，恢复君主制（见指南）。\n\n事件“计划中的阻碍”选择“呸！我是总统，我爱干啥干啥！”，后面的事件选“爱尔兰共和军没什么威胁，多留意一番便可”。之后，共和军就会政变，领导人可以选卡哈尔·布鲁阿、皮达尔·奥唐奈、共和军军议会或者德·瓦莱拉。"
 guides.132.a:0 "哇哦"
 guides.132.b:0 "返回"
 guides.134.t:0 "阿富汗指南"
 guides.134.d:0 "第四次英阿战争胜利线\n\n问：纳斯鲁拉汗？\n答：打赢第四次英阿战争，事件“王储登台”选择不调查哈比布拉之死，事件“军队分裂”选择站在纳斯鲁拉一边，事件“阿曼努拉流亡海外”选择不清洗军队。\n\n问：奥斯曼流亡线？\n答：走纳斯鲁拉汗线（见上），让奥斯曼输掉沙漠战争，然后就可以在事件“‘勇士皇子’的提议”中选择让奥斯曼流亡者来到阿富汗。要让奥斯曼·福阿德上台，就在“奥斯曼军队请求军中职位”和“奥斯曼帝国的行政人员请求进入政府”两个事件中全部选择拒绝，要建立阿富汗-奥斯曼二元帝国的话，就选同意。\n\n问：阿曼努拉汗？\n答：打赢第四次英阿战争，事件“王储登台”选择调查哈比布拉之死。阿曼努拉线中间的三个国策会决定其改革的方向。\n\n问：穆罕默德·纳迪尔沙阿？\n答：打赢第四次英阿战争，事件“王储登台”选择不调查哈比布拉之死，事件“军队分裂”选择站在纳斯鲁拉一边，事件“阿曼努拉流亡海外”选择清洗军队。\n\n第四次英阿战争战败线\n\n问：哈比布拉·卡拉卡尼？\n答：输掉第四次英阿战争，或者选择不开战。之后，国家会大乱，而卡拉卡尼则会趁机占领喀布尔。\n\n问：穆罕默德·纳迪尔沙阿？\n答：输掉第四次英阿战争，或者选择不开战。之后，国家会大乱，而卡拉卡尼则会趁机占领喀布尔。摆烂不去管纳迪尔沙阿，等时间到了他就会占领喀布尔（让阿里·艾哈迈德汗提前占领喀布尔也行）。\n\n问：穆罕默德·查希尔沙阿/穆罕默德·达乌德汗？（注：只要纳迪尔沙阿上台就可以走这条线，第四次英阿战争输不输无所谓）\n答：事件“为国家的下一代增光添彩”中让纳迪尔沙阿遇刺身亡，事件“达乌德汗的政变！”中让保王派胜利就是查希尔沙阿线（这条线的最后会通往民主线），否则就是达乌德线。\n\n问：阿里·艾哈迈德汗？\n答：输掉第四次英阿战争，或者选择不开战。卡拉卡尼占领喀布尔后，让贾拉拉巴德起义成功，之后便可以在纳迪尔沙阿和艾哈迈德汗之间进行选择了。\n\n问：红线？\n答：输掉第四次英阿战争，或者选择不开战。卡拉卡尼占领喀布尔后，打败艾哈迈德汗和纳迪尔汗。在完成“解放思想”国策前完成“安抚普什图贵族”的国策，在“洛伊汗的要求”事件中选择“把这个出言不逊的酋长和他的手下都给我宰了！”\n\n问：阿富汗自治领？（注：只有一开始选德里自治领才能进入这条线）\n答：扮演德里自治领，打赢阿富汗。事件“第四次英阿战争：胜利！”中选择建立傀儡政权，然后就可以在之后的事件中切换到阿富汗。"
 guides.134.a:0 "哇哦"
 guides.135.t:0 "布里亚特指南"
 guides.135.d:0 "问：如何玩到外贝加尔/布里亚特？\n答：方法一，完成国策“谢苗诺夫问题”，在事件“谢苗诺夫阿塔曼”中选第一项，就能爆出谢苗诺夫统治的外贝加尔军区。\n方法二，同雅库特，在上乌金斯克实施戒严，让高尔察克的权势高于地方主义者，就能爆出独立的布里亚特-蒙古。\n\n问：外贝加尔/布里亚特的各条路线？\n答：谢苗诺夫线，只能经由方法一实现。\n民主线（社民、激社、社保、民粹），走方法二或在谢苗诺夫线完成国策“忠诚的布国委”，事件“布国委问题”选“让哥萨克成为布国委领袖”，抗议者要求布国委下台时，选“我们才是这里的统治者”，之后布国委就会政变。\n战斗无神论者线，方法一，走谢苗诺夫线，完成国策“搜捕社会主义分子”，在事件“搜捕赤塔周边”中选择“让哥萨克师过去”，触发事件“‘赤塔大屠杀’”，选择“迅速动员，努力夺回赤塔”。\n方法二，走布国委线，事件“宗教问题”和“战斗无神论者的干预”中都不要选第二项。"
 guides.135.a:0 "哇哦"
 guides.136.t:0 "巴塔哥尼亚指南"
 guides.136.d:0 "问：丰特/阿劳坎尼亚王国？\n\n答：不要杀，也不要抓丰特，事件中都选加极权主义支持率的选项，对阿根廷战争期间或结束后他就会政变。可以在政变事件中让他上台，或者建立马普切人的王国。\n\n问：克里斯塔利/波萨达斯？\n\n答：完成丰特的国策“巴塔哥尼亚红色罗宾汉的领地”后会触发克里斯塔利晋升将军的事件，等上个三年就可以了。"
 guides.136.a:0 "哇哦"
 guides.137.t:0 "茅茅运动指南"
 guides.137.d:0 "问：茅茅运动的各条路线？\n\n答：茅茅运动的第一段内容只是篇“序章介绍”，最后肯定会被肯尼亚吞并，国家也会切换至肯尼亚。中央非洲崩溃后，茅茅运动会再次起义，这时你就可以切换至茅茅运动，真正开始其内容了。茅茅运动有三条可选路线：奥尼扬戈·奥巴马长者的极权线、斯坦利·马森格的民粹线和德丹·基马蒂的激社线。马森格和奥巴马可以统一前中央非洲，奥巴马还可以拿下美洲的黑人侨民地。基马蒂可以统一东非并拿下南阿拉伯和印度的黑人侨民地，还可以把领导人换成激社左翼民族主义的比尔达德·卡吉亚、非洲工团主义的弗雷德·库拜、民主工团主义的马坎·辛格，以及社民原住民社群主义的贾拉莫吉·奥金加·奥廷加。"
 guides.137.a:0 "哇哦"
 guides.138.t:0 "埃及指南"
 guides.138.d:0 "问：社民/社自/市自/社保/威民线？\n答：进行法鲁克改革，选自由或保守的选项，不要选绝对君主制，最下面的三个国策要达成君主立宪制或半君主立宪制的结果。除社民线外，其他线路都可以在1936年大选中进入，社民线要等到41年的大选。\n\n问：法鲁克家独线？\n答：进行法鲁克改革，选择绝对君主制的选项，最下面的三个国策要达成绝对君主制的结果。之后法鲁克就会大权加身，进入家独线。\n\n问：穆兄会政变/埃及哈里发国？（国策树同穆兄会的威民线）\n答：大选选社自或社民，国策中点世俗主义，等一段时间会触发穆兄会激进化的事件，不理他们的话就会政变。\n\n问：共和国线？\n答：大选选社民、社自或市自，打赢开罗战争，等上个几周会进行公投。"
 guides.138.a:0 "哇哦"
 guides.139.t:0 "纽芬兰指南"
 guides.139.d:0 "问：红线？\n答：选择打压工会、解决卡欣刺头，让科克同卡欣会面。要游玩加拿大红线的话，需要用红线纽芬兰打下加拿大，点“红色联盟”国策。\n\n问：米克马克线？\n答：先走红线，起义时接受原住民的援助，让权力平衡倒向英国一边，不要理会原住民的不满，让民众支持度小于五。\n\n问：民主线？\n答：不要让委任政府走向专制威权（同劳工运动协作、文官政府、不与圣约翰斯市长起争执），经济恢复后点“恢复民主”国策。\n\n问：加拿大红线？\n答：进入方法在上面。整个红线包括两条国策树，一条共通线，一条依据执政党变化的动态线。点“召开加拿大社会主义者代表大会”国策，在后续事件中一直选择支持的党派，之后再选择领导人，这样下面的国策就会动态发生变化。若联合工团赢得内战，则可以与其统一或向其宣战并傀儡后统一。"
 guides.139.a:0 "哇哦"
 guides.76.c:0 "查看新编人民社会党指南"
 guides.140.t: "鞑靼斯坦指南"
 guides.140.d: "一、社民、市自、社保民主线：在小游戏中把国家委员会的影响力拉到最高，开局事件选举行选举。\n\n二、加亚兹·伊斯哈基：接受赤卫队，走民主线，选举选突厥派，在国策中解散赤卫队，建立总统制共和国，再把伊斯哈基选上来。\n\n三、伊利亚斯·阿尔金：同伊斯哈基线，只是在最后选阿尔金。\n\n四、国民大会：走民主线，选举选国民大会。国民大会有两派：工团和社民，若要走社民路线，不要在乌法之战中支援巴什基尔的社会主义者。\n\n五、鞑靼左翼社革党（国民大会的左派）：走国民大会线，在乌法之战中支援巴什基尔的社会主义者，其他事件都选增加乌法派影响力的选项，然后在社民派上台后的党代会上，乌法派就可以掌权。\n\n六、鞑靼左翼社革党上台的其他方法：让穆斯林社会主义委员会推翻政府，之后俄国很有可能会要求重组政府，这时不要选索尔坦加利耶夫，选左翼社革党。\n\n七、索尔坦加利耶夫：在小游戏中把穆斯林社会主义委员会的影响力拉到最高，之后让其推翻政府。要提高政变几率，可以在开局事件中接受赤卫队，并且不要在乌法之战中支援巴什基尔的社会主义者。\n\n八、瓦伊西运动：“新保加尔公社”事件选“我们需要争取一切可能的盟友！”，然后让鞑靼左翼社革党或索尔坦加利耶夫上台，点国策“瓦伊西运动的遗产”，拒绝绿军的要求。\n\n九、鞑靼军团：把鞑靼军团的影响力拉到最高，开局事件选不举行选举。点军事线国策“制伏军团”，若军团的影响力高于国家委员会和国民大会，其就会发动政变。“沙菲·阿尔马斯与喀山市政大楼”事件选“废掉这酒蒙子”的话进入民粹少壮派路线，否则进入喀山大汗路线。"
 guides.141.t: "巴什库尔季斯坦指南"
 guides.141.d: "一、意志党工团线：赢得乌法之战，召开第四届库里尔台大会，选择增加工团主义支持率的选项。若出现“格底目派退出库里尔台大会”事件，选择“还是不要得罪大多数人的要好”。\n\n二、格底目线：赢得乌法之战，召开第四届库里尔台大会，选择增加社保支持率的选项。“意志党的威胁”事件选“最好还是按照民主规章来吧”，“意志党退出库里尔台大会”事件选“不要理会这些挑衅！”，“对峙之终”事件选择镇压意志党之乱。\n\n三、塔甘线：赢得乌法之战，选择增加威民支持率或降低其他派系支持率的选项。若要走家独路线的话，“意志党的威胁”或“格底目派退出库里尔台大会”事件选“塔甘应放手一搏”。"
 guides.82.b:0 "让我看看奥伦堡指南"
 guides.82.c:0 "让我看看乌拉尔斯克指南"
 guides.142.t: "奥伦堡哥萨克指南"
 guides.142.d: "一、奥伦堡哥萨克线：1、引发阿拉什斡耳朵内战，在内战开始前不要同哥萨克谈判。\n2、奥伦堡哥萨克军团的实力大于29%时，在决议中将其解散。\n\n二、哥萨克联合军团：完成国策“哥萨克联合阵线”。"
 guides.143.t: "乌拉尔哥萨克指南"
 guides.143.d: "一、放出乌拉尔哥萨克：1、引发阿拉什内战（请参照阿拉什指南第4点布尔什维克里的内容），在内战开始前不要同哥萨克谈判。\n2、乌拉尔哥萨克军团的实力大于29%时，在决议中将其解散。\n\n二、阿塔曼托尔斯托夫：在“两家之争”中逮捕博罗丁。在minigame里击败哈萨克人。\n\n三、阿塔曼博罗丁：在“两家之争”中不要逮捕博罗丁。在minigame里击败哈萨克人。\n\n四、奥伊尔维拉耶：在minigame里击败所有的阿塔曼。（最好选择托尔斯托夫上台）"
 guides.144.t: "挪威指南"
 guides.144.d: "问：吉斯林线？\n答：1936年大选选激社，让吉斯林和社会卫队推翻政府。之后可以选择迎回国王走首相线，也可以选择独裁到底。\n\n问：诸神黄昏圈线？\n答：让吉斯林上台，迎回国王，恢复议会，让诸神黄昏圈政变成功。\n\n问：如何加入阵营？\n答：加拿大（限民主线和保王吉斯林线）：完成国策“渥太华的国王”解锁决议。\n俄罗斯（限非红线）：同俄罗斯意识形态相同。\n德国：瑞典转红。"
 guides.144.a:0 "哇哦"
 guides.54.b:0 "死亡圣神、弗里达·卡罗、基督军、农民军和尤卡坦？"
 guides.145.t:0 "墨西哥指南"
 guides.145.d:0 "死亡圣神线：让萨帕塔死，建立民主联盟，让联盟破裂，让加尔萨与反社联盟合作，让金衫军政变成功，等巩固国家的75天倒计时走完。之后会触发死亡圣神的事件链，让邪教徒们全胜（让军队胜利的话会解锁其余的金衫军内容）。\n\n弗里达·卡罗线：走卡拉斯科的阿兹特克线，墨西加本质主义的事件触发后，不要处决卡罗，让其发动政变，就可以成立激社的阿兹特克帝国。\n\n基督军线：卡列斯线、极权托莱达诺线和金衫军线都会触发基督战争的决议，如果失败的话，基督军就会推翻政府。基督军可以选择与整合主义者或者基督教民主的国家行动党合作，两者有各自的国策树（如果你是通过墨西哥革命行动党路线触发基督战争的话，就无法与整合主义者合作，因为他们都被图图了，但是会另外解锁国家行动党的立宪君主线）。\n\n农民军线：大部分的非红民主线都会触发农民战争的决议，如果失败的话，农民军就会推翻政府迎回社会民主。\n\n尤卡坦叛乱：让萨帕塔死，建立民主联盟，让联盟破裂，之后不久就会触发尤卡坦独立的事件（卡列斯线或者共治线玩脱的话也会爆出尤卡坦）。独立战争不会立刻爆发，具体时间取决于墨西哥这边。尤卡坦在战争中占领墨西哥城的话，可以肢解墨西哥。"
