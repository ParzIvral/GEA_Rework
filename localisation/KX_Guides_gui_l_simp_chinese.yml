 guides.42.b: "查看新编俄罗斯军政府指南"
 guides.43.t:0 "俄罗斯指南 - 科尔尼洛夫及其继任者"
 guides.43.d:0 "科尔尼洛夫及其继任者路线：\n一、切勿宣布提前大选（稳定度低于-40%时，该决议会被锁定，但也可直接不点击相关决议）。\n二、在事件“彼得格勒工人罢工！”中选择“我们得对付这些叛匪！”\n\n民主复兴/萨文科夫-科尔尼洛夫联盟路线：\n一、科尔尼洛夫执政期间将举行大选，确保全俄民族联盟或俄罗斯人民共和党获胜，科尔尼洛夫将就任总统，舒利金或萨文科夫任部长会议主席。\n二、不要点选“无限期解散杜马”国策。\n三、不要点选“特别会议”国策。\n四、通过国策与决议处理革命动荡。\n五、科尔尼洛夫去世（1937年10月4日）后，根据其部长会议主席人选（舒利金或萨文科夫）将恢复民主制，或使萨文科夫成为元首。\n\n邓尼金路线：\n一、权力平衡需保持在“维持现状”区间或更偏左翼（共和派）。同时需通过科尔尼洛夫国策树期间的国策与决议降低革命动荡数值。\n二、邓尼金可选择恢复民主制或保持最高统治者身份，但将在对德战争结束后卸任。若战争期间丢失主要城市或未能及时完成土地改革决议，他也会提前卸任。\n\n弗兰格尔路线：\n一、权力平衡需偏右翼（君主派）。同时需通过科尔尼洛夫国策树期间的国策与决议降低革命动荡数值。\n二、若要以弗兰格尔复辟君主制，需在缙绅会议期间满足：黑色百人团不满度低于50%且君主主义者正统性高于50%。在游戏过程中务必选择一位皇位候选人。\n三、若要使弗兰格尔成为黑沙皇，需推迟选择任何皇位候选人，且弗兰格尔野心值高于10。\n四、若要使弗兰格尔保持最高统治者身份，也需推迟选择皇位候选人，但弗兰格尔野心值需低于10。\n\n德罗兹多夫斯基路线：  \n一、在科尔尼洛夫执政期间未能处理革命动荡。\n二、若要以德罗兹多夫斯基恢复君主制，需在其决议类别中倾向“立即复辟君主制”。同时需通过德罗兹多夫斯基的事件与国策处理革命动荡。\n三、若要以德罗兹多夫斯基建立军治国家，需处理革命动荡，但其决议类别需倾向“过渡政体”。"
