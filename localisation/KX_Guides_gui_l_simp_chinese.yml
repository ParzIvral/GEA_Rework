 guides.72.t:0 "联盟国指南"
 guides.72.d:0 "问：佩利的基督教党或拉福莱特的国家进步党？\n朗获得内战胜利，在完成他的政治树到最后的国策“完美民主”前保证不要过于倾向左派或是右派（注意决议里的指针），同时确保自己的党派支持度大于75，然后等待选举，选佩利或者拉福莱特。当然如果你想继续玩民主朗，那么保证至上党支持率>75且其他党派低于75\n\n问：老爹奥丹尼尔的德克萨斯联盟路线？\n答：同上，但在弹出事件民主党初选时候选人要选奥丹尼尔，当然如果你想玩马兰的民主党路线就选马兰。\n\n问：厄尔·朗或其他休伊·朗的继承者？\n答：用休伊·朗打赢内战，在点国策的过程中全力支持左派或者右派，把党内倾向逼向极左或极右，这样右派或者左派的刺客就会把朗干掉。之后会出现一连串的事件链：首先如果你想玩宾厄姆路线，那么一定要选布朗森·卡廷主持朗的葬礼。之后会弹出事件史密斯谋划刺杀。如果选择在飞机上安炸弹那么卡廷被炸死，史密斯将接管调查权。如果选择汽车炸弹，卡廷被炸死后宾厄姆会领导左派，史密斯将会出局。之后尽可能提升左派影响力就够了；如果你想玩厄尔，那么全力提升朗的支持度，并最好让厄尔主持葬礼。如果你想玩威权厄尔，那么在朗被刺杀前要保证至上党内部倾向于右派。如果你想玩左派厄尔则相反。如果你想玩库林格神父的路线，选择他主持葬礼并尽可能提升他的影响力。史密斯同理，或者按照上面说的选择卡廷主持葬礼，用飞机炸弹把卡廷除掉之后尽可能提升史密斯影响力就行。如果你想玩民主派，那么让拉塞尔·朗主持葬礼并打压所有派别。所有的影响力小于等于60时，在“党内会议”这个国策点完后弹出的事件中就会让拉塞尔·朗担任临时总统。在完成中间派第一个国策后就会重新选举的相关事件。你可以从四位中间派中挑选新总统，也可以转到别的党派的路线。\nPS：在特定事件中选择和谁合作之后，在“党内会议”这个国策点完后弹出的事件中就可以有两个选择。例如史密斯与库林格神父合作，那么在最后你可以选择进入库林格线或是史密斯线。另外，在让朗被刺杀前请务必把重建的debuff消掉，否则朗死了重建国策就点不了了。"
