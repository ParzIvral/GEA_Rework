 guides.125.t: "阿布哈兹指南"
 guides.125.d: "问：阿布哈兹的隐藏路线？\n答：走社民线，国策“民族文化自治”后的事件中选择不允许自治，然后就玩去吧！"
 guides.126.t:0 "芬兰指南"
 guides.126.d:0 "问：拉普阿运动？\n答：任命马尔姆贝里为白卫军总长，派警察去洛赫亚，坚持《王国保护法》，镇压洛赫亚起义。\n\n问：民主线/曼纳海姆？\n答：任命曼纳海姆为白卫军总长，沿着拉普阿运动的指南继续走下去。\n要玩人民民主联盟（社民、工团）的话，就在提前大选中选择市场自由主义（新路线），然后等到曼纳海姆放弃权力之后的大选就可以了。\n\n问：红线？\n答：任命西赫沃为白卫军总长，沿着拉普阿运动的指南继续走下去。镇压起义后，不要让保罗·冯·格里希干预革命。\n\n问：如何建立马蒂君主制或为曼纳海姆拥立新君？\n答：按曼纳海姆路线操作，通过国策“新国家宪法”触发“王位空悬”事件并建立君主制。若要拥立马蒂，可在枢密院摄政委员会事件中选择拖延策略，随后在后续事件中选立马蒂为国王即可解锁该路线。\n\n问：卡累利阿？\n答：干预俄罗斯内战，资助叛军。\n"
 guides.126.a:0 "哇哦"
 guides.127.t:0 "西藏指南"
 guides.127.d:0 "问：尼古拉斯·洛里奇？\n\n答：开局时的事件链，把夺多僧兵派往尼泊尔的边境（需要尼泊尔拒绝关闭边境），再让他们阻截革命党民兵。革命党政变后，完成国策“班禅喇嘛归来”。等四个月触发大选，其中一个选项就是尼古拉斯·洛里奇的神圣联盟党。\n\n如果你选择追随列宁的路线，那么洛里奇可以通过事件转极权、工团、激社和社民，而放弃列宁路线则可以转威民、家独和民粹。如果转了民粹又没有限制秘传民族主义者的权力，那么伊格纳茨·特雷比奇-林肯、卡尔·马里亚·威利古特、恩斯特·沙费尔、汉斯·F·K·金特就会政变。（后续版本他们会有专属国策）\n\n洛里奇的西藏可以通过事件改名香巴拉、香格里拉、神圣联盟和许珀耳玻瑞亚（极权、民粹专属），不过，宣战理由/宣称/核心和最终可成立国家只与走的国策有关。\n\n如果达赖喇嘛成了国家领导人，那么等他到18岁成年会获得新的头像。即使不是领导人，他成年后也会触发一事件，可以选择让他上台。"
 guides.127.a:0 "哇哦"
 guides.128.t:0 "亚利桑那/纳瓦霍指南"
 guides.128.d:0 "问：如何玩到亚利桑那和纳瓦霍？\n\n答：玩墨西哥，随便走哪条线都行。点收复失地的国策，打下美国西南的失地，等盎撒人叛乱（在所有对待美国人的事件中选择苛刻的选项，让亚利桑那的抵抗度高于80%），叛乱开始后就能切换到亚利桑那。亚利桑那有戈德华特/琼斯的民主线、戈德华特的威权线（要求戈德华特拒绝选举）、游骑兵线（走民主线，拒绝游骑兵的特权）。\n\n所有路线都能触发一事件，选择是否在矿物与水资源权利一事上满足纳瓦霍人的要求。拒绝的话，他们就会起义，然后就可以去玩纳瓦霍了。纳瓦霍有自己的国策树，可以选切·道奇或者艾拉·海耶斯。\n\n如果嫌麻烦，可以直接用控制台调出调试决议来刷出纳瓦霍和亚利桑那，不过这样可能会导致游戏错误。\n\n问：美利坚民族联合？\n\n答：玩纳瓦霍（详情见上），随便哪条线都行。点国策，等美国相关的事件触发，选择夺取美利坚的衣钵，然后就可以放出来民族联合或者直接换成这个国家。可以选本·赖费尔（社保辉格）、乔·梅迪辛·克罗（威民华盛顿）、J·B·米拉姆（家独企业国度）、查尔斯·柯蒂斯（社自进步民主）、托马斯·道奇（市自自由市场）、安妮·道奇（市自人性资本主义）、艾拉·海耶斯（社民家长制社会主义）、奥斯卡·豪（激社乌托邦技官）、齐卡拉萨（激社激进进步主义）、埃玛·特纳尤卡（农业工团主义）、阿奇·菲尼（马里亚特吉主义）、埃尔伍德·唐纳（民粹军团主义，前提是阿拉斯加不存在）。\n\n问：安人亚利桑那？\n\n答：玩亚利桑那（详情见上），先点国策，等待比斯比放逐的事件，让戈德华特延长紧急状态，走向威权独裁。之后会出一事件，说社会主义者不满加剧，无视他们，然后下一个事件会说他们正在囤积枪支，同样无视他们，之后就会被政变。点完红线第一个国策后可以选领导人，所有人都能核心墨西哥和美国（社民线最后成立的国家取决于国策中的选择）。特纳尤卡的领袖事件在打下德克萨斯后触发，马贡则是在打下下加利福尼亚后触发。所有路线都可以在1950年选择塞萨尔·查韦斯作海军指挥官或领导人，都可以加第三国际，也可以通过决议加变红的墨西哥和美国相关的tag，如美团、新英格兰、纽约、德克萨斯、阿拉斯加等。"
