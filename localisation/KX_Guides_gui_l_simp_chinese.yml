 guides.38.t:0 "太平洋国指南"
 guides.38.d:0 "问：灵性论线？\n答：1.选赫斯特上台。\n    2.给予灵性论者支持，无视其与日本的关系。\n    3.进行国策“调查共和党”。\n    4.派遣联邦警察且让阿诺德将军留在首都。\n    5.军队政变后让灵性论者发动反政变。\n（博丹若不下台，1943年5~7月间会死于“自然原因”，由L·罗恩·哈伯德接任）\n\n问：灵性论亲日线？\n答：按上述步骤进入灵性论线，完成国策“扫除赤患”，触发L·罗恩·哈伯德要求小心谨慎的事件，如果听从其建议，就进入常规的灵性论线，不听就进入亲日线。马克斯·索恩伯格、拉尔夫·汤森或野村吉三郎上台后太平洋国可以加入共荣圈，日本可以帮你打内战。\n\n问：迪士尼的独裁太平洋国？\n答：选择增加太平洋国分离主义的选项（标红的那些）。\n选迪士尼，让迪士尼不干涉，让迪士尼活下来，让迪士尼掌权。\n\n问：休斯的独裁太平洋国？\n答：选择增加太平洋国分离主义的选项（标红的那些）。\n选迪士尼，让迪士尼不干涉，让迪士尼被射杀，让休斯掌权。如果玩休斯那么在“霍华德·休斯的怪癖”事件中选择第一个选项，玩理事会就选第二个。\n\n问：诺顿的太平洋国？\n答：选择增加太平洋国分离主义的选项（标红的那些）。\n选迪士尼。\n让迪士尼不干涉。\n让阿诺德在混乱后干涉。\n邀请诺顿派，或者让他们攻占首都。\n\n问：阿诺德/马歇尔的太平洋国？\n答：阿诺德上台有三种方式：推翻灵性论者、在太平洋国独立的事件链中选择、被走海军线的合众国傀儡。\n\n问：相矶藤雄的后续路线？\n答：如果不希望相矶藤雄被日本推翻，那么在确保东京态度>6的情况下，点完能点的所有国策并把日本军官的态度降低到-3以下,社会反日情绪<=2，同时确保军队影响力>8,这样就会触发事件链转到左边国策。如果想走影武者，那么确保上述条件的同时确保军队影响力<=8,或者使东京态度<3,日本军官的态度降低到-3以下,再把亲日派影响力确保<=4。如果想当日本傀儡，那么就按照进入影武者路线的第二种方法，但要确保亲日派影响力>4。\n另附注：如果卡线请反馈"
