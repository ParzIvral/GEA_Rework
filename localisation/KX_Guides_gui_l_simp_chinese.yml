 guides.41.t:0 "希腊指南"
 guides.41.d:0 "问：怎样如闪电般归来？\n\n答：打赢巴尔干战争，成为一个社会保守主义，威权民主主义，家长制独裁或者民粹政府（当然，希腊本身没有民粹线，所以你只能靠控制台变身民粹，傀儡不能精罗就不用我多说了吧），然后确保君主制公投成功，或者由梅塔克萨斯（和梅塔克萨斯死后接班的科里奇斯）作为希腊首脑。点君主制公投的国策，不要企图操纵选举，使亚历山大国王或者乔治国王上台，又或者操纵选举使选举偏向共和制然后被保王派抓个现行，使得梅塔克萨斯，科里奇斯或者帕夫洛斯上台。然后如闪电般归来吧！\n\n译注：趁开罗轴心跟土鸡打的时候背刺有概率导致白和，你打了半天白打了，建议先准备个instant_wargoal，如果白和了就再 宣 一 遍。\n\n问：怎样建立激社罗马帝国？\n\n答：一路完成罗马帝国国策到分支前的“缓解君堡压力”后等待事件安纳托利亚骚动，射杀抗议者，让激社人趁机起事，推翻政府。"
 guides.41.a:0 "哇哦"
 guides.42.t:0 "俄罗斯指南"
 guides.42.d:0 "问：如何游玩俄罗斯民主选举党派路线（从激进社会主义到国家民粹主义）？\n答：选择让克伦斯基死掉，在决议里宣布提前选举（你的稳定度需要高于-40才能这样做），然后你将解锁竞选决议，增加你想要的政党的支持率（注意政党联盟）。在黑色星期一后采用杜马计划增加中/左派政党支持率，而参议院计划增加保守派政党支持率，最终你将赢得选举。全俄民族联盟和立宪民主党右派可以恢复君主制。罗曼诺夫的全俄民族联盟是威民，尤苏波夫的是社保。\n\n问：协作线、戈尔古洛夫线、阿巴库莫夫线？\n答：进入协作线有两种方法。\n - 走萨文科夫路线，释放戈尔古洛夫，在他政变后，选择让协作主义者获胜（也可以选戈尔古洛夫和阿巴库莫夫）。\n - 在1936年选举除萨文科夫之外的任何政党，如果人民共和党支持度在一段时间内低于10，该党将解散，协作主义者将取而代之，他们将参加1941年的选举。\n\n问：如何解锁欧亚联盟国策树？\n答：选社会主义政党，让欧亚党人做总统。在参议院杜马冲突中站总统一边，赢得权力平衡。之后，总统就会解散杜马，解锁欧亚联盟的国策树。"
