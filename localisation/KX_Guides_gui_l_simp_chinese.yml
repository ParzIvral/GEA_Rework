 guides.146.t:0 "日本指南"
 guides.146.d:0 "问：选举改革？\n答：强行通过《国家安全保障法》。若政友会在1936年选举中保住了多数地位，则天皇一定会支持他们，否则在遭到天皇拒绝的时候选择“天皇陛下的行为过线了！”\n若政友会失去了多数地位，则所有党派可以暂时团结在举国一致内阁下，否则会举行提前选举，可以选择政友会或民政党。\n日后的选举还可以选择国民同盟或社会大众党。\n\n问：统制派夺权？\n答：若政友会在1936年选举失去了多数地位，并且强行通过了《国家安全保障法》，陆军就可以发动政变。天皇发表关于《国家安全保障法》的讲话时，选择反对内阁会导致军事政变，陆军统制派就会夺权。\n\n问：皇道派政变？\n答：若《国家安全保障法》未能通过，陆军统制派就会政变夺权。不久，陆军中的激进分子会发起反政变，导致陆军皇道派上台。"
 guides.146.a:0 "哇哦"
 guides.147.t: "巴斯克共和国指南"
 guides.147.d:0 "问：民主线？\n答：取缔卡洛斯传统主义团契的事件中，直接派出人民卫队镇压或者同其谈判，叛乱就会终结，共和国就会稳定下来。只要社民派或家独派在第一次选举中当选，第二次选举就能选工团民主派。社自派的纳瓦拉自治共和党无论如何都可选。若要选择卡洛斯民主派，需在取缔传统主义团契事件中提醒其效忠对象，或在后续事件中与他们谈判（前提是此前未采取行动），随后在第一次选举中选择激社派、社民派或社保派。\n\n问：海梅·德尔·布尔戈的卡洛斯线？\n答：不要管纳瓦拉的卡洛斯派操练，然后在后续事件中派出军队，不要让安人拿下毕尔巴鄂。\n\n问：无政府线？\n答：同卡洛斯线，最后让无政府派拿下毕尔巴鄂，后续事件不要让雅各宾派胜利。\n\n问：雅各宾线？\n答：同无政府线，最后把权力让渡给雅各宾派。具体要选民族共产派还是雅各宾派，只需在“红色主席？”国策引发的事件中，选择谁赢得权力斗争即可。"
 guides.148.t: "西班牙王国指南"
 guides.148.d: "问：民主/绝对君主制王国线？\n答：初始危机中，通过权力平衡和小游戏来避免内战，或直接去打内战。在国家稳定后，完成国策“$SPR_question_of_the_monarchy$”后，会触发“加的斯，抑或天主教国王？”事件，可以民主、绝对君主制二选一（若此前选择与左翼结盟，便只可选择走民主线）。\n译者注：根据此前在完成“加冕人选问题”国策后触发的“波旁家族的命运”事件中传位人选的不同，绝对君主制线可选的政党亦有不同，若想游玩西班牙行动/全国君主主义联盟/融合党，请选择“胡安亲王将加冕为胡安三世”。若想游玩西班牙复兴/西班牙民族党/西班牙农民党，请选择“海梅亲王将加冕为海梅一世”。\n\n要上工团党的话，在权力平衡中同左翼结盟，事件“$sprd.104.t$”中不要取缔工人社会党和左翼党，等到第二次大选就可以了。\n\n要上民族党的话，在权力平衡中同右翼结盟，等到第二次大选就可以了。走绝对君主制线的话，事件“$sprd.1166.t$”过后就可以解锁全部路线了。\n\n问：西班牙大乱斗（巴斯克、加泰罗尼亚、加利西亚、里夫）？\n答：走绝对君主制线，避免内战，或者点稳定线的中段国策，实施戒严，等上一会分离势力会四处作乱，这时就可以切换到其他国家了。截止目前，只有巴斯克有游玩内容。\n\n神罗路线：在“波旁家族的命运”事件中传位给胡安，走专制线，在“新王国，新政府”中选择“西班牙行动将为僵化的西班牙右翼带来新理念！”，随后走西班牙行动的国策树，在完成“西班牙精神的天然优越性”国策后跳出的“巩固党的路线”事件中选择“佩马丁理应领导欧洲迈入光辉的天主教时代”，而后等待“超国家圣战？”事件在150天后触发，再在其中选择“西班牙之钢铁将用以锻造新的神圣欧洲帝国！”\n\n同时吃法意两国核心的方法：在重返世界舞台国策下的国策树中，按“宣称波旁王位→我们的西西里兄弟→波旁王冠领地的命运”顺序完成国策，便可同时获得法意两国的核心。\n\n理论上最大核心+宣称的路线，按上文的神罗路线走，正常点政治线，在完成“波旁王朝之无敌意志”后，等待“前往巴塞罗那的邀请”事件触发，选择出席，四天后国王会被刺杀，在“摄政激辩”事件中选择“我们选海梅一世国王”，然后再按上文同时吃法意两国核心的方法走。"
 guides.149.t: "特克兰指南"
 guides.149.d: "问：君主线、民主线、社会主义线？\n\n答：想走哪条就在开局国策树里按提示把支持度拉上去。"
 guides.150.t: "阿塞拜疆指南"
 guides.150.d: "问：阿塞拜疆的各条线路？\n\n答：阿塞拜疆的路线取决于1937年的大选，支持率最高的政党将上台执政。\n\n可以通过事件和国策来提高指定政党的支持率。大选最后的赢家可以在“拯救国家”决议组中看到。\n\n平等党要想胜出，支持率就必须高于其最大对手。\n\n其他政党的话，就让平等党最大反对派的支持率高于前者。"
 guides.151.t:0 "瑞典指南"
 guides.151.d:0 "问：民主线？\n答：1936年9月的大选，选社民、市自、社保。1940年大选后会解锁第二届国策（只有社民或市自才能选农民联盟）。所有民主线都可以选择加入现有阵营或组建阵营，以及成立斯堪的纳维亚。此外，社保是唯一能通过“$SWE_FOP_realm_of_our_own$”国策复辟帝国并仍能邀请其他国家加入其阵营的路线。\n\n问：社会主义/革命线？\n答：1936年9月的大选，选社民工党和社民左翼党的联盟，然后在事件“$swerev.3.t$”中选“起来，工人们！你们的斗争已结出硕果！”。走社民左翼党线就在工人议会中选他们。\n走无政府工团线就在事件“$swerev.8.t$”中选“奥托森-延森的无政府派赢得了辩论！”，然后在工人议会中选工团人。\n走集权工团路线就在事件“$swerev.8.t$”中选“塞韦林说服工会实行集权！”。\n\n问：国家工团/共产/极权线？\n答：事件“$swerev.9.t$”中选择“求同存异更重要，而非党同伐异”，完成国策“$SWE_national_syndicalism_empower$”后会触发清洗事件。走弗吕格线，则在“瑞典共的命运”中选择“先发制人，清洗瑞典共”，在“社会主义联盟垮台”中选择“清洗林霍尔姆，解散社会主义联盟”。\n走瑞典共线，则在上述两个事件中选“暂且容忍他们”和“林霍尔姆算不上什么威胁，别管他了”。\n走斯文·林霍尔姆线，只需要在“瑞典共的命运”中选择“先发制人，清洗瑞典共”。要让胡戈·西伦上台，需要在“工人议会中的少数派”事件中提拔西伦。\n\n问：反革命线？\n答：走社会主义线，事件“$swerev.3.t$”中选第二个。若要恢复选举制度，需要任命埃伦斯韦德为全国领袖，并在$swereact.65.t$事件中选择“军队已尽职责，恢复议会”。\n\n问：更反动的线？\n答：走埃尔莫·林霍尔姆线，需要选择阿希巴尔德·道格拉斯为全国领袖，再拒绝斯文·赫定的要求并复辟君主制，在$swereact.99.t$中选择“听听联盟的条件吧”，在“民族活力论提案”事件中选择“就把那个位置给林霍尔姆吧”。\n走斯文·赫定和埃里克·冯·罗森线，需要在“$swereact.8.t$”中接受他们的要求，然后拒绝复辟君主制。再在“$swereact.17.t$”事件中接受赫定的提议。\n走曼赫姆协会线，需要先按赫定线走，但在“$swereact.17.t$”中再次拒绝他的要求，曼赫姆协会随后便会发动政变。\n译注：若想游玩斯文·赫定和曼赫姆协会路线，先前便不能进入林霍尔姆路线。\n\n译注：瑞共线的林德罗特泛欧/西伦重建苏联的决议都需要在外交国策树中选择“北欧国际”，方才会在统一北欧三国，且在完成“北欧联盟”与“列宁主义的北欧堡垒”后出现。（弗吕格/斯文·林霍尔姆线的泛欧也同理）"
 guides.440.d: "\n\n青年俄罗斯联盟/旺夏茨基：\n一、使权力天平达到50%。在“无主政府”事件中选择“代表大会必须承担起国家的责任”。\n二、在“阿塔曼行动”事件中选择“尝试与谢苗诺夫进行谈判，拖延其推进”。\n三、在“与阿塔曼谈判”事件中选择“青年俄罗斯联盟利用混乱夺取了权力”。\n四、旺夏茨基线，在符拉迪沃斯托克会议中同民族派结盟，并完成后续的相关国策。卡津别克去世后，让旺夏茨基接任元首。\n五、社民线，不要点国策“社会君主制”，计时结束后社民派就会政变。\n\n捷克斯洛伐克军团：\n一、走人民革命军、青年俄罗斯联盟社民线或佩佩利亚耶夫线。\n二、在事件中解散捷克斯洛伐克军团。\n三、捷克斯洛伐克军团阻拦列车的事件，选第二个。\n四、捷克斯洛伐克军团政变后可以选择领导人，拉多拉·盖达有专属流亡捷克斯洛伐克线，所有人都可以走泛斯拉夫线。\n\n日本傀儡：\n一、不要通过事件或各路线国策消除日本影响力。\n二、不要选择人民革命军或谢苗诺夫阿塔曼路线。\n三、将社会保守主义支持率提升至35%以上。\n替代方案：若在游戏规则中选择了该路线，则可在高尔察克死亡时通过日本施压来改变政府。\n\n独立的雅库特/布里亚特：\n一、使雅库茨克或上乌金斯克地区的抵抗度超过40%。可通过“少数民族地区戒严令”国策来提高抵抗度。"
 guides.152.t:0 "罗马尼亚指南"
 guides.152.d:0 "问：尼古拉的铁卫团？\n答：“白鹰运动的崛起”事件中处决斯特雷斯库，逼卡罗尔退位，挫败军方的政变。\n\n问：卡罗尔的民族复兴阵线？\n答：“白鹰运动的崛起”事件中放过斯特雷斯库，解散铁卫团内阁，暗杀科德里亚努，“睚眦必报”事件中增强警力。\n\n问：米哈伊的农民党左中右翼、国家自由党、铁卫团？\n答：“白鹰运动的崛起”事件中放过斯特雷斯库，解散铁卫团内阁，暗杀科德里亚努，“睚眦必报”事件选马林内斯库，米哈伊上台后让军方组建临时军政府。\n注：大天使弥哈伊尔军团和皆为祖国这两党只有第一次大选可选。\n\n问：坎塔库济诺的铁卫团？\n答：同上，尼古拉上台后任命坎塔库济诺为首相。\n\n说明：进线方法不唯一，以上仅为其中之一。"
 guides.153.t: "雅库特指南"
 guides.153.d: "问：社民、社自、社保、民粹选举线？\n答：打赢独立战争，不屈从于西伯利亚军。\n\n问：红线？\n答：选举结束后不要帮助贫苦民众。\n\n问：斯莫林军政府？\n答：独立战争时别管对面，之后的事件会强迫下台，斯莫林上台。"
 guides.42.c: "查看新编俄罗斯君主制复辟指南"
 guides.42.e: "查看新编红俄指南"
 guides.430.t: "俄罗斯指南 - 君主制"
 guides.430.d: "复辟俄罗斯帝国：\n第一途径：\n一、以右翼立宪民主党或全俄民族联盟（市场自由主义或社会保守主义）赢得选举。\n二、在完成初始国策后杜马解锁君主制公投决议时，通过杜马进行君主制公投。\n三、通过执行相应国策和决议提升恢复君主制的成功率。亦可选择操纵公投。\n\n第二途径：\n一、通过弗兰格尔或德罗兹多夫斯基复辟君主制（参阅“俄罗斯指南-科尔尼洛夫及其继任者”指南）\n\n俄罗斯帝国-黑色百人团/教权派路线\n一、通过弗兰格尔复辟绝对君主制。需使黑色百人团不满度高于50%，让缙绅会议未能成功复辟君主制。\n二、复辟绝对君主制时，可选择任命黑色百人团部长会议主席（马尔科夫）或牧首。"
