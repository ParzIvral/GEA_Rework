 guides.15.d:0 "你想玩哪个国家？"
 guides.15.a:0 "阜姆"
 guides.15.b:0 "利本费尔斯"
 guides.16.t:0 "奥地利帝国指南"
 guides.16.d:0 "问：我该怎么玩利本费尔斯雅利安秘学统一党的民粹奥地利？\n答：选举选社会民主工党，禁止雅利安党参加选举，不解封雅利安党，然后他们就会武装夺权。（战狂玩家专属）"
 guides.16.a:0 "哇哦"
 guides.16.b:0 "返回"
 guides.17.t:0 "奥地利帝国指南"
 guides.17.d:0 "问：怎么玩霍尔蒂的阜姆海盗国？\n\n答：游玩奥地利，等霍尔蒂要求去伊利里亚的事件。让他去。然后等怀疑海盗的事件。允许海军在霍尔蒂不在的时候偷袭海盗。然后触发一系列事件，最后选择游玩阜姆即可。"
 guides.17.a:0 "哇哦"
 guides.17.b:0 "返回"
 guides.18.t:0 "匈牙利指南"
 guides.18.d:0 "问：我能玩匈牙利的什么路线？\n答：为了保证匈牙利独立，你需要在开局设定里面设定奥匈谈判破裂，挑起内战。\n1.民主匈牙利 - 社会保守主义\n----抵制1937奥匈协定，选举拜特伦·伊什特万。\n2.民主匈牙利 - 社会自由主义\n----抵制1937奥匈协定，选举米哈伊·卡罗尔。\n3.极权匈牙利\n----抵制1937奥匈协定。选举社民的阿尔帕德·萨卡希奇。一直点国策树，等着共产主义者把他赶走。\n----完成几个共产线国策树，然后反动派就会进攻布达佩斯，别逃离首都。\n4.塞格德匈牙利\n----抵制1937奥匈协定，先走极权匈牙利的路线，完成几个共产主义的国策树，然后反动派就会进攻布达佩斯。\n----让共产党人逃离首都。\n----让炸弹在马提亚教堂爆炸。\n5.君主制匈牙利\n----抵制1937奥匈协定。先走极权匈牙利的路线，然后完成几个共产主义的国策树，然后反动派就会进攻布达佩斯。\n----让共产党人逃跑。\n----不要让炸弹在马提亚教堂爆炸。"
 guides.18.a:0 "哇哦"
 guides.18.b:0 "返回"
 guides.19.t:0 "伊利里亚指南"
 guides.19.d:0 "你想玩哪条线？"
 guides.19.a:0 "铁托"
 guides.19.b:0 "帕韦利奇"
 guides.20.t:0 "伊利里亚指南"
 guides.20.d:0 "问：怎么让铁托在伊利里亚掌权？\n\n答：开局自定义游戏规则设定斯洛文尼亚危机必定爆发，完成危机国策树，确保共和制与左翼执政，然后获得独立战争胜利，然后选举，铁托会作为社会民主主义的候选人出现，再过一段时间会出事件允许你选择保持社会民主主义还是变为激进社会主义。"
 guides.20.a:0 "哇哦"
 guides.20.b:0 "返回"
 guides.21.t:0 "伊利里亚指南"
 guides.21.d:0 "问：怎么玩帕韦利奇的民粹伊利里亚？\n\n答：开局规则设定斯洛文尼亚危机必定爆发，完成危机国策树，完成右翼国策树来终止民主制，然后打赢独立战争。赢了之后注意选举事件，然后会触发一个叫“对莫斯塔尔的袭击”的事件，然后选择会触发“仁慈”的伊利里亚军事件的选项，然后拒绝给与自治权。波斯尼亚人将会起义而总统会被干掉，打败起义军就能走帕韦利奇国策树了。"
 guides.21.a:0 "哇哦"
 guides.21.b:0 "返回"
 guides.22.t:0 "法兰西公社指南"
 guides.22.d:0 "问：雅各宾/索雷尔路线？\n\n答：1936选举选就完事了。\n\n问：马赫诺/黑军路线？\n\n答：选索雷尔派，完成它专属的国策树。在瓦卢瓦被刺杀后的事件里选择让索雷尔派内斗，不达成妥协，一路帮助安人。然后触发进军巴黎事件，选择第一个选项。\n\n问：甘末林路线？\n\n答：雅各宾派上台，留任多列士，废除劳总联，然后在审讯事件中选择放了甘末林。\n\n问：戴亚的新社会主义路线？\n\n答：照常走比卡尔线，瓦卢瓦死后不要让马赫诺发动政变，然后在索雷尔派委员会选举的事件中让戴亚一锅端掉议会。"
 guides.22.a:0 "哇哦"
 guides.23.t:0 "不列颠联盟指南"
 guides.23.d:0 "你想玩哪条线？"
 guides.23.a:0 "霍巴特/莫斯利后续可成立国家"
 guides.23.b:0 "苏格兰/威尔士/劳伦斯"
 guides.24.t:0 "不列颠联盟指南"
 guides.24.d:0 "要想霍巴特政变，选举莫斯利，等待触发一个有关军队中的反莫斯利活动的事件，选择忽视并继续完成国策树到革命，宣布戒严，在事件里选择让霍巴特胜利。之后你可以选择重建联合王国，或者开启霍巴特国策树。\n\n艾德礼：在“真正的流亡者归来”事件链期间，与自由派合作。艾德礼（社民）可以成立社会主义版的帝国联邦，即人民联邦。若工党于第一次选举中分裂，则可以在第二次选举时根据是否重回第三国际转向激社或社自。\n军团不列颠：和民族主义团队合作，屈服于军团。\n右翼俱乐部的阿奇博尔德·拉姆齐：和民族主义团队合作，不屈服于军团，接受右翼俱乐部的帮助。\n霍巴特自己的路线：和民族主义团队合作，不屈服于军团，不接受右翼俱乐部的帮助。（之后你可以在大量候选人之中选出一位国王，或让霍巴特成为新克伦威尔）\n\n问：莫斯利的后续可成立国家？\n\n答：正常玩莫斯利线，点完所有国策，最后会触发一事件，可以选举维持孤立主义、与第三国际肩并肩，也可以选择统一全欧和北非，或是征服帝国联邦的全部故土。\n\n如果选择成立欧洲社会联盟（需要征服东至乌拉尔山的整个欧洲大陆，以及北非的利比亚、埃及和流亡法国领土），则会触发第二个事件，可以选择就此停手，或者成立疆域囊括非洲其余所有地区的准则派非洲保护领傀儡。\n\n如果选择成立准则联邦（需要征服爱尔兰、加拿大、美国、印度、澳大拉西亚、西印度和南非），也会触发第二个事件，可以选择就此停手，或者征服剩余的英国领土，如也门、英属非洲、伯利兹等。"
 guides.24.a:0 "哇哦"
 guides.24.b:0 "返回"
 guides.25.t:0 "不列颠联盟指南"
 guides.25.d:0 "答：让劳伦斯发动政变并且让苏格兰和威尔士独立。选举莫斯利并完成他第一个国策，30天左右之后会触发一个有关军队中的反莫斯利活动的事件。选择处理这群人并继续完成国策树。在事件“紧急事态”中，选择“执行行动！”。在关于主席和总书记的事件中，合并这两个职位。完成国策“革命”然后宣布戒严。如果戒严令生效，你会看到一个说极权派获胜的事件，然后威尔士纵火犯和苏格兰恐怖分子会出现，很快内战就会爆发。内战事件触发时，你可以选择切换到苏格兰或者威尔士。如果你想游玩劳伦斯，那就继续游玩莫斯利，如果在限定时间内你没有打爆苏格兰和威尔士或者被苏格兰和威尔士打爆了，那么劳伦斯就会政变并解锁他自己的国策树。"
 guides.25.a:0 "哇哦"
 guides.25.b:0 "返回"
 guides.26.t:0 "尤卡坦指南"
 guides.26.d:0 "玛雅：同玛雅派系或者玛雅与红衫军两方合作，战争结束后，让其政变成功。\n民主：不和任何一方合作，或者仅与一方合作并令其政变失败，战后可以选择恢复民主。\n红衫军：同红衫军派系或者玛雅与红衫军两方合作，战争结束后，让其政变成功。"
 guides.26.a:0 "哇哦"
 guides.27.t:0 "意大利社会主义共和国指南"
 guides.27.d:0 "问：意社的各条线路？\n\n答：等到36年4月举行第四次大会，会上的三个问题选择不同的派系，会让选举进入僵局，触发进军都灵的事件，事件中可以在加里波第、工团激社联盟中进行选择。如果没有进入僵局的话，那获得多数的党派胜出（共产线和工团线在事件中共用同一个选项）。要进入未来主义线、最高纲领线和改良国家工团线的话，就在第五次大会中选极权（大会开始的时候自身无需是极权政府），之后再让其胜出（注意：目前这几条路线都属于极权主义，后续会进行变动）。同理适用于第五次大会前未登场的工团主义与社会民主主义阵营人物，包括阿尔曼多·博尔吉、埃里科·马拉泰斯塔、卢多维科·达拉戈纳及阿尔真蒂纳·阿尔托贝利。"
 guides.27.a:0 "哇哦"
 guides.28.t:0 "意大利共和国指南"
 guides.28.d:0 "（注意：每条路线不只一种进入方法，选举后的事件链只是最简单的一种。）\n\n问：民主线？\n\n答：1936年11月的选举除意大利民族主义协会外随便选，封禁民族主义协会，让信任投票成功，结束事件链。\n\n问：联邦线？\n\n答：1936年11月的选举除意大利民族主义协会外随便选，封禁民族主义协会，让信任投票失败，加冕国王。\n\n问：解散共和国（可以玩威尼斯和伦巴第）？\n\n答：1936年11月的选举除意大利民族主义协会外随便选，封禁民族主义协会，让信任投票失败，解散国家，之后想玩哪个选哪个。\n\n问：民族主义协会线？\n\n答：1936年11月的选举选意大利民族主义协会。"
 guides.28.a:0 "哇哦"
 guides.29.t:0 "两西西里指南"
 guides.29.d:0 "问：立宪线和专制线？\n\n答：1937年大选，选任意民主党派进入立宪线（每个党派都有三个首相候选人，每人都有着各自的意识形态），选南方行动进入专制线，专制线可以通过事件转威民农业主义、家独新波旁主义或保持整合民粹主义。\n\n问：埃佛拉？\n\n答：开局后会触发埃佛拉和军团的事件，选加强他们力量的选项。在事件链的最后，国王出逃，军团就会夺权。\n\n问：黑手党/法西斯/新圣信军？\n\n答：让埃佛拉上台，点国策“反教权主义”，在事件“西西里抵抗”中选择“派遣军团不惜一切代价夺取西西里！”。军团战败后，就可以选择黑手党、法西斯和新圣信军了。"
 guides.29.a:0 "哇哦"
 guides.30.t:0 "联合工团指南"
 guides.30.d:0 "你想玩哪条线？"
 guides.30.a:0 "联合工团主要派系"
 guides.30.b:0 "卡彭及其继任者"
 guides.30.c:0 "洛夫斯通与斯科特以及勒布"
 guides.31.t:0 "联合工团指南"
 guides.31.d:0 "问：联合工团的各派系？\n\n答：工团派、白劳德和伯纳姆：在所有事件中选择增加工团主义和极权主义支持率的选项，限制福斯特派权力。（集权派也能让白劳德和伯纳姆上台）\n\n福斯特：在所有事件中选择增加工团主义支持率的选项，增加福斯特影响力，战后选举中选福斯特和工会团结联盟。\n\n社会爱国派（社民/激社）：在所有事件中选择增加社会爱国派支持率的选项，劳联派将掌权。内战结束后可以决定具体掌权派系（白劳德和伯纳姆也能上台）\n\n伯纳姆、福斯特、白劳德继承人：点度假决议，选择不去度假，之后事件选继承人上台。\n\n詹姆斯·P·坎农的托洛茨基主义世界革命：1940年世界产联选举、福斯特或伯纳姆的继承人事件中选他上台。\n\n巴特勒的社会爱国派政变：福斯特上台后重组军队的事件选不要重组，也不要点国策“清洗反动派”，四个月后巴特勒就会政变。"
 guides.31.a:0 "哇哦"
 guides.31.b:0 "返回"
 guides.32.t:0 "联合工团指南"
 guides.32.d:0 "问：卡彭的联合工团？\n\n答：内战期间，接受卡彭的支援。战时不要换海伍德，战后选举极权人上台。然后选择卡彭做国家元首。正常来说，卡彭会在47年的1月去世，如果想让他提前去世，就在点完国策树（包括最底下的四个国策）后问要不要退休的事件中选择不要。\n\n问：卡彭的继承人？\n\n答：正常情况下，卡彭会在1947年的1月份死于梅毒，如果想让他提前去世，就点完国策树。在点的过程中卡彭会随着事件的触发逐渐发疯，点完后，会出一事件，问要不要让卡彭退休。同意的话，卡彭依旧会是国家的领导人，只是不再掌权，然后还是会在正常的死亡时间去世。拒绝的话，卡彭就会被刺杀，提前解锁继承人路线。\n\n卡彭去世后就可以走继承人路线了，然后在卢西亚诺、迪林杰、尼蒂、霍法、邦妮和克莱德中选一个。\n\n要选托里奥，先选卢西亚诺，再让托里奥上台。\n\n要选里卡，先选尼蒂，然后再让里卡上台，并引出新人物“犹太佬”韦斯。继续走里卡线，韦斯会政变，然后勒内·贝尔伯努瓦会登场。走邦妮和克莱德线，然后贝尔伯努瓦又会政变。\n\n卡彭的儿子阿尔伯特·弗朗西斯·卡彭和卡彭的哥哥拉尔夫·卡彭是尼蒂线和迪林杰线的可选领导人。\n\n“美男子”弗洛伊德是迪林杰线、尼蒂线、霍法线、西维线、邦妮和克莱德线的可选领导人。\n\n西维可以征服世界上所有的海盗地区，例如南海、越南、北非、马达加斯加、马来群岛、加勒比等。\n\n贝尔伯努瓦是第三国际派，但也能征服美洲。\n\n其余所有人都能征服整个美洲、加勒比海和菲律宾，也就是所谓的“美利坚帝国”的全部领土。\n\n所有人都能征服黑手党的意大利老家。\n\n所有人都能创建老大轴心，不过贝尔伯努瓦会自动加入第三国际，霍法则可以选择加入第三国际、布哈林的俄国或者赫鲁晓夫的乌克兰。"
 guides.33.t:0 "联合工团指南"
 guides.33.d:0 "问：洛夫斯通？\n\n答：先走伯纳姆线（详见第一部分的指南），点度假的决议，选洛夫斯通当继承人，或完成“大陆社会主义社团”的国策后，等个大概三个月会弹出一个关于洛夫斯通的事件。选择不增加监控他就会政变。若选择增加监控，你也可以在之后的事件中选什么也不做来让他政变，也可以阻止他，让伯纳姆继续当总统\n\n问：斯科特？\n\n答：走洛夫斯通线，完成他的国策，等清事件“清洗右翼反对派”，选择清洗斯科特，斯科特会逃亡。事件“发现敌人”里选择不埋伏他，他就会政变。然后在后续的选举事件中选择斯科特。M·金·哈伯特、J·罗伯特·奥本海默及劳伦斯·丹尼斯可以在斯科特公开演讲的事件后上任。（不影响路线内容）斯科特技官线可以干爆全世界，或是只干爆北美。你还可以建立独特的技官主义傀儡国！（美国、南美、大洋洲、亚洲、欧洲和非洲）\n\n问：勒布？\n\n答：先走斯科特线，然后在选举中选择勒布即可。勒布线可以获得许多优秀的领导人，包括海明威还有技官国会，以及其他你在征服美国各地时可以找到的人类群星，但你只能选择一个人成为国家领导人。其余的都只能成为部长。战争线和斯科特一样，但有独特的国旗和国家名字。\n\n问：约基、吉特洛和拉鲁什？\n\n答：事件“发现敌人”里选择拿出全力对付斯科特，之后能用吉特洛换掉洛夫斯通，然后就可以让约基或拉鲁什推翻吉特洛。选伯纳姆继承人时也可以选拉鲁什。"
