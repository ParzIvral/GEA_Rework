 guides.36.t:0 "宪政国指南"
 guides.36.d:0 "巴顿：\n内战前的美国大选选威廉·默里，切换至宪政国后接受太平洋国的停火提议，并让默里坚持推进谈判。在后续事件中，默里会因过于亲近太平洋国而下台，此时可选择巴顿、林德伯格、拉塞尔或西蒙斯的三K党继任。若想尽快触发黑带起义，可让默里下台、选择三K党，并持续采取激怒黑人群体的选项；其他领导人也可以通过持续对抗黑人群体触发起义。注意：只有拉塞尔执政的宪政国能真正与太平洋国停火。默里若不在遭到警告时退让，坚持接受协议就会引发政变。另一种让巴顿上台的方法是先走西蒙斯线：完成其国策树，等他死后，在后续事件链中拒绝黑色军团的情报、不逮捕斯蒂芬森、不揭露阴谋，最后杀死斯蒂芬森。\n\n巴顿的继承者／瓦达曼：\n先按上述方法让巴顿执政，再推进他的国策树。副总统人选事件中，选择莫斯利，之后在巴顿是否退休的事件中让他退休，即可进入莫斯利线。若想恢复民主，副总统必须选择两位民主派人选之一，完成“重组党派”国策，等待巴顿退位并举行选举的事件，选择走向民主。随后可选瑟蒙德、伯恩斯、伯德、麦卡锡或瓦达曼。选择伯恩斯，之后还能让乔治·华莱士或卢琳·华莱士上台。\n\n理查德·拉塞尔的温和社保派：\n内战前选默里，切换至宪政国后接受太平洋国的停火提议，并让默里坚持推进，迫使他辞职，然后选择拉塞尔。在“宿敌归来”事件中选择争取农民支持，随后尝试用塔尔梅奇自己的手段击败他，会导致尤金·塔尔梅奇政变。“另一个南方民粹分子？”事件也能换掉拉塞尔。斯特罗姆·瑟蒙德和詹姆斯·伯恩斯可以担任拉塞尔的政府首脑。拉塞尔上台后可以与太平洋国签订条约，也是目前唯一能实现这一点的宪政国派系；但若过度激怒林德伯格或三K党，他们仍会发动政变。\n\n克伦普的社会机器：\n完成拉塞尔的反腐国策，在事件中逮捕克伦普，然后让克伦普在下一事件中获胜，他就会政变上台。\n\n四十八州委员会：\n先走拉塞尔或克伦普线。第一个任期（四年）结束后，宪政国首次民主选举可选择林德伯格、拉塞尔、四种路线的四十八州委员会或克伦普。委员会人选包括老拉什·林博的社民路线、阿尔·戈尔的社保路线、威廉·亚历山大·珀西的基督教民主市自路线，以及比伯·格雷夫斯的人道资本主义或民粹迪克西社自路线。他们共用国策树，但格雷夫斯因历史上与三K党的联系，拥有与三K党结盟并使其温和化、而非将其粉碎的动态国策。"
