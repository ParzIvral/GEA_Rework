#哈尔
 GEA_Governor_Hahl:0 "阿尔伯特·哈尔走马上任"
 GEA_Governor_Hahl_desc:0 "阿尔伯特·哈尔并非第一次面对一片庞大、复杂而又难以直接治理的殖民地。早年在德属新几内亚的经历使他深知，殖民统治若只依赖暴力与镇压，最终只会把分身乏术的殖民政府推入无边无际的抵抗泥潭之中。如今的德属东亚比他过去治理的领地庞大得多，民族、宗教与地方传统也更加复杂。哈尔必须把自己几十年来积累的经验重新拿出来，在这片东方领地上寻找一条比单纯高压统治更加持久的道路。"
 GEA_The_troublesome_Indochina_region:0 "棘手的印度支那"
 GEA_The_troublesome_Indochina_region_desc:0 "印度支那一直是德属东亚最难处理的地区，也是德属东亚所仰赖的资源与工业立足的核心地区。然而，过去法国在此殖民所留下的行政遗产在十年间都尚未完全消化：越南皇室依旧保有影响力，各地地主、乡绅、宗教团体与民族主义组织又各自为战，保卫着他们自己微不足道的利益或是民族情节。在此情景之下，黑色星期一更让原本殖民者与本地居民之间积压了十余年的矛盾与仇恨被一同引爆。若想真正稳定这里，我们必须停止把印度支那当作一整块可以用同一种办法管理的殖民地，而应当逐一处理那些真正决定地方秩序的力量。"
 GEA_Our_white_glave:0 "启用白手套"
 GEA_Our_white_glave_desc:0 "哈尔并不打算把德属东亚的未来押在顺化宫廷身上。越南皇室总是怀有重新收拢权力、恢复独立的不切实际的野心。相比之下，那些愿意在德国秩序下谋求前途的越南政治家、地主代表与商界大亨，反而更加值得利用。只要给予他们有限的行政职位、议政渠道与经济特权，他们自然乐于充当总督府与本地社会之间的“白手套”。\n\n让更多越南人进入政府当然意味着本地政治参与程度的扩大，但这恰好能够向印度支那社会展示德国并非完全拒绝合作。与此同时，借助这些与银行、航运、稻米贸易和地方产业关系密切的本地精英，我们还能够进一步重组殖民地经济，使印度支那的资本、企业与市场更加牢固地依附于德国和中欧体系。至于这些新晋政客究竟拥有多少真正的自主权，则完全是另一回事了。"
 GEA_Banquet_of_the_Elite:0 "欢宴名流"
 GEA_Banquet_of_the_Elite_desc:0 "西贡、河内、顺化，这些大城市中从来不缺愿意同德国人进行利益交换的政商名流。他们或许未必真正热爱帝国和他的世界秩序，但财富、地位与现实利益足以让许多人学会合作。通过宴会、咨询机构和商业特许，我们可以把这些本地上层人物逐渐吸收到殖民秩序之中。只要他们能够从现有体系中获利，他们便会比任何宣传口号都更加积极地维护它。"
 GEA_Return_to_the_Vietnamese_court:0 "重返越南宫廷"
 GEA_Return_to_the_Vietnamese_court_desc:0 "时过境迁，顺化宫廷虽然早已失去了昔日的权势，但保大皇帝及其朝廷仍然拥有德国官员无法轻易复制的传统合法性。在过去十余年中，德属东亚的殖民官员们都只把这位末代皇帝和他的臣子看作还活在旧日迷梦中的泥塑神像。可此时此刻面对席卷整个印度支那的民族主义浪潮，与其继续把皇室当作一件无用的礼仪摆设，政府不如重新将他们摆上台面。总督将通过赋予其有限的行政空间，让皇帝替我们吸引那些仍然忠于王朝的官僚、地主与温和民族主义者。"
 GEA_Monarchical_colonial_rule:0 "君主式殖民统治"
 GEA_Monarchical_colonial_rule_desc:0 "越南人无需在皇帝与德国之间进行选择。保大可以继续作为越南传统与民族认同的象征，而德意志皇帝则代表保护这套秩序的更高权威。通过礼仪、教育与地方宣传，我们可以逐渐塑造一种双重忠诚：既效忠顺化，也效忠柏林。只要皇室的威望能够为殖民统治服务，那么保留一个被精心限制的本地君主，远比彻底摧毁他的影响力更为有用。"
 GEA_Revive_The_Luluai_Principle:0 "卢卢艾制度的遗产"
 GEA_Revive_The_Luluai_Principle_desc:0 "阿尔伯特·哈尔曾在德属新几内亚依靠卢卢艾制度，通过授权各地酋长村长，辅以少量德国官员借助本地首领维持基层行政、征税与治安。这种间接的行政管理方式削弱了传统权力的影响力，并成功将当地居民与殖民经济体系紧密联系起来。\n\n如今，印度支那的社会结构虽与太平洋岛屿截然不同，但地主、乡绅、保甲首领与地方名望人士同样掌握着真正深入乡村的影响力。与其让德国官员徒劳地试图直接管理每一个村庄，不如承认这些地方权威的地位并将一些边缘权力下放地方，再让他们替帝国承担登记人口、征收税赋、组织公共工程的诸多基层职责。只要缰绳仍掌握在德国人手中，基层权力由谁具体执行并不重要。"
 GEA_German-style_organization_local_employees:0 "德式机构，本地雇员"
 GEA_German-style_organization_local_employees_desc:0 "十余年来，德属东亚一直患有一种几乎所有海外帝国都会碰上的顽疾：领土扩张的速度远远超过了德国官僚抵达东方的速度。从柏林派遣一名训练有素的行政官跨越半个世界并不困难，困难的是为印度支那、马来亚乃至婆罗洲的每一座县城和港口都找到这样一个人。\n\n解决办法其实早已摆在眼前。德国式的档案、预算、司法与行政体系没有必要改变，但真正负责抄写文件、征收税款、翻译法令乃至处理日常地方事务的人完全可以是越南人、马来人和华人。我们将扩大本地公务员的招募与培训，在保持德国官员牢牢掌握监督和任免权的同时，把殖民机器中最繁琐的齿轮交给那些真正懂得当地语言与习俗的人。"
 GEA_Small_farmers_Chinese_merchants_and_exiles:0 "小农，华商与异乡人"
 GEA_Small_farmers_Chinese_merchants_and_exiles_desc:0 "过去的殖民经济太容易让人粗浅地认为，德属东亚的一切财富都来自几个德国财团。实际上，真正构建德意志在印度支那的运转逻辑基石的反而是田间地头的诸多小农、投身贸易的华商、以及战争结束后因种种原因留在东方的欧洲人。在如此危局之下，哈尔也没有理由继续忽视他们。小农需要稳定的收购与信贷，华商希望减少繁琐的许可和关卡，而那些熟悉当地环境的英法旧侨民则完全可以重新找到一份有用的工作。如果经济繁荣依旧只能完全惠及德国，那么黑色星期一下一次到来时，我们依旧会毫无防备。一个广泛而扎实的低中产阶层，或许才是德属东亚真正缺少的东西。"
 GEA_Domesticating_the_unrestrained_countryside:0 "驯服无羁乡村"
 GEA_Domesticating_the_unrestrained_countryside_desc:0 "在德属东亚，沿着铁路旅行的人很容易产生一种错觉：印度支那已经被彻底征服。帝国旗帜在车站高高飘扬，海关官员检查着货物，城市中的警察也能迅速执行命令。然而，只要离开铁轨和公路数十公里，德国国家的存在便迅速变得模糊。连绵成片的乡村承载了这片土地上绝大部分的人口，而那些密林之中的独立小村落更是完全的法外之地。也正是因此，那些工团匪徒与叛逆能肆无忌惮的藏身其中。为了遏止这一现象，印度支那的无羁乡村必须被尽快推上现代化的轨道。至少要先把那些丛林村落从密林之中迁出来。"
 GEA_The_Rule_of_Humility:0 "谦逊之治"
 GEA_The_Rule_of_Humility_desc:0 "一名刚步入职场的年轻官员，或许精通法律与统计学，却很可能连自己管辖地区的语言都说不好。过去不少殖民官员却偏偏把这种无知当作优越，认为只凭一纸命令便贯彻所有殖民官僚们的意志。哈尔在太平洋多年的行政经验已经证明，傲慢往往只是制造骚乱最昂贵的方法。殖民官员首先必须学会观察和询问。这种所谓的“谦逊”绝不意味着放弃德国的主导地位；恰恰相反，只有明白自己正在统治什么，才能避免为了无关紧要的事情白白树敌。"
 GEA_Amnesty_For_The_Misled:0 "分辨首恶与无辜者"
 GEA_Amnesty_For_The_Misled_desc:0 ""
 GEA_Reconcile_at_last:0 "终得和解"
 GEA_Reconcile_at_last_desc:0 "印度支那的稳定不可能仅靠不断增加的宪兵、监狱和处决维持。经过一系列地方改革、政治妥协与有限赦免，我们终于有机会让一部分曾经敌视殖民政府的人重新接受现有秩序。民族主义不会因此消失，对德国统治的不满也不会一夜之间化解，但只要越来越多的人认为合作比叛乱更有利可图，那么真正的和解便不再只是空谈。"
 GEA_Adat_Under_The_Black_White_Red:0 "黑白红旗下的阿达特"
 GEA_Adat_Under_The_Black_White_Red_desc:0 ""
 GEA_The_Bureau_Of_Native_Affairs:0 "土著事务局"
 GEA_The_Bureau_Of_Native_Affairs_desc:0 ""
 GEA_Abandoning_the_savage_nature:0 "弃绝野蛮秉性"
 GEA_Abandoning_the_savage_nature_desc:0 "德属东亚军队长期依靠一套简单粗暴的殖民战争经验维持秩序：搜捕，拷打，处刑与反游击作战。在不少基层军官眼中，随意殴打、羞辱士兵和平民再平常不过。这样的做法或许能在短期内制造恐惧，却也让每一次平叛都会催生新的抵抗火苗。缺少秩序与文明的统治必然难以长久。我们将强化军纪、限制未经授权的报复行动，并要求驻军在执行治安任务时明确任务目标，而非尽数杀光。若德意志军人自诩代表文明，那么至少首先得学会控制自己手中的枪。"
 GEA_Take_up_the_torch_of_solf:0 "接过佐尔夫之炬"
 GEA_Take_up_the_torch_of_solf_desc:0 ""
 GEA_The_Sultans_Seal:0 "拾起苏丹印玺"
 GEA_The_Sultans_Seal_desc:0 ""
 GEA_Enlightenment_and_the_Mission_of_Education:0 "开化与启蒙使命"
 GEA_Enlightenment_and_the_Mission_of_Education_desc:0 ""
 GEA_Loyalty_rather_than_birth:0 "忠诚而非出身"
 GEA_Loyalty_rather_than_birth_desc:0 "德属东亚军队虽然在东方停驻多年，但几乎从不依赖越南人、马来人和其他本地士兵，一切补员全靠本土供给。结果便是，我们一面抱怨缺乏大头兵和基层军官，一面又拒绝提拔那些最熟悉当地语言、地形和士兵的人。这种浪费没有继续下去的必要。\n\n经过严格审查、长期服役并证明忠诚的本地军人，应当能够进入士官体系，甚至获得有限的军官晋升通道。一名可靠而有能力的安南中士，显然比一个刚从欧洲下船、连自己部下的话都听不懂的少尉更有价值。"
 GEA_Peaceful_Country:0 "太平国度"
 GEA_Peaceful_Country_desc:0 ""
 GEA_The_Three_Beasts_Of_Burden:0 "驾驭三头驮兽"
 GEA_The_Three_Beasts_Of_Burden_desc:0 "法国统治印度支那时，盐、酒与鸦片三项专卖收入曾为殖民财政贡献极其重要的一部分，也因此被人形象地称作支撑印度支那财政的“三头驮兽”。盐税能够深入每一个需要烹饪的家庭，酒类专卖从城乡日常消费中抽取利润，而鸦片则以其惊人的收益填补了殖民政府无数开支。战争与法国统治的崩溃使原有专卖网络遭到严重破坏，而如今黑色星期一更是将它们冲击的七零八落。为了解决眼前的财政危机，殖民政府也只得开始捡起账簿，盘算还能从这三头驮兽中榨取多少油水。"
 GEA_Reform_of_the_outdated_tax_system:0 "陈旧税制改革"
 GEA_Reform_of_the_outdated_tax_system_desc:0 ""
 GEA_Disturbing_the_dreams_of_the_cartel:0 "拉紧卡特尔缰绳"
 GEA_Disturbing_the_dreams_of_the_cartel_desc:0 "十年的东方繁荣让不少德国企业在东方大赚特赚，吃的脑满肠肥。矿业特许、税务减免以及数以十万计的廉价劳动力，使以克虏伯和IG法本为首的卡特尔在德属东亚建立起了几乎不受挑战的商业王国。等到黑色星期一降临，它们又理所当然地第一个伸手要求援助。\n\n哈尔并非那些梦想摧毁大型企业的激进分子。殖民地仍然需要它们的资本、机器与销售网络，但合作必须重新建立在政府主导的基础上。让卡特尔在东方享受优待并无不可，只不过这些大财主需要明白，是帝国给予他们在推动发展的同时捞上一笔的特权，而非帝国央求他们带动经济发展。"
 GEA_The_Eastern_Paradise_of_the_Immigrants:0 "移民们的东方天堂"
 GEA_The_Eastern_Paradise_of_the_Immigrants_desc:0 ""
 GEA_Expanding_export-oriented_economy:0 "扩大出口式经济"
 GEA_Expanding_export-oriented_economy_desc:0 "从印度支那的稻田到马来亚的橡胶园，从锡矿到婆罗洲木材，德属东亚从诞生之日起便是一台面向海外市场运转的机器。黑色星期一已经残酷证明，这种结构使我们极易受到国际价格波动影响；但若因此放弃出口，无异于因为船可能遇上风暴便把港口全部填平。正确答案不是退出世界市场，而是让出口体系更加庞大多元，也更加牢固地连接上中欧同盟的庞大市场。随着情况稳定，港口设施将继续扩建，铁路与仓储网络要服务更多商品，金融机构也将为出口企业提供更宽容的信贷。"
 GEA_Connecting_culture_with_nationality:0 "连结文化与民族性"
 GEA_Connecting_culture_with_nationality_desc:0 ""
 GEA_Restore_food_security:0 "恢复粮食保障"
 GEA_Restore_food_security_desc:0 ""
 GEA_Eastern_Economic_Pump:0 "东方经济泵"
 GEA_Eastern_Economic_Pump_desc:0 ""
 GEA_Even_closer_to_a_model_colony:0 "距模范殖民地更进一步"
 GEA_Even_closer_to_a_model_colony_desc:0 "“模范殖民地”一直是帝国殖民官僚最喜欢写在报告里的词语。过去，它只意味着帝国的殖民地能够自负盈亏甚至反哺国内。但这种定义已经过时了：德属东亚在过去为国内提供了无尽的财富，可本地官员却仍然看着本地居民向着造反越走越近。如今，哈尔希望让这个词至少比过去多一点更意义：地方传统没有被简单摧毁，而是被纳入现有的行政体系之中；德国人与本地人尽可能平等相待；财富也不是无限制的流入德国卡特尔的钱包之中。尽管距离这些目标仍有距离，但对于德属东亚而言，至少这个松散的殖民地联合已经开始迈入正轨。"

