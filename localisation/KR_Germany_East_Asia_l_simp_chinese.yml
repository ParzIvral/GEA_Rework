 GEA_colonial_question_hahl:0 "东亚殖民政府"
 GEA_colonial_question_hahl_desc:0 "德意志的旗帜已经在东亚这片土地上屹立了数十年。即使在世界大战期间，德属东亚也曾誓死捍卫帝国在阳光下的权利，并以舰队和忠诚的军队勇士与协约国奋战到底。然而如今的东亚政府已逐渐腐朽：旧英法殖民遗产、海军辖区、企业巨头办事处、本地保护国与各式临时机构层层堆叠，构成了一套庞杂、低效而缺乏共同目标的殖民机器。随着时间推移，这个本就临时拼凑的机器更是日渐朽坏，诸多因素都在不断侵蚀我们原本平稳的统治。然而，包括总督在内，许多帝国与本土的殖民官僚仍相信，只要舰队还在海上游弋，港口仍悬挂黑白红旗，一切不满都不过是区区噪音。"
