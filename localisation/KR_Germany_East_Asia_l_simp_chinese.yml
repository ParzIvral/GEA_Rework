 GEA_Indochina:0 "§l印度支那§!"
 GEA_Indochina_desc:0 "印度支那这片地区，始终是德属东亚诸多殖民行政区划中最不稳定的地区。这里在过去几年中就一直被农民起义与游击队所困扰。这其中最大的一部分原因就是越盟在印支地区四处煽动起义与暴动。这些赤匪潜藏在树林于山谷之中，很难被我们的治安军抓获。如今为了稳定该地局势，我们能做的只有两种选择：加大搜捕力度，或是对他们妥协。当然，总参谋部的一些高级将领是不会乐于见到我们对这些“蛮子”低头的......"
