 GEA_valkyrie_tt:0 "§G女武神的骑行§!将会极大降低我们战斗的伤亡率\n"
 GEA_Fleet_will_arrive:0 "§Y一支新驱逐舰舰队即将完成编组并加入东亚分舰队，然而距离她们抵达仍需要时日。§!\n"
 GEA_I_want_CL:0 "§Y一支由改装轻巡洋舰组成的支援舰队正在船坞中建造中。这批由老旧舰船改造而来的轻巡洋舰仍旧配备了不俗的火力与装甲。不日这些巡洋舰就将完工并加入东亚分舰队。§!\n"
 GEA_I_want_CA:0 "§Y一支由改装老旧巡洋舰组成的支援舰队正在船坞中建造中。这批由老旧舰船改造而来的重巡洋舰尽管相对老旧，但仍能提升我们的实力，同时也能够提升我们的舰船改装能力。不日这些巡洋舰就将完工并加入东亚分舰队。§!\n"
 GEA_I_WANT_BC:0 "§Y两艘新锐殖民地战列巡洋舰将被纳入东亚舰队指挥系统，距离她们竣工还需数日。§!\n"
 GEA_I_WANT_CB:0 "§Y一批由两艘战列巡洋舰以及大量巡洋舰组成的巡洋舰支援分遣队即将竣工，并很快就将到达德属东亚，作为舰队的绝对主力支援东亚分遣舰队。§!\n"
 GEA_I_WANT_BB:0 "§Y内卡河号，这艘正在新加坡的船坞中建造的强大战舰将会成为我们光荣的东亚分舰队的新旗舰，但距离竣工仍需时日。§!\n"
 GEA_I_WANT_CARRIER:0 "§Y一艘正在建造的新型战列巡洋舰将被改装成轻型航空母舰。这需要耗费一些时间，但同时也能够提升我们的舰船改装能力。§!\n"
 GEA_I_WANT_CV:0 "§Y两艘新型航空母舰正在德意志祖国的基尔港中建造，待到竣工她们就将出发来到东亚，成为我们光荣的东亚分舰队的核心主力。根据工期以及路程计算，我们仍需等待一年时间§!\n"
