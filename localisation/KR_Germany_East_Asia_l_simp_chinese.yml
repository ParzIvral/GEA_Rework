 GEA_admirality3_desc:0 "海军主宰着德属东亚。[GEA.getleader]舰队的庞大规模前所未有，这些海上要塞保护着热带天堂不受乱军和外敌的侵略，护佑着德意志帝国在亚洲的掌上明珠。虽然分离主义和激进主义丛生，但大舰队确保了德国对这些土地的控制，因此，海军是我们的重中之重。一切资源为海军服务，因为没了海军，我们肯定陷入混乱与蛮荒境地，虽然海军至上可能损害殖民地其他方面，但对海军战士来说这不算事，这就是我们的海员生活！"
