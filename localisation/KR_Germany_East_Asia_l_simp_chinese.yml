 GEA_Malaya:0 "§l马来亚§!"
 GEA_Malaya:0 "尽管印度支那是一片混乱的土地，但所幸德属东亚所统治的核心地区，马来亚半岛始终保持了平稳安定的社会环境。这使得海军政府在此实行的无论经济政策或是法律都能够得到有效执行。只要我们能够成功守卫住马来亚半岛，德属东亚的旗帜就不会在东南亚倒下。同时，扩大对马来亚半岛的开发也能够为我们贡献更多的工业产值，最终我们将会把这里建设得与祖国别无二致。"
