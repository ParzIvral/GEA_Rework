 # GEA-specific names and descriptions for imported German MIOs
 GEA_henschel_organisation: "Henschel"
 GEA_henschel_desc: "§gHenschel & Sohn was founded in 1810 as a father and son enterprise between Georg Henschel and his son Johann Werner to create cannons in the town of Cassel. They'd soon branch out into making steam engines however in 1816, and Johann's brother Carl Anton would join as a partner. He soon took over for his father Georg in 1835, and they released their first steam locomotive, the Drache, in 1848. Carl Anton would suddenly die however in 1860 once his health took a turn for the worst, leading his son Oscar to take over. He would greatly expand the enterprise over the coming decades, and by the time of his 1894 death, they had produced over 4,000 trains. They would become one of Germany's largest locomotive manufacturers by the dawn of the 20th century, and they would soon prove themselves indespensible during the bloody Weltkrieg. They would help to produce war locomotives to transport material and men, while also producing early tanks to overrun the French lines. After the war, they would continue to be on top of the corporate food chain, while also competing with Borsig and Hanomag to supply rolling stock to Europe's rails. As of the present, they've continued to supply the blood to Mitteleuropa's steely veins, while also producing mobile tanks that may be useful in the event of war.§!"
 GEA_henschel_mio_desc: "$generic_mio_initial_trait_fast_tanks_designer$\n§L$GEA_henschel_desc$§!\n"
 GEA_adler_organisation: "Adler"
 GEA_adler_desc: "§gAdlerwerke vormals Heinrich Kleyer was created by its namesake founder in 1880 in Frankfurt, originally to manufacture bicycles. It would quickly shift gears however to produce even more products, which included typewriters, sewing machines, and automobiles. In 1902, Edmund Rumpler became its technical director, and they would start producing engines as well, and soon they would be selling their new Standard models after the Weltkrieg. They would absolutely boom during the golden years of the twenties as the middle-class had money to spend, leading them to buy the Standard 6 as a competitor to the Opel Tree Frog. These times would not last however, as eventually competition would slow down, and they've since found themselves lagging behind their three main rivals. Regardless, they're still have a place as Germany's second most popular car brand, and they're perfectly happy to help us manufacture tanks and military vehicles should we require them.§!"
 GEA_adler_mio_desc: "$generic_mio_initial_trait_heavy_tank_designer$\n§L$GEA_adler_desc$§!\n"
 GEA_krupp_tank_organisation: "Krupp"
 GEA_krupp3_desc: "§gGrusonwerk got its start in 1855 in the town of Buckau near Magdeburg, and it was created by a man named Hermann Gruson to smelt iron and make machine parts. He would soon expand into making armoured gun turrets to supply the Prussian army in the 1860s, and he would profit off of the Wars of Unification by supplying arms to von Moltke's legions. After the wars however, the company would flounder after Gruson's death, leading to its hostile takeover by Krupp in 1893. It would soon be rechristened as Krupp-Grusonwerk and another arm of the Krupp beast, tasked with producing armoured plates and ship turrets for its subsidiaries. During the Weltkrieg, it would arm the Heer and supply the ships of Germaniawerft, while also growing fat off of these profitable military contracts. After the war, they have continued to do well, despite the long peace, though they are more than willing to get back into action to make us Panzers that can support our troops.§!"
 GEA_krupp3_mio_desc: "$generic_mio_initial_trait_infantry_tanks_designer$\n§L$GEA_krupp3_desc$§!\n"
 GEA_benz_organisation: "Benz & Cie."
 GEA_benz_desc: "§gBenz & Company Rheinische Gasmotoren-Fabrik was founded in 1883 in Mannheim by the trio of Friedrich Eßlinger, Max Rose, and Carl Benz. Benz had the distinction of being the first man to create a working car in 1885, and with his Benz Patent-Motorwagen, he would leverage his fame to create a business. His company Benz & Cie soon became one of the world's largest car manufacturers, pumping out thousands of vehicles by the 1890s. He would soon face fierce competition from his rivals however at Daimler-Motoren Gemellschaft, which would spiral into an nascent cold war that has continued to this day. After failing to turn a profit with the 1903 Benz Parsifal, Benz retired from his company after a spat with his chief engineer, so he would hand over the reins to a new generation. They would soon release the illustrious Blitzen-Benz in 1909 and a wide array of racing cars to compete with the Mercedes 35 PS. During the Weltkrieg, they would also turn a profit by working against their competitors to create Benz Bz III aircraft engines and trucks at their Mannheim facilities. After the war, they would continue to grow after facing some short-term difficulties due to the failure of their Benz Tropfenwagen to sell many models. In 1928, they would release the Benz Rennmeister that Hans Stuck would ride to victory in the 1931 Belgian Gran Prix, and in 1931, they would release the Benz 10/35 PS, which would become popular amongst the middle class. They would soon even move their headquarters to Berlin to spite their Daimler rivals, and in 1932, release the Benz 750 to compete with the Mercedes 770. As of the present, they have continued to do well, especially with more luxury models, though they have also fallen behind Opel in selling more mass-produced cars. They continue to jostle with Daimler for the top spot on the throne, and they're sure to produce us good tanks that our troops can rely on.§!"
 GEA_benz_mio_desc: "$generic_mio_initial_trait_general_tank_designer$\n§L$GEA_benz_desc$§!\n"
 GEA_daimler_organisation: "Daimler"
 GEA_daimler_desc: "§gDaimler-Motoren-Gesellschaft was founded in 1890 in Cannstatt by Gottlieb Daimler, the man behind the motorcycle, and Wilhelm Maybach, The King of Design. They originally wanted to create a company that could produce high-speed engines, but they ended up producing the ‘Phönix, their first car in 1897. From there, Maybach would design the legendary Mercedes 35 PS in 1900 that would blaze past the competition on the French Riviera at the Nice-La Turbie. DMG would continue to grow after the Canstatt Fire in 1903 forced them to move their facilities to Untertürkheim and a series of other factories. During the Weltkrieg, they would thrive by producing armoured cars and even airplanes at their Sindelfingen facility, and after the war, they would boom after they moved their headquarters to Berlin. They would make a name for themselves producing luxury cars such as the Mercedes 24/100/140 PS that were known for being good sports vehicles and white elephants for the Prussian junkers. In 1928, Rudolf Caracciola would even race a Mercedes Supersport to victory in that year's German Gran Prix, and in 1931, Kaiser would buy himself a Mercedes 770 that he'd show off to all the crowds at the Charlottenburger Chaussee. Things haven't been all great however for the rising company, as they've been struggling against their rivals at Benz & Cie for the top spot in the luxury car market. They've also been failing to sell cheaper cars to the masses like Opel and Adler, as their Daimler 6/25 PS failed to launch in the 20s to muted fanfare. Regardless, the company's fortunes may change if Germany were to get into a war, as they are sure to supply us tanks and amour of the highest caliber.§!"
 GEA_daimler_mio_desc: "$generic_mio_initial_trait_medium_tank_designer$\n§L$GEA_daimler_desc$§!\n"
 GEA_kaiserliche_werft_wilhelmshaven_organisation: "Wilhelmshavenwerft"
 GEA_kaiserliche_werft_wilhelmshaven_desc: "§gKaiserliche Werft Wilhelmshaven has its origins in the Jade Treaty of 1853 that ceded a plot on the Jade Bight to Prussia from the Duchy of Oldenburg. From there, would spring the port of Wilhelmshaven in 1869 to act as a central node for the German shipbuilding apparatus. The Wilhelmshavenwerft was formed in 1871 as one of the three imperial shipyards dedicated towards building large warships for the growing Kaiserliche Marine. It would especially expand under Admiral Tirpitz during the height of the dreadnought race, acquiring three new docks and a deep water harbor by 1908 to produce capital ships. Whether it be titanic giants like the SMS Nassau or large cruisers like the SMS Hindenburg, it would produce some of the most iconic models of the hulking German armada. It proved essential to the German war effort as both a dock, but also a staging-off point for the High Seas Fleet, and by the end of the war, it had employed over 21,000 people. It would fall into a slight slump however with the demobilisation after the war, but it'd soon roar back into action with the expansion of Germany's empire. With Britain and Japan at our doorstep, it will prove crucial to pioneer the next generation of capital ships if we choose to pursue that path.§!"
 GEA_kaiserliche_werft_wilhelmshaven_mio_desc: "$generic_mio_initial_trait_battle_line_ship_builders$\n§L$GEA_kaiserliche_werft_wilhelmshaven_desc$§!\n"
 GEA_germaniawerft_organisation: "Germaniawerft"
 GEA_germaniawerft_desc: "§gFriedrich Krupp Germaniawerft was preceded in 1863 by the Bruhn Shipyard in Gaarden near Kiel. It then became the Norddeutsche Werft in 1867 once it was no longer controlled by the Danes, and it'd be operated by the North German Shipping Company under the leadership of Georg Howaldt. From there, it'd lay down about 83 ships by 1879 only to go bankrupt that same year due to financial mismanagement. It would then pass to Märkisch-Schlesische Engineering and Ironworks Corporation that same year before getting bought out by Friedrich Krupp AG in 1902. It soon got renamed to Friedrich Krupp Germaniawerft as another jewel in the Krupp crown who were determined to transform it into one of Germany's most important shipyards. Before the Weltkrieg, it produced several battleships such as the SMS Kronprinz, Prinzregent Luitpold, and Posen, along with light cruisers like the Gazelle, Nymphe, and Amazone. During the war, it'd especially pivot into producing U-Boats for the Kaiserliche Marine, producing around 100 models by the end of 1919. After the war, they would continue to produce more traditional capital ships, along with the occasional imperial yacht, though increasingly they have began making more Type VII submarines at the behest of Admiral Donitz.§!"
 GEA_germaniawerft_mio_desc: "$GEA_mio_initial_trait_refurbishment_repair_dockyard$\n§L$GEA_germaniawerft_desc$§!\n"
 GEA_blohm_voss_organisation: "Blohm und Voss"
 GEA_blohm_voss_desc: "§gBlohm und Voss was founded by Hermann Blohm and Ernst Voss in 1877 in Hamburg to produce cargo ships and iron steamers. After selling a number of ships, they'd build their first floating dock in 1887, which was followed by a mass expansion that was approved by the Hamburg Senate. This allowed them to then become a limited partnership in 1891 that produced the Kaiser Karl der Große in 1899 as their first imperial warship. They then continued to expand their facilities like Dock 5 to become the world's largest floating harbor, while also becoming the primary supplier for battlecruisers for the Kaiserliche Marine. During the war, they continued to expand to become Germany's largest submarine provider, using their Hamburg dock to wage unrestricted submarine warfare. They also would help the Ottomans to modernise their Golden Horn facilities, providing them with old ships to help them to police the Bosporus. After the war, they'd then form a close partnership with Flugzeugbau Friedrichshafen in order to produce maritime aircraft to help control the oceans. They would also even further specialise in pumping out fast-moving U-Boats that prove incredibly promising as the future of naval warfare.§!"
 GEA_blohm_voss_mio_desc: "$generic_mio_initial_trait_raiding_fleet$\n§L$GEA_blohm_voss_desc$§!\n"
 GEA_schichau_werke_organisation: "Schichau-Werke"
 GEA_schichau_werke_desc: "§gSchichau-Werke originally began as a machine factory in 1837 created by Ferdinand Schichau in Elbing to make engines. He'd soon expand into making trains however in 1859, building Germany's first compound locomotives as a major supplier to its rails. He wanted to further expand into making ships however and war vessels for the Kaiserliche Marine, so he built a small facility in Elbing in 1877. It would specialise in making torpedo boats and destroyers for almost every customer, producing 483 of them by 1918, with most going to the Russian Empire. Its Elbing facilities proved quite small however and unable to build larger ships, so he built a larger dockyard in Danzig in 1890. He would die in 1896 however, leaving his company to Heinrich Ziese, his son-in-law who would use it to produce bigger ships. Whether it be battleships like the Schleisen or little cruisers like the Kolberg, it'd become crucial to supplying the Kaiserliche Marine during the buildup to the Weltkrieg. After, it'd continue to do quite well barring some financial mismanagement, as it also invested in civilian liners for Norddeutscher Lloyd. At the present, it continues to be a fixture to the east German economy that will be sure to supply us with everything the navy could ever ask for.§!"
 GEA_schichau_werke_mio_desc: "$generic_mio_initial_trait_submarine_designer$\n§L$GEA_schichau_werke_desc$§!\n"
 GEA_weser_organisation: "AG Weser"
 GEA_weser_desc: "§gAktien-Gesellschaft Weser was founded in 1843 as Eisengiesserei und Maschinenfabrik Waltjen und Leonhardt: an iron foundry and machine works plant. It then transitioned into shipbuilding however under the leadership of Carsten Waltjen who put out their first paddle steamer in 1847. From that point, the company became C. Waltjen und Co. once Heinrich Leonhardt departed, and it would be transformed into the Weser Joint-Stock Company in 1872. Headed by a board of Bremen merchants, it would produce ships of every kind, which included many warships for the growing Kaiserliche Marine. Before the war, they specialised heavily in gunboats, along with escort ships and coastal boats in order to help protect commerce. Once the Weltkrieg broke out however, they also pivoted heavily towards making U-Boat packs, producing about 90 of them by the time it had ended. After the war, they'd continue to refurbish their docks and pioneer new technologies such as the Bauer-Wach exhaust steam turbine and sturdy Maier design. At the present, they still act as an innovator in German shipbuilding that will help us to protect our sea lanes and strike from beneath the waves.§!"
 GEA_weser_mio_desc: "$generic_mio_initial_trait_escort_fleet$\n§L$GEA_weser_desc$§!\n"
 GEA_kaiserliche_werft_kiel_organisation: "Kielwerft"
 GEA_kaiserliche_werft_kiel_desc: "§gKaiserliche Werft Kiel was founded in 1867 as the oldest of the three imperial shipyards to build warships for the Kaiserliche Marine. Initially, it was known as the Königliche Werft Kiel, but it'd be renamed after German unification, and it'd be massively expanded by a series of captains over the coming years. After the completion of the Kiel Canal in 1895, it'd soon subsume the old village of Ellerbek and expand at such a rapid rate that Friedrich Krupp Germaniawerft had to cede land to it. Then, before the Weltkrieg, It would dedicate itself towards the construction of large ships such as armoured cruisers like the Blücher and Roon and battleships like the SMS Kaiser. During the war, it would absolutely prove vital to maintaining the capital fleet, even though it didn't see much action after the Battle of Jutland. Since then, it has continued to branch off into producing modern capital ships, while also trying to modernise our old dreadnought-era models. But it has also gone off and pioneered many new innovations, whether it be Dornier and Friedrichshafen seaplanes or the SMS Graf Zeppelin as Germany's first aircraft carrier.§!"
 GEA_kaiserliche_werft_kiel_mio_desc: "$generic_mio_initial_trait_task_force_ship_builders$\n§L$GEA_kaiserliche_werft_kiel_desc$§!\n"
 GEA_focke_wulf_organisation: "Focke-Wulf"
 GEA_focke_wulf_desc: "§gHeinrich Focke and Georg Wulf began working together in 1912 to build experimental motors and design innovative new aircraft. They would soon build the A 7 Storch as their first plane in 1921 after the Weltkrieg disrupted their studies and led them to serve in the Luftstreitkräfte. In 1924, they would then use this success to create their own company in the form of Focke-Wulf Flugzeugbau AG with the help of some Bremen merchants. That same year, they would also produce Focke-Wulf A 16 for Deutsche Luft-Reederei for civilian use, while also producing fighter craft and reconnaissance planes for the Luftstreitkräfte. By the end of the 20s, they would manage to make almost 20 new models for multi-purpose use, while also becoming moderately successful against their various competitors. They have still had their issues however and near scrapes with disaster, as Georg Wulf would only narrowly survive a plane crash in 1927. They have also not done great with the Creditanstalt Crisis due to a series of poor investments. Regardless, the company is still on the up and up, and they will surely prove useful in supplying us bombers, fighters, recon planes, and even experimental helicopters.§!"
 GEA_focke_wulf_mio_desc: "$generic_mio_initial_trait_range_focused_aircraft_designer$\n§L$GEA_focke_wulf_desc$§!\n"
 GEA_bfw_organisation: "Bayerische Flugzeugwerke"
 GEA_bfw_desc: "§gBayerische Flugzeugwerke AG was originally established as Otto Flugmaschinenfabrik in 1910 by the aviator Gustav Otto to produce aircraft in Bavaria. It would quickly fall into financial difficulties however in 1916 due his mismanagement, so it would be restructured as the Bavarian Aircraft Factory by various banks and MAN AG. From this point forward, Peter Eberwein would become its chair as an ex-Albatros employee, and they would receive licenses to pump out its designs like the Albatros D. III. After the war however, they would finally branch out into producing their own models like the BFW M17 and BFW Flamingo that would find some success with commercial airlines. On the whole however, they did not thrive throughout the course of the 20s due to a combination of more financial mismanagement and competition from Rumpler and Albatros. This would lead them to again get restructured in 1926 under a new board of directors that included the designer Willy Messerschmitt. From this point forward, they would begin to do much better as they opened up a new facility in Ramersdorf and merged with dying companies like AGO Flugzeugwerke. This allowed them to get back on their feet and finally eclipse Rumpler to become the largest aircraft manufacturer in all of Bavaria. As of the present, they've found an immense amount of success with the BFW 109, which has become a staple fighter of the Luftstreitkräfte. On the whole though, they still find themselves struggling against the old giants of the 'Big Four,' and it remains to be seen if they can adapt to the changing times.§!"
 GEA_bfw_mio_desc: "$generic_mio_initial_trait_light_aircraft_designer$\n§L$GEA_bfw_desc$§!\n"
 GEA_siemens_schuckert_organisation: "Siemens-Schuckert"
 GEA_siemens_schuckert_desc: "§gSiemens-Schuckertwerke was formed in 1903 when the mighty Siemens und Halske acquired Elektrizitäts-Aktiengesellschaft vormals Schuckert & Co. This created a massive conglomerate under the leadership of Alfred Berliner that'd start producing everything from electronics to trains to cars. Georg Wilhelm von Siemens would become eager however to also produce aircraft for the Luftstreitkräfte due the outbreak of the Weltkrieg in 1914. So, he appointed Villehad Forssman as his chief designer during that same year to start producing a massive aerial bomber modelled off of the Sikorsky Ilya Muromets. This however ran into problems, so he was sacked in 1915 and replaced with the Steffen Brothers who designed the Siemens-Schuckert R1 and R2. These planes were soon followed by further models which would prove key fixtures in the war such as the Siemens-Schuckert R3 bomber and famed D4 fighter. After the war, they then fell under the leadership of Carl Friedrich von Siemens who'd then take them to new heights as a mighty titan of German aircraft. They'd start supplying commercial models to Lloyd Luftdienst and Deutsche Luft-Reederei, while also producing agile new fighters like the Siemens-Schuckert D10. They would also produce even more G series bombers to compete with Gothaer Waggonfabrik and continue to further innovate with high-climbing new designs. They have even earned themselves the reputation of being one of Manfred von Richthofen's favourites as they continue to jostle with the “Big Four” of Junkers, GW, and Albatros.§!"
 GEA_siemens_schuckert_mio_desc: "$generic_mio_initial_trait_multi_role_aircraft_designer$\n§L$GEA_siemens_schuckert_desc$§!\n"
 GEA_junkers_organisation: "Junkers"
 GEA_junkers_desc: "§gJunkers Flugzeugwerk originally had its origins in the company Junkers & Co. that was founded in 1895 to create water boilers for factories. Hugo Junkers would soon expand into aircraft production though during the Weltkrieg, producing the Junkers J 4 monoplane as the world's first all-metal airplane in 1917. This soon caught the eye of the Luftstreitkräfte and the OHL who saw him as a useful asset, so they forced him to merge with Fokker to form Junkers-Fokker Werke in 1918. The goal was to combine Junker's all-metal designs with Fokker's ability to do mass production, but this marriage was not a happy one as both companies came to despise each other. Eventually, they parted ways in late 1919, and his company just became Junkers Flugzeugwerk AG, while Fokker went back to Schwerin. From this point forward, he would create Junkers Luftverkehr in 1924 in order to man civilian flights across Mitteleuropa with models like the Junkers F 13 using brand new diesel engines. He also would continue to supply military craft to the Luftstreitkräfte in competition with Dornier and GW with bombers like the Junkers Ju 87 and fighters like the Junkers Ju 88. As of the present, Junkers has become one of the top dogs in the German aircraft industry, with factories sprawling across Magdeburg and Dessau and much of the Prussian heartland. But it does find itself in a strange spot however after Hugo Junker's 1935 death, which has left something of a power vacuum without his vision to guide it. Its rivals in the 'Big Four' are also constantly trying to find new ways to outdo it, whether it be Gothaer Waggonfabrik, Siemens-Schuckert, or Albatros.§!"
 GEA_junkers_mio_desc: "$generic_mio_initial_trait_cas_aircraft_designer$\n§L$GEA_junkers_desc$§!\n"
 GEA_dornier_organisation: "Dornier"
 GEA_dornier_desc: "§gDornier got its start with Claude Dornier in 1910, who was an engineer under Graf Zeppelin working on his Zeppelin airships. He came to head their Friedrichshafen office during the Weltkrieg, which would allow him to form his own independent company, Zeppelin Werk Lindau, as a subsidiary. They would soon make a name for themselves producing flying boats like the Dornier RS IV and Dornier Delphin, and in 1922, they would use this success to become a partner within the Zeppelin Group known as Dornier Metallbauen. From this point forward, they would heavily invest in models like the Komet II and Dornier Do N that would become known for both their speed and all metal design. They would also expand beyond their original facilities in Friedrichshafen, building Dornier Works in Lubeck and an incredibly large factory in Berlin in 1923. As of the present, they've continued to find great success in putting in orders for civilian airlines, supplying Lloyd Luftdienst GmbH and Deutsche Luft-Reederei in their numerous flights across Europe. Claude Dornier is now a wealthy man in charge of a respectable company, and he will surely be useful in supplying us with planes like the Dornier Do 19 to bomb our enemies.§!"
 GEA_dornier_mio_desc: "$GEA_mio_initial_trait_medium_aircraft_designer$\n§L$GEA_dornier_desc$§!\n"
 GEA_gothaer_waggonfabrik_organisation: "Gothaer Waggonfabrik"
 GEA_gothaer_waggonfabrik_desc: "§gGothaer Waggonfabrik has its roots in Fritz Bothmann & Company, which was founded in 1883 to build ship carousels and baggage cars. This would soon evolve into a larger business however in the following decades with its transformation into a public limited company known as Gothaer Waggonfabrik vormals Fritz Bothmann. Its original owners, Bothmann and Louis Glück, would soon be forced to resign however and sell their company to a new board of directors, who rechristened it Gothaer Waggonfabrik in 1910. Albert Kandt would be their new leader who would lead it into a new direction by producing airships with the help of Duke Carl Eduard of Saxe-Coburg and Gotha. Together, they would construct a new airship port and a state of the art flying school, along a massive military airbase that would be used heavily during the Welkrieg. During the war, Gothaer Waggonfabrik pioneered much of Germany's early aircraft production, building some of its first biplanes and devastating Gotha G Bombers. After the war, they would only continue this trend from their new Fürth location with brilliant engineers like Karl Caspar and their new factories at Bayreuth and Wismar. As of the present, they have leveraged this growth to become one of Germany's most powerful aircraft producers, competing with the 'Big Four' for the top spot on the throne. The Luftstreitkräfte still loves their bombers, which have become a mainstay in their bombing runs, along with their fast-moving fighters, which are well-loved by German pilots.§!"
 GEA_gothaer_waggonfabrik_mio_desc: "$generic_mio_initial_trait_heavy_aircraft_designer$\n§L$GEA_gothaer_waggonfabrik_desc$§!\n"
 GEA_friedrichshafen_organisation: "Flugzeugbau Friedrichshafen"
 GEA_friedrichshafen_desc: "§gFlugzeugbau Friedrichshafen was founded in 1912 in Friedrichshafen on Lake Constance by the Zeppelin designer and pilot Theodor Kolber. He then received large investments from the Graf in 1916 to take over a hangar at Manzell and the Warnemünde shipyards to start making seaplanes and bombers. During the course of the war, the company would become well-known for models like the Friedrichshafen FF 29 and FF 49 that worked closely with the Kaiserliche Marine to patrol the Baltic and North Sea. After the war, the company would continue to grow under Kober's continued leadership, working closely with Blohm und Voss at its new workshop at Ziegelskoppel in Reval. Under its technical director, Karl Gehlen, they would produce new designs like the Friedrichshafen FF 80 that'd become a mainstay in German efforts to police the waters of the South Sea. They would also help to produce new bombers like the  Friedrichshafen FF 77, while also buying out licenses from Gothaer Waggonfabrik. This has allowed them to become a mid-level company that is respected amongst the Kaiserliche Marine, though they still find themselves in competition with Dornier to produce seaplanes. Regardless, they will surely play a crucial role to win dominance over the seas and beat back the British or anyone who may threaten us.§!"
 GEA_friedrichshafen_mio_desc: "$generic_mio_initial_trait_naval_aircraft_designer$\n§L$GEA_friedrichshafen_desc$§!\n"
 GEA_mauser_organisation: "Mauser"
 GEA_mauser_desc: "§gThe brothers Wilhelm and Paul Mauser got their start working under their father, Andreas Mauser, at the Königliche Waffen Schmieden of King Frederick I of Württemberg. They would soon take their own initiative in developing their own projects, which resulted in the invention of the Dreyse needle gun and breechloading rifle in the 1860s. This earned the brothers praise as reliable arms dealers, which allowed them to sell a revised model as the official gun of the Prussian army. From 1871 onwards, this massively changed their fortunes, which allowed them to found their own company soon after. The old Königliche Waffen Schmieden was bought out in 1874 and eventually merged with various brands to form Mauser A.G. in 1897. Ever since, they have played a critical role in supplying the German Heer, especially during the Weltkrieg on both the Western and Eastern fronts. They continue to dominate the globe and especially Mitteleuropa's markets in producing high-quality guns like the K98k and C96.§!"
 GEA_mauser_mio_desc: "$generic_mio_initial_trait_infantry_manufacturer$\n§L$GEA_mauser_desc$§!\n"
 GEA_dwm_organisation: "Deutsche Waffen- und Munitionsfabriken"
 GEA_dwm_desc: "§gDeutsche Waffen- und Munitionsfabriken was created in 1896 after Ludwig Loewe & Co acquired a weapons plant and munitions plant at Berlin and Karlsruhe respectively. From there, Isidor Loewe would embark on a campaign of ruthless acquisitions and mergers that would see him gain leading shares in Mauser and Fabrique Nationale in Belgium. This would allow him to dominate most of the German armaments market alongside Krupp, his rivals, in a struggle that would turn hot during the Weltkrieg. During the conflict, they would compete over selling the Heer guns, with DWM supplying them Mauser rifles, Luger pistols, and Maxim machine guns, and eventually the war would end, which would bring them further profits. They transformed old arsenals into new subsidiaries throughout Mitteleuropa, while also buying out shares in the Belgian arms industry after the British Revolution. Now, they hold dominance in the Reich's markets as its second biggest arms manufacturer, and they will continue to use that to their advantage to sell us high-quality guns and support equipment.§!"
 GEA_dwm_mio_desc: "$generic_mio_initial_trait_support_equipment_manufacturer$\n§L$GEA_dwm_desc$§!\n"
 GEA_rheinmetall_organisation: "Rheinmetall"
 GEA_rheinmetall_desc: "§gRheinische Metallwaaren- und Maschinenfabrik Aktiengesellschaft was founded in 1889 as a subsidiary of a larger metal conglomerate to produce ammunition for the German Empire. They would soon acquire their first factory under Heinrich Ehrhardt in Düsseldorf, where they would start making great strides in producing long-range guns. They secured patents for producing seamless tubes in 1892 and they produced the world's first rapid-fire gun in 1896. By 1914, they had become one of Germany's premier arms manufacturers by buying out dying companies like Dreysesche Gewehrfabrik in 1901. During the Weltkrieg, they were known for their artillery and howitzers that were used out on the field, and they have since branched out into armour and anti-air technologies that could prove useful.§!"
 GEA_rheinmetall_mio_desc: "$generic_mio_initial_trait_artillery_manufacturer$\n§L$GEA_rheinmetall_desc$§!\n"
 GEA_opel_organisation: "Opel"
 GEA_opel_desc: "§gAdam Opel founded his company in 1862 in Rüsselheim, Hesse, originally as a venture to produce sewing machines. It would quickly expand out however to produce bicycles and other products by the time of his demise. He was then succeeded by his late sons and his widow Sophie in 1895, and they partnered up with Friedrich Lutzmann to make an automobile in 1899. From this measly car, would spring a formidable business that would meet the Weltkrieg's demands by pumping out three-ton trucks and standardised parts for the army. After the war, they would continue to expand as Germany's most popular brand of car, with dominance over Mitteleuropa and nearly a third of the German market. In the 20s, they would release the Opel 4 Tree Frog, which became the German Model T Ford, and in the 30s, they would release the Opel Blitz, which became the country's most popular truck. They're more than willing to serve the Fatherland if we are to again go to war, and they'll certainly give us everything we need if we want to pursue a policy of Bewegungskrieg.§!"
 GEA_opel_mio_desc: "$generic_mio_initial_trait_motorized_mechanized_manufacturer$\n§L$GEA_opel_desc$§!\n"
 GEA_hanomag_organisation: "Hanomag"
 GEA_hanomag_desc: "§gGeorg Egestorff founded Eisengiesserei und Maschinenfabrik Hanover in 1835 in the small town of Linden to build steam engines. This would quickly expand into locomotive production in 1846, and by 1870, they would be supplying almost all of Hanover's State Railways. In 1871, the company became Hannoversche Maschinenbau AG after it was sold by its previous owner, and it would then expand into tractor and automobile production by the 20th century. During the Weltkrieg, they supplied the German army with steam wagons and trucks, and after the war, they would make many great advancements in the field of agriculture. Specifically, they began making faster tractors with far better horsepower than their rivals, along with innovative new engines that could be powered by Diesel. Currently, they're best known for being Germany's civlian 'Tractor King,' but we could get them to transition towards military production to serve our army's needs. We're going to need fast vehicles to out-run our enemies and maintain our supply-lines across long-distances to fight across the globe.§!"
 GEA_hanomag_mio_desc: "$generic_mio_initial_trait_motorized_mechanized_manufacturer$\n§L$GEA_hanomag_desc$§!\n"

